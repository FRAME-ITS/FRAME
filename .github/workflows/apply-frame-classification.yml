name: Apply FRAME Issue Classification (All Issues)

on:
  workflow_dispatch:

jobs:
  classify-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load classification map (YAML → JSON)
        id: map
        run: |
          JSON=$(yq eval -o=json '.issues' .github/classification-map.yml)
          echo "json=$JSON" >> $GITHUB_OUTPUT

      - name: Get all open issues
        id: issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open"
              }
            );
            return issues.map(i => i.number);

      - name: Classify each issue
        uses: actions/github-script@v7
        with:
          script: |
            const map = JSON.parse(process.env.MAP_JSON);

            for (const issueNumber of ${{ steps.issues.outputs.result }}) {
              const entry = map[issueNumber];
              if (!entry) continue;

              // Apply labels
              if (entry.labels && entry.labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: entry.labels
                });
              }

              // Add comment
              if (entry.comment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: entry.comment
                });
              }

              // Mark as classified
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["classified"]
              });
            }
        env:
          MAP_JSON: ${{ steps.map.outputs.json }}
