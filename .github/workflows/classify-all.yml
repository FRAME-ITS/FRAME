name: Apply FRAME Issue Classification (Bulk)

on:
  workflow_dispatch:

jobs:
  classify-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load classification map (JSON)
        id: map
        run: |
          MAP=$(yq eval -o=json '.issues' .github/classification-map.yml)
          echo "MAP=$MAP" >> $GITHUB_ENV

      - name: Get list of open issues
        id: list
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open"
              }
            );
            core.setOutput("numbers", issues.map(i => i.number));

      - name: Classify each issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const map = JSON.parse(process.env.MAP);
            const numbers = core.getInput("numbers").split(",");

            for (const num of numbers) {
              const issueNumber = num.trim();
              const entry = map[issueNumber];

              if (!entry) {
                console.log(`No classification for issue #${issueNumber}`);
                continue;
              }

              // Apply labels
              if (entry.labels && entry.labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: entry.labels
                });
              }

              // Add comment
              if (entry.comment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: entry.comment
                });
              }

              console.log(`Classified issue #${issueNumber}`);
            }
