name: Apply FRAME Issue Classification (All Issues)

on:
  workflow_dispatch:

jobs:
  classify-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert classification map to JSON file
        run: |
          yq eval -o=json '.issues' .github/classification-map.yml > classification.json
          echo "Classification map converted to JSON."

      - name: Get all open issues
        id: list
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open"
              }
            );
            core.setOutput("numbers", issues.map(i => i.number));

      - name: Apply classification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const map = JSON.parse(fs.readFileSync('classification.json', 'utf8'));

            const numbers = core.getInput("numbers").split(",");

            for (const num of numbers) {
              const issueNumber = num.trim();
              const entry = map[issueNumber];

              if (!entry) {
                console.log(`No classification for issue #${issueNumber}`);
                continue;
              }

              // Apply labels
              if (entry.labels && entry.labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: entry.labels
                });
              }

              // Add comment
              if (entry.comment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: entry.comment
                });
              }

              // Mark as classified
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["classified"]
              });

              console.log(`Classified issue #${issueNumber}`);
            }
