name: Apply FRAME Issue Classification (ALL)

on:
  workflow_dispatch:

jobs:
  classify-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert classification map to JSON
        run: |
          yq eval -o=json '.issues' .github/classification-map.yml > classification.json

      - name: Get all open issue numbers
        run: |
          gh issue list --state open --json number --jq '.[].number' > issue_numbers.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply classification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Load classification map
            const map = JSON.parse(fs.readFileSync('classification.json', 'utf8'));

            // Load issue numbers
            const numbers = fs.readFileSync('issue_numbers.txt', 'utf8')
                              .split('\n')
                              .map(n => n.trim())
                              .filter(n => n !== '');

            for (const issueNumber of numbers) {
              const entry = map[issueNumber];

              if (!entry) {
                console.log(`No classification for issue #${issueNumber}`);
                continue;
              }

              const labels = entry.labels || [];
              const comment = entry.comment || '';

              console.log(`Classifying issue #${issueNumber}`);

              // Apply labels
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labels
                });
              }

              // Add comment
              if (comment.trim() !== '') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: comment
                });
              }

              // Mark as classified
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["classified"]
              });

              console.log(`✔ Classified issue #${issueNumber}`);
            }
