- name: "Non Compliance Process"
  guid: "{B8249934-8794-40bc-9887-8DCADA8ADD60}"
  package: "National Body Reference Architecture/NB Communication View/Non Compliance Process"
  type: "Logical"
  note: |
    The Delegated Regulations on SRTI, (EU) No 886/2013, and SSTP, (EU) No 885/2013 introduce an obligation for Member States to establish a National Body which will be competent to perform compliance assessment. The Delegated Regulations for MMTIS, (EU) 2017/1926 and RTTI, (EU) 2022/670, establish an obligation for Member States to assess the compliance of the stakeholders to the requirements defined in the Delegated Regulations. In practice, the Member State will be represented by a National Body which will be competent to perform a compliance assessment.
    The compliance assessment performed for a stakeholder who has submitted a self-declaration may result in verdict "pass" or "fail". In practice, the "pass" verdict is given in a situation in which the results of the compliance assessment did not indicate non-compliance of the service or data covered by the assessment.
    
    Based on the defined compliance assessment process, the identification of non-compliance based on random inspections might be the result of the:
    1. Theoretical assessment (according to compliance assessment form)
          - Check Self-declaration and accompanying documents for formal criteria
          - Check National Access Point entry for data description
    
    
    2. Content assessment (according to compliance assessment form)
    i. Check content of the provided information (self-declaration and accompanying documents)
    ii. Check data access on the National Access Point
    iii. Check data sets regarding the requirements
    
    In its current form, the Delegated Regulations include no obligation to provide guidance regarding an individual data set or a service.
    
    Handling non-compliance identified through random inspections and/or based on individual complaints for non-compliant data and/or services, could follow either a positive approach or a stricter one.
    Generally, the positive approach should be preferred in order to repair non-compliant data or services and further support avoiding non-compliance in the future. A positive approach would comprise:
    
    	- supporting the providers in better understanding the requirements of the Delegated Regulations and providing appropriate data and services
    	- providing technical assistance for appropriately managing and publishing data on the NAP
    	- friendly communication between the NB or the NAP operators and the non-compliant providers
    	- recognizing and rewarding the timely response of providers to requests for corrections of data and services in order to become compliant
    	- By social rewarding (e.g. publishing which data set(s) have received a positive assessment to the larger public. This can be done for example through a newsletter, LinkedIn-post or a label on the NAP).
    
    On the other hand, a stricter approach could involve:
    
    	- social blaming including publicly announcing non-compliant providers
    	- administrative sanctions such as exclusion from NAP, potentially limited access to other data/services etc, probably associated with the impact or the repetitiveness of non-compliance
    	- monetary penalties increasing with the impact of non-compliance or in case of repetition
    
    Although the positive approach is strongly recommended, it might be considered less effective. The final decision on how to handle non-compliance strongly depends on:
    
    	- the national legislation governing the operation of the NB and the NAP in each Member State
    	- the existing national enforcement and penalty system in each Member State
    	- the general approach followed by the competent authorities in each Member State taking into account the local cultural and social characteristics (e.g. Is there a help and support culture? Is social blaming accepted?)
