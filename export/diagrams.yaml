- name: "00 NAP Motivation Layer"
  guid: "{C78D0BD5-B447-4b98-A810-557ADA5B59C9}"
  package: "NAP Reference Architecture/00 NAP Motivation Layer"
  type: "Logical"
  note: |
    A National Body (NB) typically refers to an organization, institution, or entity that operates at a national level. These bodies are established by the government or recognized by authorities to oversee, manage, regulate, or represent various aspects of national affairs. In this context the main task of a NB is to support the quality of mobility data and services by an assessment process.
    
    In line with the legal framework of the ITS Directive 2010/40 and related Delegated Regulations a NB operates in the field of mobility. A NB is designated by a government and has to be impartial and independent from data providers and service providers.
