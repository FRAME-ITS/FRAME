- name: "01_Access KPIs"
  guid: "{80B9841A-E4FF-4911-86D3-49424778657C}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    The first feature of this subset involves the public availability of NAPs over the web, enabling its direct use by all interested users without any human intervention. By providing the weblink, each user gains access to the NAP immediately without the need of further authentication processes.
    Another important feature of this subset involves the NAP compliance to web design standards and best practices. This refers to concepts, such as simplicity, visual hierarchy, navigability, consistency, responsivity, accessibility, conventionality, credibility, and user-centricity. In this respect, important properties of NAPs have been deemed: the easiness of getting access to NAP publications and metadata of data resources, the hierarchical arrangement of NAP contents, the existence of functionalities easing navigation, as well as the homogeneity of NAP contents (e.g., control functionalities are located in the same position).  The inclusion of the English language apart from the national one is the next important feature of NAPs. Providing the NAP services in English extends the accessibility of the NAPs considering that ITS service providers, who can be addressed as the main data consumers of NAPs, may originate from different European countries.
    NAPs should also follow the EU data protection policies and security standards to safeguard the included information and stored data (paying increased attention to personal and sensitive data). Another feature is the requirement of the data publishers to be registered for adding their datasets. This requirement improves the security of the NAPs, facilitates the authentication of data providers, and provides enhanced control to their activity.
    Data consumers need to register to have full access to all features of a NAP, they need to be registered. This requirement facilitates the authentication of data consumers, the controlled provision of access to certain resources, and the monitoring of their activity (which may be useful for statistical analysis of the content of NAPs). In addition, through this requirement data consumers can customize the NAP’s user experience. It is important to note that this requirement should not necessarily be addressed as mandatory, given that the purpose of several NAPs across Europe may be the sharing/exchange of open data. In this respect, the NAP may have been designed utilizing data management systems complying with the open data principles. In any case, the registration of data consumers should be simple and straightforward, making security and privacy policies clear. Moreover, in line with this principle, the provision of access to an open NAP publication might be achievable without registration prerequisites.
    The next feature classified in the “access” subset involves the existence of Application Programming Interfaces (APIs) facilitating automated access and exchange of data. It is considered as an appropriate feature given that it promotes an important property of NAPs, namely machine-to-machine communication, and information exchange. Indeed, through APIs, data consumers can receive dynamic data and information when they become available from their source without human intervention, thus enabling the immediate circulation of information.
    The final feature of this subset involves the visualization functionalities of NAPs. Visualization allows users to gain insight into the content of the data at a quick manner. In that way and even though visualization cannot be addressed as a NAP’s requirement, users can pay increased attention to important – for their purposes – datasets and data areas and easily assess their relevance.
  elements:
    - "KPI 1.1 Online availability"
    - "KPI 1.10 Security – providers verification"
    - "KPI 1.11 Personal data protection"
    - "KPI 1.12 Procedure for input of metadata or data to the NAP"
    - "KPI 1.13 Metadata output and access restrictions"
    - "KPI 1.14 Data security and access restrictions for data uploading"
    - "KPI 1.15 Data security and access restrictions for data downloading"
    - "KPI 1.16 Indication of data modification"
    - "KPI 1.17 Data transfer optimization"
    - "KPI 1.18 API usage for data transfer"
    - "KPI 1.2 Compatibility with web browsers"
    - "KPI 1.3 Web performance – latency"
    - "KPI 1.4 Responsiveness"
    - "KPI 1.5 Web performance – Simplicity / usability"
    - "KPI 1.6 Data visualization"
    - "KPI 1.7 Web performance – Consistency and navigability"
    - "KPI 1.8 Support of commonly used languages"
    - "KPI 1.9 Security – Technical"
    - "NKLF Reference"
- name: "02_Communication KPIs"
  guid: "{ECDE6709-F5AE-489c-8A22-521920F1B501}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    The second subset concerns communication features of NAPs. NAPs should provide help desks, emailing support and messages services in order to give explanations to data publishers when needed. Through this feature many misunderstandings can be avoided during, for instance, the process of uploading data and metadata.
    The promotion of NAPs is another important feature. To ensure that NAPs will play a key, impactful, and sustainable role within the ecosystem of Intelligent Transport Systems and the corresponding value chains, they should strive to attract even more data providers and data consumers. In this respect, the promotion of NAPs to several events and initiatives at both a national and international level is considered crucial.
    Moreover, the facilitation of direct communication between data consumers and data providers is deemed an important feature of NAPs, given that data consumers can efficiently resolve any open issues in collaboration with data providers without the intervention of the NAP operator. This feature also enhances trust between publishers and consumers by showing to the consumers that data publishers care about their needs.
    It is also important that NAP itself can provide mass notifications to its users (including both data providers and data consumers) about changes in its content, functionalities, operational procedures, and/or data exchange policies. By that means, the users get directly aware and account for these changes.
  elements:
    - "KPI 2.1 Support to users to register or add data/metadata"
    - "KPI 2.2 Related services monitoring functionality"
    - "KPI 2.3 Related services built on the data offered at the NAP"
    - "KPI 2.4 NAP promotion – number of channels"
    - "KPI 2.5 NAP promotion – number of publications"
    - "KPI 2.6 Contact means"
    - "KPI 2.7 Mass notifications – data providers"
    - "KPI 2.8 Mass notifications – data consumers"
    - "NKLF Reference"
- name: "03_Data Discovery KPIs"
  guid: "{A606BA71-53B3-43be-A57F-A906077FD038}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    The first feature of the data discovery subset involves the traceability of data hosted by/made available through NAPs. This feature is associated with the availability of discovery services and searching functionalities, such as engines and search masks supporting querying and filtering.
    Another feature classified in the discoverability subset involves the provision by a NAP of the appropriate metadata enabling the exploitation of (any available) discovery services. It should be noted that metadata is an important aspect for the reusability and discoverability of data resources, providing additional information that helps data consumers better understand the meaning of data, its structure, and to clarify other issues, such as usage rights and license terms. If insufficient metadata are provided, the actual data resources would not be easily discoverable and, thus, exploitable by parties other than the data providers.
    Another important, not yet mandatory, feature is the machine readability of metadata enabled through exportability using certain formats (e.g., XML and RDF DCAT-AP streams). In principle, it should be bear in mind that metadata should facilitate the discovery of data by both human and machines.
    Finally, the last feature included in that subset, which can also be addressed as non-mandatory, constitutes the support for map-based search of datasets. Web maps can provide a more advanced way of searching, allowing NAP users to search at national, regional and local level, for data elements and resources.
  elements:
    - "KPI 3.1 Search functionalities"
    - "KPI 3.2 Search results"
    - "KPI 3.3 Machine-readable metadata"
    - "NKLF Reference"
- name: "04_Update and Maintenance KPIs"
  guid: "{83DDBBEF-FC8A-46c2-85D0-859C6B951CAF}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    The NAP service should be maintained and updated constantly. This can include aspects such as software maintenance and updates, backups, and hosting. This feature encompasses the update frequency of information provided by/through NAPs given the evolving and changing over time nature of data. To this end, data providers should check and update their publications, allowing data consumers to be up-to-date.
    It is also worth mentioning that NAPs should be monitored and evaluated in a periodical basis. This includes several dimensions, such as the usage of data (e.g., downloads, page views, re-use), system performance (e.g., downtime and consequences for other systems), and feedback received by data consumer and providers on the efficient (or not) operation of the platform. Further to the above, it is deemed important for NAP operators to monitor and evaluate the impact of their platform to the development of services and applications by calculating metrics and gathering feedback.
  elements:
    - "KPI 4.1 IT services"
    - "KPI 4.2 Content and metadata"
    - "KPI 4.3 Monitoring and evaluation"
    - "NKLF Reference"
- name: "05_Dataset information KPIs"
  guid: "{C49C7427-05B7-4169-88E7-6D4DC36CCDAA}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    The features included in this subset revolve around the extent to which datasets are described to a satisfactory extent to ensure that data consumers can easily understand and assess whether a dataset is within their interests. This subset also includes the classification/encoding of NAP datasets according to standard/controlled vocabularies or dictionaries (e.g., DCAT-AP or formal terminology provided by the Delegated Regulations supplementing the ITS Directive) to reduce their ambiguity and promote machine understandability.
  elements:
    - "KPI 5.1 Documentation & description of datasets"
    - "KPI 5.2 Classification of datasets"
    - "NKLF Reference"
- name: "06_Interoperability KPIs"
  guid: "{75EC13A8-A662-4db8-A156-4BA6D7A8355F}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    Features included under the interoperability subset aim to ensure that NAPs operate in a compliant/common manner and can efficiency communicate with each other as well as exchange information if needed. An example of this feature constitutes the adoption of the so-called Coordinated Metadata Catalogue, ensuring a common approach towards the publication of metadata or at least the publication of a common minimum set of metadata. Another example constitutes the ability of NAPs to harvest and index datasets from other NAPs. However, the latter should not be addressed as mandatory given that data harvesting presupposes that two NAPs are instances of the same data management/data catalogue systems (e.g., CKAN).
  elements:
    - "KPI 6.1 Metadata specification"
    - "KPI 6.2 Harvesting functionalities"
    - "NKLF Reference"
- name: "07_Data Exchange and Operational"
  guid: "{736C1A84-441C-4356-9958-B958DBB83E83}"
  package: "NAP Reference Architecture/Supplements/KPI Framework"
  type: "Logical"
  note: |
    The features included in the data exchange and operational policy subset, firstly, aim to ensure that NAPs provide clear descriptions of the terms and conditions for data re-use and of their operational procedures. Terms and conditions for data re-use set out the ways in which data hosted in/accommodated through NAPs can and cannot be re-used. The clarification of the terms and conditions for data re-use, despite not being directly the responsibility of NAP operators, is deemed important because by that means disputes between data providers and consumers can be avoided and the estimation of the impact of data hosted in/provided through NAPs can be facilitated (e.g., through attribution obligations). In this respect, NAPs should make the best effort to facilitate the clarification of these terms and conditions by providing, for instance, data providers with prespecified licenses to be selected during the publication of a new dataset. On the other hand, the clarification of the operational procedures of a NAP eases the understanding of the role and responsibilities of all actors involved in the NAP ecosystem (i.e., NAP operator, data providers, data consumers). This can be supported, for instance, by the inclusion in the NAP of a brief set of instructions, providing guidelines and explanations on: a) the user types and their access rights, b) how a user can be registered and authenticated, c) how datasets can be published, and d) how often should datasets be updated.
    The features included in the data exchange and operational policy subset, secondly, aim to ensure that NAPs endorse the provision of high-quality data that simultaneously comply with the requirements set by the Delegated Acts of the ITS Directive. In this respect, it would be beneficial if NAPs enable data providers to indicate the quality of provided data or ideally set quality requirements. However, the latter feature should not be mandatory given that it most closely resembles digital clearing houses and data marketplaces. Moreover, it would be beneficial if NAPs promote and monitor the provision of self-declarations on behalf of data providers, thus facilitating the activities of Nominated Bodies relating to the declaration of compliance of datasets published in the NAPs.
    Finally, a desirable property of the NAPs revolves around the consolidated coverage of data types included in all Delegated Regulations supplementing the ITS Directive. Through this property NAPs are understood as a single point of access to data resources required to support the uptake of Intelligent Transport System services as well as of newer concepts, such as Mobility as a Service and Urban Vehicle Access Regulations.
  elements:
    - "KPI 7.1 Data reuse – NAP"
    - "KPI 7.2 Data reuse – data provider"
    - "KPI 7.3 Operational procedure information"
    - "KPI 7.4 Dataset indicators"
    - "KPI 7.5 Compliance assessment"
    - "KPI 7.6 Association of published datasets with Delegated Regulations"
    - "KPI 7.7 Quality indicators for datasets"
    - "NKLF Reference"
