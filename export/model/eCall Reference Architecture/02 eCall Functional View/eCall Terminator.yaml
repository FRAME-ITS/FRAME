alias: ""
version: "1.0"
note: |
  As Terminator in eCall are defined:
  
  	- Objects or Person who activate an eCall in the vehicle
  
  
  	- Organizations (MNO's) which transfer the MSD to the next relevant PSAP
  
  
  	- Organization, application or person who close an eCall
