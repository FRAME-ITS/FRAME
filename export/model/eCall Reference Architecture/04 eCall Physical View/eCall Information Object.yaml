    note: |
      The following datalists the minimum set of data (MSD) that shall be conveyed during the eCall data transmission to the PSAP.
      The exact format and content is subject to national regulations.
      Additional mandatory or optional elements may be subject to national regulations.
      automaticActivation
      testCall
      positionCanBeTrusted
      vehicleType
      VIN
      vehiclePropulsionStorageType
      timeStamp
      positionLatitude
      positionLongitude
      vehicleDirection
