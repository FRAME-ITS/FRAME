  - name: "Member State"
    guid: "{F726C13D-F0ED-43f5-8A86-D764CBB69491}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This stakeholder is reliable for the implementation and national enforcement of the delegated regulation and nomination of the organisations to handle eCall properly.
      
      Commission Recommendation 2011/750/EU (4) on support for an EU-wide eCall service in electronic communication networks for the transmission of in-vehicle emergency calls based on 112 (‘eCalls’) advises Member States to indicate the eCall PSAP to route eCalls and to ensure that mobile network operators handle eCalls properly.
      
      Without prejudice to Directive 95/46/EC, Member States shall take into account, when deploying the eCall PSAPs infrastructure, the ‘Working document on data protection and privacy implications in eCall initiative’ adopted by the Article 29 Working Party on 26 September 2006 (1609/06/EN — WP 125).
      
      Member States shall designate the authorities that are competent for assessing the conformity of the operations of the eCall PSAPs with the requirements listed in Article 3 and shall notify them to the Commission. Conformity assessment shall be based on the part of the standard ‘Intelligent transport systems — eSafety — eCall end to end conformance testing’ (EN 16454) that relates to PSAPs conformance to pan-European eCall.
