  - name: "Mobile Network Operators"
    guid: "{05CCCCC2-B6E8-4f4b-9ABB-BA3D1828BFD1}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Article 26 of Directive 2002/22/EC of the European Parliament and of the Council of 7 March 2002 on universal service and users’ rights relating to electronic communications networks and services (Universal Service Directive) (2) requires that calls to the single European emergency call number 112 are answered appropriately and handled in a manner that is best suited to the national organisation of emergency systems, including the emergency call response centres (public safety answering points).
      
      
      
      ‘mobile wireless communications network’ means wireless communications network with homogeneous handover between network access points;
      
      ‘public mobile wireless communications network’ means mobile wireless communications network available to the public in accordance with Directive 2002/22/EC and with Directive 2002/21/EC of the European Parliament and of the Council (7);
