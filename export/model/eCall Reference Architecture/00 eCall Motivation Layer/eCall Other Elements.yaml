  - name: "Global Task - Business Rule: Project related expectations/benefits (Shortterm)"
    guid: "{6757FDF9-CD2F-4705-AC83-36BB8AC0A916}"
    type: "Class"
    stereotype: "MissionStatement"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Consequences for travelers involved in road accidents are much lower, when the time to be treated by medical assistance is lowered. This reduces the number of traffic deaths and the consequences of accidents.
      Traffic gets fluent faster after the first road accidents at a specific place is cleared faster, by getting to the road site faster and more informed about the vehicles and travelers involved.
      
      
      	- Traveler wants to be reached fastest after an accident happened.
      	- transfer all accident related MSD´s to the PSAP data interface in all member states with minimal delay times.
      	- Public authority operates PSAP for all activated eCalls in the area.
    links:
