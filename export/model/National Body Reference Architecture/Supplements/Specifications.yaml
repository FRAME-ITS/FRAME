elements:
  - name: "Accompanying Documents"
    guid: "{E658AAFB-2923-41e3-BFA8-0B79A2B57C3D}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Accompanying documentation shall be provided by the data/service provider that provides (meta)data in accordance with the respective Delegated Regulations on the NAP. The information in the accompanying documentation shall support the National Body in carrying out the compliance assessment. If existing organisational documents provide answers or information to requested topics, they shall be added to the annex of the accompanying documentation. Per Delegated Regulation one template for the accompanying documentation was prepared within NAPCORE. The templates are linked in the table below.
      The latest version of the accompanying documents could be found here:
      
      https://napcore.eu/national-bodies-3/
  - name: "Directive (EU) 2023/2661"
    guid: "{C3C38386-12EB-44c2-8976-75E3D86C7AD2}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Directive (EU) 2023/2661 of the European Parliament and of the Council of 22 November 2023 amending Directive 2010/40/EU on the framework for the deployment of Intelligent Transport Systems in the field of road transport and for interfaces with other modes of transport
      
      https://eur-lex.europa.eu/legal-content/en/TXT/?uri=CELEX:32023L2661
  - name: "Guidline and Timelines"
    guid: "{80021436-2426-48b8-924C-F76DC5D338BC}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The timings and other guidelines will be found in the planed handbook published by NAPCORE X.
      
      This includes:
      
      Indication of a time line
      Information time point for stakeholder
      Dates and timelines of Delegated Acts
      Timeframe for Assessment, Reception and answers
      Time horizon  for a self-declaration
      Time horizon for a compliance assessment results
