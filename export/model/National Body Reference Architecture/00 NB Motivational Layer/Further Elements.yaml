  - name: "National Body Mission_Statement"
    guid: "{19CCAB3F-C533-4107-9E55-E64EF97E7204}"
    type: "Class"
    stereotype: "FRAME_Mission_Statement"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      NBs/CAs are established by the government or recognized by authorities to oversee, manage, regulate, or represent
      various aspects of national affairs.
      This project has received funding from the European Commission’s Directorate General for Transport and Mobility under Grant Agreement no. MOVE/B4/SUB/2020-123/SI2.8522338
      In this context the main task of a NB/CA is carrying out compliance assessment, validation of stakeholder self-
      assessments against the Delegated Regulation obligations, and to ensure that the requirements of the Delegated Regulation are respected.
