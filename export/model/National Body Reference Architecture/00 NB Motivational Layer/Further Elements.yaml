    note: |
      The National Body (NB) or Competent Authority (CA) of a Member State has specific tasks related to the Delegated Regulations of the ITS Directive 2010/40/EU, which are requested by the European Commission.
      The main task is to validate the fulfillment of the articles of each Delegated Regulation by data publishers, service providers and NAP.
