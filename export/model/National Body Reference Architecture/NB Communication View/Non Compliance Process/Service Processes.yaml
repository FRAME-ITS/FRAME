    note: |
      When reporting a non-compliance, the data users should be urged to provide a clear description of the non-compliance case they have identified, providing as much information as possible. Their own contact details should also be available to the NAP operator so that they can be reached if additional information is needed or even for a follow-up communication about the treatment of the non-compliance case, depending on the communication policy of each NAP. The NB should support the data users for reporting complaints by having a help center (including info, FAQs, helpdesk etc) operating within the NAP.
    links:
