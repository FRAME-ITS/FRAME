  - name: "Random inspection of the self-declaration or the accompanying documents indicates non-compliance"
    guid: "{0B142C7E-8FB3-4b74-B4FA-E7FE2D238380}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Based on the compliance assessment process as defined in Milestone M5.3, it is clear that the non-compliance process is a follow-up process to the Compliance Assessment rather than an independent process. Specifically, random inspections of submitted self-declarations and the accompanying documents may result in the identification of non-compliance, which is documented through the compliance assessment results form.
      Based on the defined compliance assessment process, the identification of non-compliance based on random inspections might be the result of the:
      
      	- Theoretical assessment (according to compliance assessment form)
      
      
      	-
      	-
      	-
      	-
      	-
      	- Self-declaration and accompanying documents check for formal criteria
      	- National Access Point check for data description
      
      
      
      
      
      
      
      
      
      
      
      
      	- Content assessment (according to compliance assessment form)
      
      i. Content of the provided information check (self-declaration and accompanying documents)
      ii. Data access on the National Access Point check
      iii. Data sets regarding the requirements check
      
      The Delegated Regulations enacted under the European ITS Directive define obligations for several stakeholder groups to register data or services on the National Access Point, otherwise make it available and establish other obligations related to services and data (e.g. to provide data in a standardised format). It is possible that the National Body encounters situations in which the stakeholder does not make the data or service available as required by the applicable Delegated Regulation or does not register it to the NAP. In these cases, the stakeholder will most likely not have submitted a self-declaration to the National Body.
      The task of the National Body to request a self-declaration and the obligation of a service provider, data provider or other stakeholder to submit a self-declaration have been expressed in different ways in the Delegated Regulations on RTTI, SRTI, MMTIS and SSTP. The Delegated Regulations use different wordings regarding compliance assessment, provision of self-declaration and processing the self-declaration.
