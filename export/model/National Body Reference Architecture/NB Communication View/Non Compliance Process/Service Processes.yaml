    note: |
      Most probably, individual end-users of the NAPs may be able to identify non-compliance on specific data that are more related to their own specific tasks and interests. In order for end-users to be able to make individual complaints and report non-compliance, it is critical that the necessary communication channels between the end-users and the NAP operators are available and properly operating. Such channels should include, a postal address, and/or a phone number, and/or an email address and and/or an on-line communication form.
      Beyond the official compliance assessment process based on random inspection, non-compliance may also be identified through the actual use of the data or services provided in the NAPs. End users may identify different forms of non-compliance such as:
      
      	- lack of specific required data and/or services
      	- outdated data
      	- inconsistent data
      	- data of poor quality (e.g. missing or wrong values)
