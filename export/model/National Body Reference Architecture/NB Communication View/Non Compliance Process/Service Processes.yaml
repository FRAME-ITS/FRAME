  - name: "Identify possible actions which are proportional to the objectives when applied individually or as a package"
    guid: "{7615DF18-80CE-44f4-A8A0-6AC788682D66}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      In its current form, the Delegated Regulations or the ITS Directive define no administrative powers for the NB to address non-compliance. Moreover, the Delegated Regulations or the ITS Directive define no procedure for a situation in which the results of compliance assessment (based on random inspections) indicate non-compliance in a service or a data set. The options available to the NB are therefore subject to national regulations. The extent to which the NB is legally authorized to intervene in case of non-compliance and the type of actions it can take (e.g. rejection of submitted self-declarations, monetary penalties, administrative sanctions, recommendations and suggestions) depends on the legal basis of the establishment of each NB. However, such details might not be defined in all Member States.
      Assuming that the NB has the legal authority to impose sanctions in case of non-compliance, these actions should ideally be based on the assessment of the impact of the specific type of non-compliance. Nevertheless, impact assessment of non-compliance may be very challenging. National Bodies are likely to encounter different types of non-compliance, of various levels, with different causes, in different contexts and with a wide qualitative scope of impacts. The stakeholders may also be very diverse and have varying levels of cooperation with the National Body. In the context of assessing non-compliance, the impacts of non-compliance may have already occurred at the time of compliance assessment or they may occur in future with more or less certainty. In the first case, the NB may have no means to determine with certainty how the world would have evolved had the data or service been compliant (e.g. in a situation in which a compliant service or data set has never been available). In the latter case, the NB will be able to determine the impact and its likelihood to occur but will not know with certainty whether the impact will occur or not.
      The National Bodies can be expected to be experts in the field and to know and understand the typical use cases for the data and services covered by the Delegated Regulations. On the other hand, it may be unreasonable to assume the NB to have a complete and up to date picture of all possible uses of the data, including the less known users and use cases. Some use cases of the data or services may also be novel and not anticipated or predictable.
      It should also be noted that the impact of non-compliance is not the only factor that the NB should consider in selecting its actions. In addition, the National Body should consider which action or package of actions best corresponds to the objectives of the Delegated Regulations and the ITS Directive. These considerations can be very practical, e.g. not removing a data set from NAP due to minor quality defects.
      Actions taken to address non-compliance may differ based on the results of the impact assessment. Reacting the same way to all non-compliance cases might be open to criticism depending on the actions taken. The impact of non-compliance is likely to differ from case to case. The more severe the impact is, the wider scope of actions is likely to be considered as reasonable and proportional for the NB. If the reaction is the same for all instances of non-compliance, the National Body may end up doing "too little" in cases with serious impacts or doing "too much" in case of minor compliance issues.
      Actions could also gradually increase the consequences for non-compliance depending on the severity and on the repetitiveness of non-compliance.
      Specifically concerning the treatment of non-provision of data, the same general principles for action apply. As an example, in Belgium, three relevant tasks are defined for the control body:
      
      	- Check if everyone that should register data has done so (based on stakeholder list – the difficulty here is to make this list, keep it up to date, have the right contact details etc.)
      	- Run thorough compliance assessment based on random selection of datasets that are registered on the NAP
      	- Investigate complaints from data re-users about data on the NAP (or complaints about data that should be on the NAP but is not or complaints from data-owners about incorrect re-use of their data).
    links:
