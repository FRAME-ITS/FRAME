  - name: "Initiate the actions prescribed in the decision on non-compliance and consequences of non-compliance"
    guid: "{77E39EED-5D44-4837-86A7-1D4FE22A5348}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The actions of the NB should be proportional to the objective and the expected benefit to be achieved with the action. Therefore, increasing consequences should be clearly justified. The societal acceptance of serious consequences such as penalties will likely depend on the expected consequences of violating the applicable Delegated Regulation.
      It is also important that the consequences of non-compliance are applied in a transparent way, taking into account equal treatment of stakeholders.
      Penalties or other consequences could be justified e.g. in situations in which the infringement of the Delegated Regulation causes a safety risk for road users, otherwise compromises safety, involves significant negative impact on markets or development of ITS services, or has significant negative impacts on environment.
      Based on the above, it is preferable to start with educating the stakeholders on the obligation to submit a self-declaration, as many of them may have limited awareness of the Delegated Regulations and their interpretation.
