  - name: "National Law or Contract MS - NB"
    guid: "{0BDE8A5E-CC0E-4fa9-89DD-1DCD42A5AA0B}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Parties: Member State (MS) and National Body.
      Objective: Setting up the framework and responsibilities of the National Body operation.
      From: National law implementing the ITS Directive and direct execution of EU Regulations and Delegated Acts or a contract for nonessential parts of the National Body
      Obligations:
      
      	- Member State to National Body:-
      
      
      	- National Body to Member State:
      
      
      	- To identify relevant stakeholders (content provider) that are obliged to make data accessible via NAP.
      	- To periodically and randomly assess the compliance of the Content Providers  with the Law.
      	- To provide information about the performed compliance assessment to the MS.
      	- To cooperate with NAP on the implementation of the ITS Directive.
