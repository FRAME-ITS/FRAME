  - name: "National Law or Contract MS - NAP"
    guid: "{9A594D51-2CA2-4048-B043-981F4DF70F2D}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Parties: Member State and Content Provider.
      Objective: To identify  Content Providers and set up obligations of the Content Provider s.
      Form: National law implementing the ITS Directive and direct execution of EU Regulations and Delegated Acts.
      Obligations:
      
      	- Member State to Content Provider: ---
      	- Content Provider to Member State:
      
      
      	- To ensure that data is provided in a correct format to the content consumers under fair, reasonable and non-discriminatory (FRAND) conditions.
      	- To publish relevant information about data/services (e.g., metadata) and information on the data quality at the NAP.
      	- To provide data compliant with the EU requirements (provide self-declaration towards the NAP and National BodyNational Body and assistance in case further proof of compliance is required).
      	- To ensure that required data is updated at the appropriate and recommended time intervals.
      	- To provide a description of the data, digital map or real-time traffic information services they provide as well as the information on the quality thereof and the conditions of re-use of these data and an evidence-based declaration of compliance to the National BodyNational Body.
      	- To cooperate in the compliance assessment process.
      
      
      
      
      Reference to the EU law:
      The obligations of the content provider are related to the following laws:
      
      	- National law transposing 2010/40/EU (ITS Directive)
      	- 886/2013 (SRTI)
      	- 885/2013 (SSTP)
      	- 2015/962 (RTTI valid until 31. December 2024)
      	- 2017/1926 (MMTIS)
      	- 2022/670 (RTTI  in force from 1. January 2025)
      	- 2023/1804 (AFIR)
      	- National law transposing 2023/2661 (ITS Directive amendment)
      	- 2024/490 (MMTIS amendment)
      
      
      Selected references to the law:
      
      	- For the sole purposes of providing the information service, public and private road operators and/or service providers shall set up or use the means to detect events or identify conditions, and shall collect the relevant road safety-related traffic data. The deployment of these means shall comply with the conditions and requirements set out in national law. [886/2013, art. 6].
      	- Public and/or private road operators and/or service providers shall share and exchange the data they collect pursuant to art. 6 of DR 886/2013. For that purpose, they shall make these data available in the DATEX II (CEN/TS 16157) format or any fully compatible and interoperable with DATEX II machine-readable format through an access point [886/2013, art. 7].
      	- Public or private parking operators and service providers shall share and exchange data referred to in paragraph 1 of art. 4 of DR 885/2013. For these purposes, they shall use DATEX II (CEN/TS 16157) format or any DATEX II compatible international machine-readable format. Data shall be accessible for exchange and reuse by any public or private information service provider and/or parking operator on a non-discriminatory basis and in accordance with access rights and procedures defined in Directive 2003/98/EC [885/2013 art. 5].
      	- Road authorities and road operators, in cooperation with digital map producers and service providers (any public or private provider of a real-time traffic information service, excluding a mere conveyer of information, to users and end-users), shall ensure that they provide the appropriate metadata in order to allow users to discover and use the datasets to which access is provided through the national access points [2015/962 art. 3].
      	- The travel and traffic data listed in the Annex and the corresponding metadata including information on the quality thereof shall be accessible for exchange and reuse within the Union on a non-discriminatory basis, via the national access point set up in accordance with Article 3 and within a timeframe allowing reliable and effective reuse of the data. Such data shall be accurate and up to date and based on minimum data quality requirements [2024/490 art. 8].
      	- The data referred to in paragraph 1 and the corresponding metadata including information on the quality thereof shall be accessible for exchange and re-use by any data user within the Union:
      
      
      	- (a) on a non-discriminatory [2022/670, art. 4, par 2, art. 5, par 2]
      	- (a) on a non-discriminatory basis when provided by road authorities and road operators; [2022/670, art. 6 par 2, art. 7, par 2]
      	- (b) following minimum quality requirements that Member States shall agree upon in cooperation with relevant stakeholders;
      	- (c) within a time-frame fitting to the reliable and effective use of the data to create real-time traffic information;
      	- (d) via the national or common access point referred to in Article 3;
      
      
      
      
      
      	- National Body (competent authorities of the Member States) may request from the data holders and travel information service providers the following documents: [2024/490 art. 9]
      
      
      	- a description of the travel and traffic data accessible via the national access point, the information on the quality thereof and the conditions of reuse of that data;
      	- a description of the travel information services available including connections with other services where applicable;
      	- an evidence-based declaration of compliance with the requirements set out in Delegated Regulations;
      	- the licence or contractual agreements with travel information service providers.
