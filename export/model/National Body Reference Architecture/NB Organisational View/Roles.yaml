  - name: "National Body / Competent Authority"
    guid: "{DB0FFB19-1B79-4dbd-9F2B-5B224D345C66}"
    type: "Object"
    stereotype: "FRAME_Role"
    keywords: "National Body, Role"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Key Issue": ""
      "Role Part Of Value Chain": ""
      "Role Value": ""
      "Role View": ""
    note: |
      According to the delegated regulations enacted under the ITS Directive 2010/40/EU
      Member States shall designate an impartial and independent national body competent to assess whether the requirements set out in Articles 3 to 8 are fulfilled by public and private road operators and service providers and broadcasters dedicated to traffic information. Two or more Member States may designate a common body competent to assess compliance with these requirements on their territories.
      
      Member States shall notify the national bodies to the Commission.
