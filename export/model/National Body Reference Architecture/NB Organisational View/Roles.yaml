    note: |
      Actor "Data or service provider" refers to any stakeholder who has an ITS service or a data publication covered by any of the delegated acts enacted under the European ITS Directive and therefore has an obligation to submit a self-declaration.
  - name: "European Commission"
    guid: "{1EC60CD8-B204-450d-9238-47BEC17A4785}"
    type: "Object"
    stereotype: "FRAME_Role"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Key Issue": ""
      "Role Part Of Value Chain": ""
      "Role Value": ""
      "Role View": ""
    note: |
      The European Commission may adopt delegated acts under the scope of the European ITS Directive (Directive 2010/40/EU). The Commission may adopt specifications to ensure compatibility, interoperability and continuity of services, especially for the priority actions and priority areas defined in the directive. The Commission shall establish a working program indicating the specifications to be developed and data types to be made available by Member States. The Commission also receives reports from Member States on the implementation of the Directive and related delegated acts and provides templates to be used in reporting from Member States to the Commission.
