  - name: "Manage Stakeholder List"
    guid: "{35C53FD1-0C8A-49dc-85AE-E2D72F886A54}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body has to manage a list of stakeholders to perform stakeholder SD requests, keep track of the status of stakeholders and for any other request. The stakeholder list has to be established and maintained in compliance with GDPR which means that only necessary information should be included and stored.
      
      The initial list of stakeholders is formed on the basis of the state register (e.g. register of legal units, business register, etc.) and field research and is constantly updated.
      
      Create a list of respondents to whom the request for information will be sent.
      Requirements: Based on common criteria (agreed within NAPCORE) a list of respondents will be created. Respondents from the list will be requested to provide information/documents for the compliance with the requirements set out in the delegated act.
    links:
