  - name: "Management of self-declaration"
    guid: "{12F2142B-1179-455b-9F44-335FE9CBB4D2}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Registration, Stakeholder, Self Declaration"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The management of the self-declaration describes a basic work principle of <ins>a </ins>NB.
      
      The principles for processing self-declarations are:
      (1) Self -declarations have unique identifiers
      (2) Self-declarations received and accepted by the national body are immutable
      (3) Self-declarations are stateful (always have a defined status)
      (4) Self-declarations can be withdrawn by the stakeholder (e.g. when a newer version has been provided by the stakeholder or when the service or data provider ceases to provide the service or data publication) or moved to state "inactive" by the national body (when the stakeholder ceases to exist).
      Inactive, rejected or withdrawn SD's can be stored in alignment to GDPR for statistical reasons, but should not be used for compliance assessment.
