  - name: "Access Information on NAP"
    guid: "{0C0582A3-C5C5-4ea0-8504-DE328D35C702}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "NAP, National Access Point, Stakeholder, Self declaration"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body should be able to access stakeholder information and metadata about data sets and data services on the NAP. This accessed information is needed for the validation of the stakeholder and the self-declaration.
  - name: "Compliance Assessment"
    guid: "{91C7B206-E453-4ab9-B0B6-D08FDE6075D8}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The purpose of compliance assessment is defined in the delegated acts established under the European ITS Directive 2010/40/EU. The delegated acts also define the tasks of National Bodies to be nominated by Member States. To successfully start their tasks and to prepare for compliance assessment the National Bodies need to plan the execution of compliance assessment per Delegated Regulation on national level.
      
      A National Body should be capable to perform at least 1 compliance assessment per year for delegated regulation where active self-declarations exist.
      
      The National Body should direct its efforts to perform compliance assessments according to the number of active self-declarations related to each delegated act.
