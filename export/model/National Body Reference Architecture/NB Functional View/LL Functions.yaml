  - name: "Handling Non-Compliance"
    guid: "{1D8C33F8-CF43-44a6-8E15-D5CC49B29943}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The details of the non-compliance process are not described in the delegated acts. It was a decision of the NAPCORE that harmonisation up to a certain degree is recommended throughout Europe.
      The non-compliance process describes how the National Body should react to non-compliance identified in compliance assessment or other ways. Details are shown within the Non-compliance process description.
