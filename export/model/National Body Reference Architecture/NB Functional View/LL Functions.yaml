  - name: "Validation of completeness"
    guid: "{3D931997-C649-47cd-B6F6-261C8137D773}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Validation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body has to validate stakeholder contact details. At minimum, the National Body shall validate that all required contact details have been provided. The National Body may validate contact information of the stakeholder based on business registration or VAT number.
      The National Body should check the completeness of the information received from respondents based on validation rules agreed within NAPCORE.
