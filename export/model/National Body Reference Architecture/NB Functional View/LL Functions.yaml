  - name: "Managing general requests regarding self-declaration"
    guid: "{45963755-0898-4846-8129-F2724C86B673}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body may receive requests related to self-declarations at any time. These requests may be requests for information about the self-declaration, request from the stakeholder to replace the self-declaration with a newer version or other requests which may change the state of a self-declaration.
