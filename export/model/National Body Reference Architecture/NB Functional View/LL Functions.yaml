  - name: "Provide NB support"
    guid: "{3577F755-7777-4b9e-AAF8-F0A7532ACE4A}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    keywords: "Support, Information, Communication, Obligation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body shall, within its competence, provide its customers, as necessary, with advice on dealing with administrative matters and respond to questions and enquiries concerning the use of its services. Advice shall be provided free of charge.
      
      The National BodyNational Body should provide information about acting organizations, the geographical allocation of National BodyNational Body, about National BodyNational Body and stakeholder obligations, contact details, communication channels (website, e-Mail, hotline, etc), information about the delegated regulations and regarded deadlines.
      Provision of information: It is recommended to provide the above-mentioned information via one website.
      
      Stakeholder obligations:
      Stakeholder as main focus group can be informed about their tasks and obligations based on the ITS Directive
      2010/40/EU and their delegated regulations which includes deadlines of handing in self-declarations for self-assessments and random inspections. National BodyNational Body shall provide information about the national law and legal situation. This information process also includes the offering of direct information meetings and other support activities.
    links:
