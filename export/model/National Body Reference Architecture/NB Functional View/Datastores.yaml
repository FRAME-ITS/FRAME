  - name: "Compliance assessment registry"
    guid: "{D2A4C9B8-BDD7-427c-81A6-1411C0F7B280}"
    type: "Object"
    stereotype: "FRAME_Datastore"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The storage "Results Compliance Assessment Store” fulfills the need for official storage of results of compliance assessments.The stored documents form the basis for reporting and back questioning of results.
      
      The compliance assessment store should contain the link to the used harmonized forms or comparable information (Member State specific). Furthermore, it should contain the contact details of the people involved and a clear description of the result reasoning, and a description of inconsistencies.
