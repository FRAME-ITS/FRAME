  - name: "Self-declaration Storage"
    guid: "{3D7503E7-23C4-4846-A45A-D63C8A3B4CC5}"
    type: "Object"
    stereotype: "FRAME_Datastore"
    keywords: "Self Declaration, GDPR, Storage"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Received self-declarations need to be stored in alignment to GDPR and national regulations on data protection and public availability. At least the latest version of a self-declaration should be stored either digitally or physically . Inactive, withdrawn or rejected self-declarations are stored according to national regulations and existing processes.
      
      The self-declaration metadata shoud follow the harmonized approach of NAPCORE and include the following data entities:
      
      
      	- Version number (Unique version Identifier)
      	- Status based on “Self-declaration State Diagram"
      	- Reception date (When the SD is received)
      	- Stakeholder name from stakeholder list (Who provided the SD or updated SD)
      	- Stakeholder type (according to different type of SD-Forms)
      	- Covered Countries
      	- Delegated Regulation (RTTI, STTP, SRTI or MMTIS)
    links:
      - "Association «IN» → Self-declaration for compliance assessment"  # {2FE086B2-AC5F-4a1c-806C-B8E2BC38E7FD} → {B7AFE5CB-2A70-48ce-9ACC-91B5CA776A2B}
      - "Association «IN» → Self-declarations for reporting"  # {A00962ED-5313-48b5-B876-B7372BCB29AB} → {E7A8112B-9F75-4601-B108-9964DC50FED0}
      - "Association «IN» → Status of SD"  # {C5E0E6FE-BB6E-4967-83E9-EFE6DFB02013} → {17E98F9A-7E4B-4e4c-9D4E-61F335A5A284}
      - "Association «adheres to» → Template for self-declaration"  # {43F55CEB-889F-4ffc-9390-31CBC4216AA9} → {7D17E92C-40B9-4747-8B9D-5D52B942D18F}
  - name: "Stakeholder List"
    guid: "{28C2E2B1-65B4-47fd-8903-FE3449030F55}"
    type: "Object"
    stereotype: "FRAME_Datastore"
    keywords: "Stakeholder, Status, Self declaration"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body should store information related to the stakeholders for fulfilling their tasks according to delegated regulations, national law and GDPR conformity. The stakeholder list should be updated when new stakeholder information is provided.
      Proposed structure of stakeholder contact information:
      
      	- Stakeholder Name
      	- Stakeholder identification (registration number, VAT number,...)
      	- Registration Country Code
      	- Contact details (at least mail address of organization or person)
      	- Related Delegated Regulations (RTTI, SRTI, SSTP, MMTIS, N/A)
      	- Status (active, inactive, N/A)
      	- Change date
      
      
      additional information:
      
      	- 2nd communication way (postal address, telephone number)
      	- Date of last contact (Last interaction with stakeholder)
    links:
      - "Association «IN» → Stakeholder contact details"  # {53D54F69-52F1-485c-A14F-0AE6B3BF22CA} → {61F9DAAD-6D92-4838-91FA-32D72DE2C4F4}
