    note: |
      The self-declaration status stores necessary information about the status and adaptations of a self-declaration within the several processes at the National Body.
      
      The Self-declaration status should include following information:
      -) UID (unique identifier for self-declaration)
      -) Version number
      -) Stakeholder information (according to stakeholder list)
      -) status of self-declaration
      -) date of status change
      -) information about what lead to version or status change
