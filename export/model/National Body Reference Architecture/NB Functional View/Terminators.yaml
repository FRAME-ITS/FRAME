  - name: "General Public"
    guid: "{DEC15748-EB48-4dce-BABA-FDB1698EC9A9}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The “General Public” Terminator represents physical or juridical persons, companies, and authorities which have general interest at the National Body or a related topic.
    links:
      - "Association «IN» → Request general information"  # {FD5ABFE0-C6EC-405e-B4B2-FE4C6EED6738} → {2D8D8356-1D5E-42b7-B9BB-BCDFD97F2C95}
  - name: "Member States"
    guid: "{E2280DC8-3870-4bca-B9D9-0B0F048FF2BE}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Terminator "Member States" represents a real entity which is generating information to start a process or
      functionality or receives information to end a process or functionality.
    links:
      - "Association «IN» → Accepted"  # {9D9033E6-89C9-47a2-8702-9D58F39DABB7} → {07E61B1B-8832-4b8a-A195-03143D401995}
