    note: |
      Welcome to the Landing Page of National Body Reference Architecture.
      
      The Architecture will show common functionalities and processes of National Bodies in Europe.
      
      The NB Reference Architecture is a live document: it expands on what is in the FRAME Repository by providing much greater detail.
      
      How to navigate: the index on the left lists the packages and elements of the architecture; the boxes in the diagrams (e.g. the views on this page) open the diagram of the view, and each element page lists its connections to other elements.
      
      The Architecture will be developed within the ongoing project NAPCORE (https://napcore.eu)
      
      If issues, problems or mistakes are found, please report it as an issue under:
      https://github.com/NAPCORE/NB-Reference-Architecture/issues
