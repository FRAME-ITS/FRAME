  - name: "NB Glossary"
    guid: "{0396DED8-928E-450d-BC2B-16B42FC84087}"
    type: "Class"
    stereotype: "GlossaryEntry"
    status: "Proposed"
    version: "1.0"
    order: 1
    note: |
      Abbreviations:
      
      NB		National Body
      
      CA 		Competent Authority: An authority which is competent and authorized to fulfill this task aligned with the National Body
      
      NB /CA 		National Body and Competent authority will be consolidated under National Body in this document
      
      DR		Delegated Regulation
      
      FRAME		the name commonly used for the European ITS Framework Architecture and is derived from the names 		           of the projects that since 2001 have developed its content and the methodology for its use.
