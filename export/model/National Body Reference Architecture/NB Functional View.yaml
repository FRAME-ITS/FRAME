note: |
  The Functional View of the National Body reference architecture shows the main functionalities and the data flows in between.
  The included functionalities are defined and harmonized by NAPCORE and they present all necessary functionalities to fulfill the legal tasks defined by the Delegated Regulations.
  The functionalities can be implemented by the National Body or another authority which is competent and authorized to fulfill this task aligned with the National Body. The left and right Terminators, the entities who start or end processes or functionalities, are connecting the related views.
