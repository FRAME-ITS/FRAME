    note: |
      The details of the non-compliance process are not described in the delegated acts. It was a decision of the NAPCORE that harmonisation up to a certain degree is preferable in Europe.
      The non-compliance process describes how the national body should react to non-compliance identified in compliance assessment or other ways.
