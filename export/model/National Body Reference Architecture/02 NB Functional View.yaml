package: "National Body Reference Architecture/02 NB Functional View"
guid: "{A2CCC6DC-AA6F-43ee-963D-F21FE59D4039}"
alias: ""
version: "1.0"
note: |
  The Functional View of the National Body / Competent Authority Reference Architecture shows the main functionalities and the data flows in between.
  The included functionalities are defined and harmonized by NAPCORE and present all necessary functionalities to fulfill the legal tasks defined by the delegated acts.
  The functionalities can be implemented by the National Body or another Competent Authority which is competent and authorized to fulfill this task aligned with the National Body. The left and right Terminators are connecting the neighbor views.
