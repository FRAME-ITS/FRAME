    note: |
      A clear guideline how to act as National Body in a harmonized EU-wide NB environment.
    links:
      - "Association «defines» → Fulfilling National Body activities and reliabilities according to ITS directive 2010/EU/40"  # {5ECAE131-0534-407A-8A60-2A3CF254DE14} → {01809F43-C4B8-4445-BF4A-91BFA2C95612}
  - name: "Obligations and Interactions"
    guid: "{4355144F-8BD4-4b25-94CB-E69C5B98871A}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Stakeholders expect information about obligations and deadlines to fulfill the requirements from the delegated acts. They also need information about possible consequences if not fulfilling the requirements from the delegated acts. Furthermore, the stakeholders expect advice and instructions from the National Body in any part of the fulfillment process
    links:
      - "Association «defines» → Fulfilling National Body activities and reliabilities according to ITS directive 2010/EU/40"  # {8943032E-8DB8-413A-B343-509E588934C6} → {01809F43-C4B8-4445-BF4A-91BFA2C95612}
  - name: "Requirements"
    guid: "{A25E0F1A-B731-4e92-B10F-C75E52119119}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The NAP and the National Body are in direct relation.
      The NAP needs to know the requirements for the provision of data and metadata. The National Body needs to know how to access the descriptions of data and metadata.
    links:
      - "Association «defines» → Fulfilling National Body activities and reliabilities according to ITS directive 2010/EU/40"  # {5CF1065F-BB09-4106-A825-C8C8890DCC4F} → {01809F43-C4B8-4445-BF4A-91BFA2C95612}
