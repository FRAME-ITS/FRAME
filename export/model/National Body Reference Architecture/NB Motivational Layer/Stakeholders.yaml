elements:
  - name: "Data and Service provider"
    guid: "{18125799-A9C0-4e9d-B88E-C02A31FA9163}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      A national or international data and service provider who should provide a self-declaration according to the obligation to the delegated acts.
      
      886/2013 (SRTI) (article 9)
      
      	- Public and private road operators, service providers and broadcasters dedicated to traffic information shall provide the designated national bodies … submit a declaration of compliance
      
      
      887/2013 (Truck parking) (article 8)
      
      	- … national body competent to assess whether the requirements … are fulfilled by service providers, parking operators and road operators
      	- All services providers shall submit a declaration….
      	- … inspect the correctness of the declarations of a number of public and private service providers and parking operators,
      
      
      2015/962 (old RTTI) (article 11)
      
      	- ‘service provider’ means any public or private provider of a real-time traffic information service, excluding a mere conveyer of information, to users and end-users;
      	- Member States shall assess… by the road authorities, road operators, digital map producers and service providers
      
      
      2022/670 (new RTTI) (article 12)
      
      	- Member States shall assess …. are complied with by the data holders and data users
      
      
      2017/1926 (MMTIS) (article 9)
      
      	- Member States shall assess … by the transport authorities, transport operators, transport on demand service providers and travel information service providers.
      	- Member States may request from the transport authorities, transport operators, infrastructure managers, transport on demand service providers or travel information service providers…
    links:
      - "Association «has» → Obligations and Interactions"  # {BC894FB0-62E4-4b0d-9EEC-36227BA4381C} → {4355144F-8BD4-4b25-94CB-E69C5B98871A}
  - name: "European Commission"
    guid: "{09ACD865-46B3-4ea8-A5A9-5D8F4AF58CF6}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The European Commission may adopt delegated acts under the scope of the European ITS Directive (Directive 2010/40/EU). The Commission may adopt specifications to ensure compatibility, interoperability and continuity of services especially for the priority actions and priority areas defined in the Directive. The Commission shall establish a working program indicating the specifications to be developed and data types to be made available by the Member States. The Commission also receives reports from the Member States on the implementation of the Directive and related delegated acts and provides templates to be used in reporting from the Member States to the Commission.
      
      https://commission.europa.eu/index_en
    links:
      - "Association «has» → facilitate a harmonized implementation"  # {9721EAEE-4F49-4e0c-A812-75D1C33B23C8} → {01EE4DC2-403A-4982-AD07-A61EEB10017F}
  - name: "Member State"
    guid: "{F67994D2-8F28-40c3-AB94-56CBB3C33B7E}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Each Member State has to fulfil the requirement of the ITS Directive and the related Delegated Regulations. Therefore, they have to setup a national body or announce a competent authority (see 1.2.6.1.1). In addition, the Member State has to report status and progress to the European Commission.
    links:
      - "Association «has» → Guideline for a harmonised National Body setup"  # {18EB28AC-8CC5-4f0a-8B57-1CDB8CF3F248} → {BC7D188D-EF51-432d-98F0-DCFFBC7DD15D}
  - name: "National Access Point"
    guid: "{045541C2-0CC6-4ed9-B36B-9A432B2E67EC}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      A National Access Point (NAP) is a node in which ITS-related data are concentrated and published in the form of metadata or full datasets.
      
      NAPs are set up to facilitate access, and to allow easy exchange and reuse of transport and mobility related data in Europe, in order to help support the provision of EU-wide interoperable travel and traffic services to end users.
    links:
      - "Association «has» → Requirements"  # {C966D74E-B6E8-40ec-A02A-F8AE88DD0061} → {A25E0F1A-B731-4e92-B10F-C75E52119119}
  - name: "National Body"
    guid: "{FA078449-0B55-43fd-85F0-BC2273EB6B8F}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      A stakeholder established by the government or appointed by authorities. Their task is to oversee, manage, regulate or represent various aspects of national affairs. They have to be impartial and independent.
      
      According to Delegated Regulation (EU) No 886/2013 and (EU) No 885/2013 a National Body has to be appointed.  According to Delegated Regulation (EU) 2015/962 and (EU) 2017/1926 Competent Authorities of the Member States shall carry out the compliance assessment.
      
      In this reference architecture the term "National Body" is used to refer to both "national body" and "competent authority" used in the delegated acts.
      
      In the legal framework of the ITS Directive 2010/40/EU and related Delegated Regulations (EU) the main task of a National Body/Competent Authority is to assess the quality of mobility data and services (compliance assessment).
    links:
      - "Association «has» → Guideline for operation of National Bodies"  # {4A7EF786-24D9-4f2e-8C33-71ED035E5672} → {5E9DF39C-6000-43d3-9226-88DCD911CCC0}
