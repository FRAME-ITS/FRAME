  - name: "Fulfilling National Body activities and reliabilities according to ITS directive 2010/EU/40"
    guid: "{01809F43-C4B8-4445-BF4A-91BFA2C95612}"
    type: "Class"
    stereotype: "FRAME_ITS_Service"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Field of Application": ""
    note: |
      The National Body (NB) of a Member State has specific tasks related to the Delegated Regulations of the ITS Directive 2010/40/EU, which are requested by the European Commission.
       The main task is to ensure that data publishers, service providers and NAP meet the obligations and requirements expressed in the articles of each Delegated Regulation.
  - name: "National Body Mission_Statement"
    guid: "{19CCAB3F-C533-4107-9E55-E64EF97E7204}"
    type: "Class"
    stereotype: "FRAME_Mission_Statement"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      National Bodies are established or appointed by authorities to oversee, manage, regulate or represent various aspects of national affairs.
      In this context the main task of a NATIONAL BODY is carrying out compliance assessment, validation of stakeholder self- declaration against the Delegated Regulation obligations, and to ensure that the requirements of the Delegated Regulation are respected.
