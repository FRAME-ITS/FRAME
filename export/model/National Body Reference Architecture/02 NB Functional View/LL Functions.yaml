  - name: "Provide NB support"
    guid: "{3577F755-7777-4b9e-AAF8-F0A7532ACE4A}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    keywords: "Support, Information, Communication, Obligation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body / Competent Authority has the task to provide information to private and public stakeholders,
      organization, interested persons and answer any other related information request.
      Stakeholder:
      Stakeholder as main focus group can be informed about their tasks and obligations based on the ITS directive
      2010/40/EU and their delegated regulations which includes deadlines, of handing in self-declarations for self-assessments and random inspections. This information process also includes the offering of direct information meetings and other support activities.
      General information:
      The NB/CA should provide information about acting organizations, the geographical allocation of National Bodies, about National Body obligations, contact details, communication channels (website, e-Mail, hotline, etc) , information
      about the delegated regulations and regarded deadlines.
      Provision of information: It is recommended to provide the above-mentioned information via one website
    links:
      - "Association «IN» → Information about SD obligation"  # {BD3BBFA6-5753-4ba0-A33F-C1C2248FDD58} → {7BA75E54-A1DD-420f-B358-F2B59B2985F5}
