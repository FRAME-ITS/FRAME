    note: |
      The National Body / Competent Authority has to validate the Stakeholder contact details and validation of registration including registration or VAT number.
      Check the correctness of the information received from respondents Requirements: Base on validation rules (agreed within NAPCORE) system check the correctness of the filled-in declaration form(s) and/or other documents/information
      
      The NB/CA has to check if the self-declaration are complete. This includes all mandatory fields and necessary check boxes.
