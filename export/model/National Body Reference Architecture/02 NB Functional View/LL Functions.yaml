  - name: "Manage Stakeholder List"
    guid: "{35C53FD1-0C8A-49dc-85AE-E2D72F886A54}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Management of the list of stakeholders
      Requirements: The list of respondents is formed on the basis of the state register (e.g. register of legal units, business register, etc.) and is constantly updated.
      The following data is a proposal for the content to be stored in the list:
      company name, address, contact information, ID of self-declaration form (Template), submitting date, etc.
      Create a list of respondents to whom the request for information will be sent Requirements: Based on common criteria (agreed within NAPCORE) a list of respondents will be created. Respondents from the list will be requested to
      provide information/documents for the compliance with the requirements set out in the delegated act.
    links:
      - "Association «IN» → Request for providing Information"  # {CF1349B8-2719-4d1c-8B05-2BD814FC9A00} → {04FE4FC1-5A04-424c-8D06-96D805AA1556}
