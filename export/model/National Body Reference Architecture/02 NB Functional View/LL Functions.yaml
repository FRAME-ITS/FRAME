  - name: "Management of Self Declaration"
    guid: "{12F2142B-1179-455b-9F44-335FE9CBB4D2}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Registration, Stakeholder, Self Declaration"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Management of the repository of declaration forms
      Requirements: All types of self-declaration forms (templates) with a detailed description and filling instructions are uploaded in the repository. Each template must be assigned with an unique ID. Full list of all self-declaration forms (templates) available on the web-portal (NAP or NB/CA) with the possibility to select a template, preview and/or download.
      
      Reference to State diagram
      Add lifecycle:
      may withdraw the SD, changes need to be adopted. This can lead to a replacement of the old SD or a deletion of the existing SD.
      
      Old SD should be replaced by updated SD's
      SD's stay valid until something makes the SD invalid.
      Invalid SD's can be stored in alignment to GDPR for statistical reasons, but should not be used for compliance assessment.
    links:
