  - name: "Safety Integrity Levels (SILs)"
    guid: "{736DFF9A-1BD4-480f-BD99-39ABACC1BA6A}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    keywords: "Safety Integrity Levels"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The degree of care that should be taken to implement each of the safety requirements will depend on the importance of each hazard associated with that hazard. The concept of a Safety Integrity Level (SIL) arises naturally from the fact that some activities are perceived as being more hazardous than others. Their use is desirable because the development costs associated with high integrity levels can be very great. A balance must therefore be struck between using too low a level, which will increase risk, and using too high a level, which will result in unnecessary costs.
      
      Whilst a number of Standards specify the consequences on the development of a system once a SIL has been assigned to a (sub-)system, there is less advice available on how to do that assignment. The most relevant to ITS is:
      
      MISRA, Guidelines for Safety Analysis of Vehicle Based Programmable Systems, 2007 available from www.misra.org.uk
      
      There are two Standards that may be relevant to the development of an ITS according to an assigned SIL, but their use should be confirmed with the appropriate regulator. They are:
      
      IEC 61508 - Functional Safety of Electrical / Electronic Programmable Electronic Safety-related Systems
      
      ISO 26262 - Road Vehicles - Functional Safety
