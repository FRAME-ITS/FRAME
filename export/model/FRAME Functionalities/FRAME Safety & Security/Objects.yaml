    tags:
      "Key Issue": ""
      "Role Part Of Value Chain": ""
      "Role Value": ""
      "Role View": ""
    note: |
      It is STRONGLY advised that those who are familiar with ITS safety issues should be included in the team that performs a Preliminary Safety Analysis.
      
      A safety hazard is defined as being a physical situation with a potential for human injury. However, whilst this definition only refers to injury to humans, it is wise to consider possible injury to property, fauna, flora, atmosphere, etc. as well. Certain safety hazards are obvious, for example a green light conflict for traffic signals, but others are less obvious and are often concerned with the reason as to how an accident, or conflict situation, can come into existence. Past experience has led to ITS safety being considered under the three headings of
      
      	- Functional System Safety
      	- Human-Machine Interaction
      	- Traffic Safety
      
      though there is a growing recognition that ITS is merging the boundaries between them.
      
      Functional System Safety
      Function System Safety is primarily concerned with the analysis of the reliability of the piece, or pieces, of hardware and/or software. This analysis should identify the aspects of design, operation or failure of the system that may generate malfunctions and lead to dangerous and/or unanticipated modes. In the context of ITS in general, a system may consist of many items of equipment which may be interacting, and this interaction is one of the targets of the analysis.
      Human-Machine Interaction (HMI)
      HMI is concerned with how a human user interacts with a system via an interface. The targets of analysis are normally the visual, auditory and tactile interfaces within the vehicle, at the roadside and in the control room, and their ability to be used effectively and safely. As user interactions with a system may be prolonged, complex issues such as menu design and user under/overload are also assessed to identify potential conflicts between the system design and the behaviour of the user.
      Traffic Safety
      Traffic Safety is concerned with the safe operation of the traffic system as a whole. It covers the outcome of Functional System Safety and most, but not all, HMI problems for the system and the user, and the malfunctions that may lead to accidents. It also covers the ways in which a system might affect road user behaviour so as to alter the interaction between the driver, the vehicle, the road infrastructure and other road users (including vulnerable road users such as pedestrians and cyclists) such that they no longer use road transport in a safe manner.
      
      Example - a junction controlled by traffic signals
      
      	- The equipment in general, and the correct operation at all times of the controller, should be managed by an expert in Functional System Safety.
      	- The size, luminosity, location etc. of the signals heads so that they will always be interpreted correctly by the drivers should be managed by an expert in HMI.
      	- The layout of the junction, and the timing of the signals, in order to create a naturally safe driving scenario, together with any special arrangements for particular classes of vehicle, e.g. regular HGV traffic carrying hazardous goods, should be managed by an expert in Traffic Safety.
      
      
      (See 'Intro to Safety & Security' for a reference to the original UTMC22 document that describes these issues in detail)
