  - name: "PASSPORT Diagram"
    guid: "{9470B304-B407-4ad7-BA2F-361E955649B3}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      A PASSPORT diagram is a convenient way of describing a (complex) ITS in a 'simple' manner and that highlights the principal components whose failure to function correctly could create a safety hazard. SInce it can be created without knowing the details of the intended design (or its Architecture) it can be created very early in the lifecycle, and the results of the Preliminary Safety Analysis can then be used to influence the remainder of the system lifecycle.
      
      See "Create PASSPORT Diagram"
  - name: "Preliminary Safety Analysis - PSA"
    guid: "{57750890-422E-49f8-AB2D-6195E6B20004}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Once a model of the proposed ITS has been created the process of performing a Preliminary Safety Analysis (PSA) can begin. See also the PASSPORT report on PSA (see 'Intro to Safety & Security' for the full reference).
      
      The primary purpose of the PSA is to identify whether the proposed ITS has any safety-related aspects to it, and if so to identify the high level safety requirements, and the preliminary Safety Integrity Levels (SILs), associated with them. The PSA is performed very early in the development lifecycle, and does not require too many details of the proposed design to be known. At this point the environment, boundary, operating goals, overall structure and functionality are known, but the details of its design may still to be determined.
      
      Inputs to the PSA Process should include:
      
      	- the overall system requirements and operating environment of the proposed ITS.
      	- guidelines for performing a PSA;
      	- the overall safety requirements of the proposed ITS;
      
      
      The PSA Process should include:
      
      	- A high level system description (Create PASSPORT Diagram);
      	- A "what if?" analysis on the PASSPORT Diagram to identify the high level hazard(s) - see also Appendix D of the PASSPORT Report;
      	- A "what causes?" analysis for each of the hazards identified (see also HAZOP and EMC below);
      	- Production of conclusions and recommendations.
      
      Outputs from the PSA Process should include:
      
      	- A PASSPORT Diagram showing the proposed ITS in its environment;
      	- The overall safety objective(s) of the proposed ITS;
      	- The failure modes of system elements, and their relative importance;
      	- The High Level Safety Requirements;
      	- The preliminary allocation of SIL(s) - see also Appendix B of the PASSPORT Report.
      
      
      Hazard and Operability Analysis (HAZOP)
      A possible approach to the 'What If?' analysis, which can be more relevant to some proposed (parts of) ITS is (a modified) use of the HAZOP Guide Words on the basic functionality and the flow of data, as follows:
      
      
      	- NO/NOT - Complete negation of the design intent
      	- MORE - Quantitative increase
      	- LESS - Quantitative decrease
      	- AS WELL AS - Qualitative modification/increase
      	- PART OF - Qualitative modification/decrease
      	- REVERSE - Logical opposite of the design intent
      	- OTHER THAN / INSTEAD - Complete substitution
      	- EARLY - Relative to clock time
      	- LATE - Relative to clock time
      	- BEFORE - Relating to order or sequence
      	- AFTER - Relating to order or sequence
      
      
      Electromagnetic Compatibility (EMC)
      This relates to the ability of one electrical system to interfere (through electromagnetic induction) with another electrical system.  This interference can originate from either within the vehicle (e.g. spark plugs), or from an electrical installation outside the vehicle, e.g. a local electric power distribution transformer.  Whilst all vehicles have to pass an established EMC process which is derived from the requirements of the Type Approval process, this does not necessarily apply to any ITS that is sited either within, or outside the vehicle.  It should be noted that an EMC fault is likely to result in a non-functioning, rather than a mal-functioning, system.
