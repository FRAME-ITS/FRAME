  - name: "High Level Safety Requirements"
    guid: "{6E361738-A026-45eb-B526-8920020A7BA3}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The result of a Preliminary Safety Analysis (PSA) will, in general, be a set of additional functional, and non-functional (e.g. quality) requirements that should be added to the system specification in order to mitigate the safety issues that have been identified.
      
      The manner/detail in which they are specified will mainly depend on the detail with which the proposed system has been specified so far.
      
      Safety Functional Requirements - these are functions that must be carried out by the safety-related system should a hazardous failure occur in the technical process, or in the safety-related system itself. They may also prevent systemic faults violating the safety of the system.
      Safety Integrity Requirements - These are measures to ensure that all the safety functions are performed with sufficient reliability. They are divided into:
      Measures to avoid faults
      
      	- Quality - working to a relevant Quality Plan
      	- Reliability - using components with a known failure rate
      	- Analysis - the higher the Safety Integrity Level (SIL) the closer to a proof of correctness under all conditions one has to get.
      	- Test - although testing cannot normally demonstrate the absence of faults,it will provide confidence that the system performs correctly.
      
      Measures to control faults
      
      	- Redundancy - the normal technique to control random faults.
      	- Diversity - identical systems may contain the same systemic fault. The use of a channel with different design can alleviate this problem (but be careful what is being claimed).
      	- Self Test - a safety-related system should run a set of self-test routines on a regular basis.
      	- Monitoring - a continuous set of self-tests.
