  - name: "Detailed Safety Analysis - DSA"
    guid: "{C427A7CE-4B02-4df1-B64F-BB3041F3AD77}"
    type: "Activity"
    stereotype: "FRAME_ITS_Service_Process"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The purpose of the Detailed Safety Analysis (DSA) process is to analyse in detail the system requirements, and the architecture, in relation to the safety objectives and the safety requirements identified during the PSA.
      DSA is a recursive process, performed in parallel with the system design and ends once there is a sufficient level of confidence that design measures exist to make the system acceptable. The level of confidence required should also be commensurate with the Safety Integrity Level (SIL) required of the system, and may require liaison with an independent assessor.
      
      It is particularly important to ensure that:
      
      	- The results of the PSA are still valid, and their corresponding Safety Requirements have been implemented correctly;
      	- No further safety issues have emerged due to the design decisions that have been chosen.
      
      
      The following techniques are the fundamental activities of a DSA process:
      
      	- A Failure Mode and Effects Analysis (FMEA) to identify the low level hazards.
      	- A Fault Tree Analysis (FT A) on each of the low level hazards identified.
      	- Conclusions and recommendations.
      
      
      The process steps are iterated to greater levels of system decomposition until all the safety implications have been fully analysed.
