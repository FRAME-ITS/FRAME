    note: |
      In some languages the colloquial terms for Safety and Security might imply that they relate to the same thing.  In one sense they are the same - the absence of risk - but the nature of the risks, and how to mitigate them, can be very different.  For ITS they can be defined as follows:
      
      
      	- Safety - freedom from unacceptable risk, where risk is defined as a combination of the probability of occurrence of (physical) harm, and the severity of that harm.
      	- Security - the preservation of confidentiality, integrity and availability of information.
      
      
      There is a statutory requirement that all equipment should be safe to use, and there is a legal expectation that the engineers who design such systems should take active steps to ensure that they are indeed safe to use.  In the road transport environment there are two primary sets of equipment, both of which need to be safe to use, the vehicles and the road-side equipment (it should be noted that, whilst the basic safety of a vehicle, or road-side equipment, is the responsibility of the manufacturer, the addition of certain ITS features can affect the way that drivers perform their tasks (indeed they are probably intended to!). These additions should not affect the overall safety of the vehicle, or the surrounding traffic, pedestrians etc.
      
      The introduction of ITS, and their reliance on data (both personal and functional), opens up the issue of security, which was once only of interest to the realm of Information Systems (IT). It should also be noted that some security issues may also result in a safety issue.
      
      See also:
      Safety
      https://frame-online.eu/library-2/other-related-reports
      UTMC22 – Framework for the Development and Assessment of Safety-Related (Inter-)Urban Traffic Management Systems (March 2000)
      PASSPORT – Framework for Preliminary Safety Analysis (December 1995)
      Security
      https://www.evita-project.org/index.html
