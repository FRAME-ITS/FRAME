    note: |
      PKI system providing certificates and support for a single C-ITS security domain for all participants in Europe.
      For details please see the security view and the EU Central elements:
      TLM - Trust List Manager
      CPOC - C-ITS Point of Contact
      ECTL - European Trust List
      EU Root CA Certificate Authority with
      EA - Enrolment Authority and
      AA  - Authorisation Authority
      and the links to the documents at: https://cpoc.jrc.ec.europa.eu/ECTL.html
    links:
