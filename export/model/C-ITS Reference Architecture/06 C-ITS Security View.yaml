    note: |
      The CA consist´s of
      EE - Enrolment authority and
      AA - Authorisation Authority,
      and these can be at European Level or from Member States or also from private C-ITS actors.
  - name: "PKI Service provider 1 (one of many)"
    guid: "{04B92ABB-9322-4888-B5FC-122CB8EF9E4B}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Organisation that provides security related services to operators of C-ITS stations in the network and has the responsibility to list all active stations in the single EU C-ITS trust domain in order to exchange trusted data communication between all stakeholders.
  - name: "Policy Authority"
    guid: "{43FC96D4-0EC2-4547-AF9E-35CF41527D97}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The main decision body in the EU CCMS, consisting of public and private members with active C-ITS stations operating in the C-ITS network and taking the strategic decisions for the further development of the security and the network development.
