  - name: "Trust List Manager"
    guid: "{B983EA30-7513-47bd-88FA-2F7CE5575F4A}"
    type: "Object"
    stereotype: "FRAME_Role"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Key Issue": ""
      "Role Part Of Value Chain": ""
      "Role Value": ""
      "Role View": ""
    note: |
      Manages the members of the C-ITS Network, and distributes the valid certificates and publishes the ECTL as C-ITS Central Point of Contact.
      
      The latest list of all participants in the EU single trust domain, the ECTL is published at: https://cpoc.jrc.ec.europa.eu/ECTL.html
      
      The certificates of the TLM are published at: https://cpoc.jrc.ec.europa.eu/TLMCertificates.html
