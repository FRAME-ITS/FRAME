    note: |
      The SPATEM/MAPEM message formats are linked between them and are often defined for intersections.
      The MAPEM message is the result of the Road and Lane Topology (RLT) infrastructure service which manages the generation, transmission and reception of a digital topological map. This service along with its operational parameters is defined in ETSI TS 103 301 which refers to the SAEJ2735 data dictionary.
      The MAPEM message structure consists of an ITS PDU header and MapData container at the top level, and defines mainly the static elements of a part of the road infrastructure, the SPATEM message defines the dynamic ones and has a hierarchical structure in five layers.
    links:
