    note: |
      The basic standards for the communication in the C-ITS domain are:
      - ETSI EN 302 665 ITS Communication Architecture, v1.1.1 (2010-09)
      - ETSI EN 302 637-2 Intelligent Transport Systems (ITS); Vehicular Communications; Basic Set of Applications; Part 2: Specification of Cooperative Awareness Basic Service, V1.4.1 (2019-4)
  - name: "ETSI TS 103 301"
    guid: "{FE0A2EEF-73F9-4035-9267-EF083CDA9798}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "SPAT/MAP"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The SPATEM/MAPEM message formats are linked between them and are often defined for intersections.
      
      The MAPEM message is the result of the Road and Lane Topology (RLT) infrastructure service which manages the generation, transmission and reception of a digital topological map. This service along with its operational parameters is defined in ETSI TS 103 301 which refers to the SAEJ2735 data dictionary.
