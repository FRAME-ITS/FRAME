    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      SSP encoding : For IVI based use cases in ETSI TS 103 301 [11],  the SSPs are encoded in Octets 4-5 within the respective field of the certificate to be used (AT), in addition to the serviceProviderId encoded in Octets 1-3.
    links:
      - "Aggregation «component of» → F9.5 Manage Interurban Urban Traffic Zones"  # {4FD429A6-F3B7-4e53-A02E-B1F5A473ECC7} → {0A4E4F63-21D5-403a-BE69-6B7E67348D2B}
