    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      For use cases based on IVIM messages the AMQP filtering tables in chapter 3.3.1 of [7]  - BI interface specification, hall apply:
      •serviceType= IVS-TS
      •messageType = IVIM
      See latest documents at https://www.c-roads.eu/platform/documents.htm
    links:
