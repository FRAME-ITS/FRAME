    note: |
      This High Level Function provides means to communicate traffic rules and signs (I2V) and is based in IVIM messages.
    links:
      - "Aggregation «component of» → F9. Provide Support for Cooperative Systems"  # {6EA0FEE1-AD1A-425f-8F1A-D95D254BDCC0} → {F0D7E9A8-9F88-4e8f-AF0F-661C1990D546}
