    guid: "{AE47DC1C-B579-4253-8AEA-6AAEF90B4354}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      For IVi based use cases the system shall enable up to three additonal signs to be associated with the main sign (using DF RSCode).
    links:
      - "Aggregation «component of» → F9.5 Manage Interurban Urban Traffic Zones"  # {DA19017C-5701-4576-97C7-B28673E17724} → {0A4E4F63-21D5-403a-BE69-6B7E67348D2B}
  - name: "F9.5.7"
    guid: "{FAB8ED1B-031B-4d29-A14B-174C46A20D9E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      For IVi based Use cases the system shall enable extraText for a road sign to be ordered; if a sign has no extraText then the NULL Character is used.
    links:
      - "Aggregation «component of» → F9.5 Manage Interurban Urban Traffic Zones"  # {AB7DB1CF-B8DF-4fa7-9E11-6907A90FBA94} → {0A4E4F63-21D5-403a-BE69-6B7E67348D2B}
  - name: "F9.5.8"
    guid: "{BFABD4B6-CD8E-4324-8DAB-9E46716AEA82}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      If all signs in the IVIM are valid for less than all lanes the system shall enable that the RoadConfiguationContainer may be used to describe the driving lane configuration for a zone.
    links:
      - "Aggregation «component of» → F9.5 Manage Interurban Urban Traffic Zones"  # {246F62E7-245A-47ba-9170-D5C5615F5512} → {0A4E4F63-21D5-403a-BE69-6B7E67348D2B}
