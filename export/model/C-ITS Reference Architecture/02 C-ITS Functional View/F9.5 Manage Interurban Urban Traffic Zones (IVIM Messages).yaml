    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      For IVi based use casestThe system shall encode Text Information without a sign in the TextContainer.
    links:
      - "Aggregation «component of» → F9.5 Manage Interurban Urban Traffic Zones"  # {8808C4A0-3FCB-40fd-9877-ABB9AA69B786} → {0A4E4F63-21D5-403a-BE69-6B7E67348D2B}
