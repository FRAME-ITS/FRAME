elements:
  - name: "F9.1 Enable Cooperative Roadside Vehicle Interactions"
    guid: "{480ED898-6E9F-4299-B95D-F346F41B530E}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    keywords: "Functions"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This High Level Function enables all cooperative data traffic interactions between road infrastructures and vehicles related to C-ITS stations defined according to the standard ETSI EN 302 665 v1.1.1 (2010-09).
      
      For specific cooperative interactions the following functional areas apply:
      1 - All regularly transmitted data messages based on C-ITS System level and on CAM, SPAT/MAP messages
      2 - Access to specific lanes
      3 - Vehicle access to sensitive locations / areas and based on DENM messages
      4 - Provide Hazardous Goods Management
      5 - Manage interurban / urban traffic zones based on IVI messages
      6 - Future messages and services
      
      High Level Functions 1-6
