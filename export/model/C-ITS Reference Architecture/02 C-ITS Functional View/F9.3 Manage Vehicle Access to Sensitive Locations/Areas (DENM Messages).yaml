elements:
  - name: "F9.3 Manage Vehicle Access to Sensitive Locations/ Areas"
    guid: "{5DDE7C5E-7DE4-41d7-B23E-3340DD5B006E}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    keywords: "Functions"
    status: "Proposed"
    version: "1.0"
    order: 1
    note: |
      This High Level Function 3 is related to events and their locations in traffic networks, were traffic interruptions have happened, and therefore represent a higher risk for road safety.
      These events are communicated with the standard DENM messages from all C-ITS actors. (I2V and V2V)
