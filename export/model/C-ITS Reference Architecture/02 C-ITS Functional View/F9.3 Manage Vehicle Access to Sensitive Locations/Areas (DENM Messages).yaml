  - name: "F9.3.1"
    guid: "{426EB23D-5A11-4a41-B0F1-DC074F7A8F66}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 2
    note: |
      The DENM message for RWW-LC shall be profiled in chapters 4.2.1.1 and 4.2.1.2 of C- Roads, C-ITS Message Profiles [4].
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.2"
    guid: "{AD178D7C-FCDD-46ae-A5EA-B452D6CF95C6}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 3
    note: |
      For this DENM based use cases the system shall provide relevanceTrafficDirection as specified in C-Roads, C-ITS Message Profiles [4].
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.3"
    guid: "{68E5E5E3-4B48-458c-AB12-15AC94DFCFC7}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 4
    note: |
      For this DENM based use cases the system shall provide traces as specified in C-Roads, C-ITS Message Profiles [4].
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.4"
    guid: "{E2D0022E-A1CE-4a37-9BE5-E15E3C050CD9}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 5
    note: |
      For DENM based use cases the system shall use stationType: 9, or 10, or 15
  - name: "F9.3.5"
    guid: "{EC4D1324-FFBE-47f8-97EA-D9D47946FC4F}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 6
    note: |
      The system shall be able to provide an event history for an RWW site, based on DENM Messages, when available.
  - name: "F9.3.6"
    guid: "{69EABC8B-51F2-455b-BAD7-69E37E73053E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 7
    note: |
      The system shall be able to manage the duration of the validity of a message either by giving it a lifetime, or by sending a terminating message.
  - name: "F9.3.7"
    guid: "{C9DDA2C9-1966-4754-B5BE-F6ED8C66DB89}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 8
    note: |
      The system shall enable that for ITS-G5 based implementations of use cases, the requirements of C-Roads, C-IST Roadside ITS G5 System Profile [6] shall apply.
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.8"
    guid: "{15447CFA-1FAE-45d7-8ECC-26CBBD75B67E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 9
    note: |
      The system shall enable that for ITS-G5 based implementations of use cases where mobile stations are allowed and used, the requirements C-Roads, C-ITS Mobile Roadside ITS G5 System Profile [5] shall apply and RS_RSP_044, RS_RSP_061 of C-Roads, C-ITS Roadside ITS G5 System Profile [6] shall apply.
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.9"
    guid: "{E659B303-DD48-4706-980D-5B6ED7362F06}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 10
    note: |
      The system shall enable that IP based implementations of use cases shared using backend communication, the requirements of C-Roads, C-ITS IP Based Interface Profile [7] shall apply.
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.10"
    guid: "{CBC47407-8DA7-4361-B854-B957B24E3E06}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 11
    note: |
      The system shall enable that use cases based on DENM messages the AMQP filtering tables in chapter 3.3.1 of [7] shall apply: serviceType = RWW-LC, messageType = DENM
      See latest documents at https://www.c-roads.eu/platform/documents.html
  - name: "F9.3.11"
    guid: "{674B9301-BA0A-4918-AC89-FC60F4C85575}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 12
    note: |
      The system shall use  a defined method (Quadtree) for DENM messages:
      These fields define a geographic location of the C-ITS message and C-ITS actors shall publish in a set of tiles corresponding to the maximum set of tiles containing all the geographic indications.
  - name: "F9.3.12"
    guid: "{FA67C3CD-B926-4517-A44A-B06CC02DC604}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 13
    note: |
      For this DENM based use cases the system shall use, causeCode 3 (road works) and subCauseCode either 0 or 4 shall be used.
  - name: "F9.3.13"
    guid: "{8833A6EE-C19D-4c1f-8BFE-172D44150651}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 14
    note: |
      For TOC triggered and augmented DENM based use cases the system shall set: informationQuality to 6 if start and end time can be confirmed on site.
      For standalone: informationQuality shall be set to 6.
  - name: "F9.3.14"
    guid: "{F59058D3-E60B-4ed0-BC45-E322229ED55B}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 15
    note: |
      For augmented and TOC triggered DENM based use cases or If multiple DENMs are sent out for the same work zone, the referenceDenms DE shall be used.
  - name: "F9.3.15"
    guid: "{6CD6F00D-A573-459a-84C7-8DA6DE1875FF}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 16
    note: |
      The system shall set the eventPosition to the location of where the mobile roadworks trailer or the first cone is located.
