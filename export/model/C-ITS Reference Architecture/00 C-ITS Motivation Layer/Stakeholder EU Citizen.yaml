elements:
  - name: "C-ITS - Business expectations of actors involved in the C-ITS-Service"
    guid: "{77E28A5F-3DEC-4ecb-8FC1-648789DD0CB8}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Road operators and public authorities
      
      	- reach out to travellers fastest with high quality and targeted traffic information to enhance road safety
      	- Reduce the speed variations in traffic flows and the emissions
      	- inform all travellers on the network about traffic events ahead on their way, to enable adaptation of the driving behaviour and hereby reduce the number of traffic interruptions
      	- enhance driving time reliability and comfort for travellers
      
      
      Vehicle manufacturers
      
      	- Provide drivers the best traffic information available in a customer friendly way
      	- Enhance road safety by warning directly V2V of imminent and nearby events, with impact on safety
      
      Reduce energy consumption and driving emissions by enhancing attentive driving
    links:
      - "Association «defines» → C-ITS Enhancing road safety"  # {B67BFE0A-79D4-404e-B6AC-D2C72B116E53} → {6659C076-2560-445f-862A-8829F47486E0}
