  - name: "Get relevant traffic information fast and efficiently"
    guid: "{33E20BA8-CBE2-448f-ADCE-8540FE27BF44}"
    type: "Artifact"
    stereotype: "FRAME_Desired_Architecture_Goals"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      All traffic information for my ways ahead should be provided fast and efficiently in order to prevent road accidents and crashes on all modes of transport.
