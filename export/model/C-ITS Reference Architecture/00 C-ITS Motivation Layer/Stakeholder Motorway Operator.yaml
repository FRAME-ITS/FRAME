elements:
  - name: "C-ITS Central node or Station and BI"
    guid: "{41044B68-48A4-498f-8DDF-57CF2FBB3FBB}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Central node of a C-ITS network can be implemented in a TMC and distributes C-ITS messages also via a BI - Basic interface to all IP based communication channels
    links:
      - "Abstraction → Use C-ITS central station for all messages and road network types"  # {0E52A9EE-44B7-47d4-95F4-3FB8190D3743} → {365D5500-D776-4136-91FB-56DB960294CD}
      - "Abstraction «is Type of» → Motorway operators and city public authorities"  # {4B165F8A-25C5-46ca-B924-E3B25BBD02F1} → {2E3B8D29-8DDA-48a6-AA48-C0060AEC0A2D}
      - "Realisation → Policy Authority"  # {15D87D12-8329-48dc-AF45-6097CEF38E94} → {43FC96D4-0EC2-4547-AF9E-35CF41527D97}
  - name: "C-ITS Roadside node or station"
    guid: "{F6423E2B-6982-413d-9D13-34670A5A9E8E}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The roadside node of the C-ITS network, can be implemented via short range communication interface and via a
      - fixed station, mounted at the roadside, or via a
      - mobile station, placed in a mobile roadworks trailer or in a road operator traffic manager vehicle.
    links:
      - "Abstraction «is Type of» → Motorway operators and city public authorities"  # {3E8E49B4-14CF-4b6d-8DB3-8BD8DB7026C3} → {2E3B8D29-8DDA-48a6-AA48-C0060AEC0A2D}
      - "Realisation → Policy Authority"  # {851020BF-43AF-41c7-8C43-619B04D60441} → {43FC96D4-0EC2-4547-AF9E-35CF41527D97}
  - name: "C-ITS central node or station"
    guid: "{BD2B2264-28E9-48c2-B372-8AB31108F105}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Public authorities and their policy goals are linked to enhance the wide distribution and uptake of C-ITS traffic messages in order to enhance road safety and energy efficiency in transport.
      The implementation of a Central C-ITS Station, or a BI interface and possibly message broker can support this.
    links:
      - "Abstraction «is Type of» → EU Member states, public authorities"  # {FA6E4FB7-38CA-437f-B8A3-FBB2D81D2855} → {07E0D60C-2D04-4079-A5AF-99126D64B7DF}
  - name: "Motorway operators and city public authorities"
    guid: "{2E3B8D29-8DDA-48a6-AA48-C0060AEC0A2D}"
    type: "Actor"
    stereotype: "FRAME_Stakeholder"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      EU motorway operators and cities implement C-ITS on the European TEN-T road network and in cities and have an additional direct information channel to the travellers on their networks.
      Cities implement C-ITS for enhanced traffic management and priority for PT or emergency services.
    links:
      - "Association «defines» → eCall Vision"  # {28C5A7FA-8063-4b6d-89EC-7E449D301547} → {7EF14ABB-8BB1-457c-AA34-2C2E87E4192A}
      - "Association «fulfilled by» → Fullfillment of C-ITS related standards"  # {6EB88609-5494-4fb9-87C7-12BCA13890B7} → {AFF20E0F-FAF3-40e4-9BEB-CE9311A11A56}
      - "Association «has» → Provide precise and targeted traffic information to travellers"  # {63334193-6ED3-4b24-AF22-A95F01FA0BE5} → {A31FBB4B-3527-4915-A048-6D42BC72A33D}
      - "Association «has» → Use C-ITS central station for all messages and road network types"  # {368513D8-8800-4026-A2BC-99B6A5BB8CF2} → {365D5500-D776-4136-91FB-56DB960294CD}
      - "Association «has» → Use C-ITS stations to communicate fast and efficiently"  # {0428D710-B8F5-4c8e-BF24-3387B150BB43} → {952ECBC6-D7FE-4378-A24A-F7BA1B0798B1}
  - name: "Provide precise and targeted traffic information to travellers"
    guid: "{A31FBB4B-3527-4915-A048-6D42BC72A33D}"
    type: "Artifact"
    stereotype: "FRAME_Desired_Architecture_Goals"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Use C-ITS messages to inform all mobile travellers on the networks in advance of dangerous traffic situations.
  - name: "Use C-ITS central station for all messages and road network types"
    guid: "{365D5500-D776-4136-91FB-56DB960294CD}"
    type: "Artifact"
    stereotype: "FRAME_Desired_Architecture_Goals"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Distribute all C-ITS messages securely and to all types of road networks.
