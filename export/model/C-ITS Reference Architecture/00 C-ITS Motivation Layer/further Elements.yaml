  - name: "C-ITS_Services day one"
    guid: "{76D644F1-2C02-44c8-8E75-93CBE23BBEC2}"
    type: "Class"
    stereotype: "FRAME_ITS_Service"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Field of Application": ""
    note: |
      Day one C-ITS services are based on standardised messages and agreed and defined communication profiles for interoperable services in Europe.
      The messages are:
      - DENM
      - CAM
      - IVIM
      - SPAT/MAP
      - SSEM/SREM
      please see standards and specifications in the "supplements section" below.
