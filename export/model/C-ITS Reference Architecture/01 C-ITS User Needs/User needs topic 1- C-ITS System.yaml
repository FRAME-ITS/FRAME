    order: 2
    note: |
      The system shall provide the exchange of information for cross-border C-ITS services based on harmonised C-ITS specifications including the use case settings.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic1 C-ITS System"  # {F9CDB26D-0FD7-47d0-A79A-BA02224DAAC4} → {D06129C3-AA43-483b-85AF-87DB2C48E04C}
