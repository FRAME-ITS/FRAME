    note: |
      For all traffic related events in C-ITS the message shall define the Geographic area (Quadtree) as follows:
      The event is characterized by its referencePosition, detectionZone(s), relevanceZone(s) and DestinationArea. These fields draw a geographic area and C-ITS Actors shall publish in a set of tiles corresponding to the maximum set of tiles containing all the geographic indications mentioned
    links:
