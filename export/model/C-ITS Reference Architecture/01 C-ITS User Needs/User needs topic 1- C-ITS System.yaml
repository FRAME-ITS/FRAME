    keywords: "C-ITS System"
    status: "Proposed"
    version: "1.0"
    order: 1
    note: |
      User Need Topics are defined as follows:
      1 - C-ITS SYSTEM related
      2 - DENM related
      3 - CAM related
      4 - IVIM related
      5 - SPAT/MAP related
      6 -for future messages to be defined
    links:
