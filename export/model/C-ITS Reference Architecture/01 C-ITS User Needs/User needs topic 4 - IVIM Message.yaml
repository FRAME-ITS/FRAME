      - "Usage → F3.1 Provide Traffic Control"  # {B2F167C6-426B-49f8-B65F-CD3829D85C7F} → {226ED187-DB7A-409f-B509-BA8DBFFB6DB6}
      - "Usage → F9.3 Manage Vehicle Access to Sensitive Areas"  # {2DD42037-38F2-409a-B5C6-8FBC38D3A9E9} → {BECAF613-EAD1-4f7d-BBA6-63FBDADA831A}
  - name: "11.2.4.2"
    guid: "{2809968A-BA4A-4059-8158-C2EA685DFD61}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 12
    note: |
      For IVI based use cases the system shall enable the Traffic Operations Centre (TOC) to send applicable traffic signs to all relevant vehicles.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {D95BBE08-EBCF-4b25-8738-08BE4EBBC3D0} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.2.4.3"
    guid: "{6F651EBC-516E-49eb-908E-4030281B1304}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 13
    note: |
      For IVI based use cases the system shall enable the Traffic Operations Centre (TOC) to send specific applicable traffic signs to all relevant specific classes of vehicle
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {930CD581-8E22-4052-AB33-0350F37BADA6} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.2.4.4"
    guid: "{97E06842-433B-4683-BF01-87F831DF2713}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 14
    note: |
      For IVI based use cases the system shall enable the Traffic Operations Centre (TOC) to send applicable traffic signs to all relevant vehicles in a specific lane(s).
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {4500C31B-0A0D-4f80-9CC5-C4A0A1A558B4} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.2.4.5"
    guid: "{CD31F139-3993-4c61-9710-4B1316AF8A9F}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 15
    note: |
      The system shall enable the operator to specify the zone(s) in which a message will be displayed.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {BF7B30CE-45FF-4a7a-B672-3536926334EC} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.3.4.1"
    guid: "{5DC53393-B59B-4c4e-B501-DE79A80A3C20}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 16
    note: |
      For IVI based use cases the system shall limit stress for the road user to comprehend the content of the information and react accordingly, compared to the short-term awareness provided by the physical VMS.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {453E417A-5BCE-4c2b-B92A-020C4B7EF145} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
