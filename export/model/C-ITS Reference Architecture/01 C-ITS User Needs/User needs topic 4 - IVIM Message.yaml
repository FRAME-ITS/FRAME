  - name: "FRAME_User_Need_Topic4 IVIM Messages"
    guid: "{857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}"
    type: "Requirement"
    stereotype: "FRAME_User_Need_Topic"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 1
    note: |
      User Need Topics are defined as follows:
      1 - C-ITS SYSTEM related
      2 - DENM related
      3 - CAM related
      4 - IVIM related
      5 - SPAT/MAP related
      6 -for future messages to be defined
    links:
