  - name: "11.1.4.1"
    guid: "{D639FA90-0A07-40d5-A7DA-30C610216C5D}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    alias: "road signs"
    status: "Proposed"
    version: "1.0"
    order: 2
    note: |
      For IVI based use cases the system shall be able to inform drivers of the content of all static and dynamic road signs that are part of the Vienna Convention.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {EBA4B26F-1755-496e-B102-29902F371959} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
