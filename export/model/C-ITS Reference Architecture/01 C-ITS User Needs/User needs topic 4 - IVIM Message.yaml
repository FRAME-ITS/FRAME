  - name: "11.1.4.2"
    guid: "{B4ABB4F8-33ED-4af6-B1C8-CB6783BDB2AB}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 3
    note: |
      For IVI based use cases the system shall be able to inform drivers of all road signs that are represented in the ISO 14823 graphic data dictionary.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {889C7284-E9DD-43bb-970E-01C06652D998} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.3"
    guid: "{AAF5BA3D-A8E1-474e-9006-16F250AB80C9}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 4
    note: |
      For IVI based use cases the system shall be able to inform drivers of the contents of virtual VMS signs.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {D302B7BE-3910-4eb6-B55B-226CA38CB140} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.4"
    guid: "{1A3CCA9B-0C58-41ed-A886-2BC1BC2A5913}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 5
    note: |
      The system shall use the agreed IVI messages and be able to receive updates.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {5D57D506-9CEC-4244-8CA0-607634C370EB} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.5"
    guid: "{D7847619-42F2-4241-BF27-EEF5DFBE6228}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 6
    note: |
      The system shall be able to encode one main VMS and up to three sub-signs in oneGeneralIviContainer.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {1CFC744E-E5BC-4359-B155-114D23792597} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.6"
    guid: "{9C0FE0FC-ADB7-4a16-9C8F-9C1428FDFD99}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 7
    note: |
      The system shall be able to present additional free text when relevant and extra Text is ordered, hereby the first line corresponds to the first RSCode.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {58B14CFF-E55E-43f5-999C-F43B2994B1DD} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.7"
    guid: "{3299BF22-4349-4b9d-979C-BD63AB3F87CF}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 8
    note: |
      The system shall be able to describe the driving lane configuration when the message is not valid for all lanes andmay use the RoadConfigurationContainer.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {AEA377CB-6C73-4c1d-9693-FECEB9926EAC} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.8"
    guid: "{9AF8D858-6D71-406c-A9AD-F349A47555B1}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 9
    note: |
      This use case is based on the “General IVI Container” including lane status and all types of IOS/TS 14823 signs, as well as the “Road configuration container”. The IVIM permissions (SSP) have to be encoded as defined in ETSI TS 103 301 [11].
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {49440D8B-F4CC-4ea5-B641-4D03C1718802} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.1.4.9"
    guid: "{107B26AD-B83E-4aee-B456-C7D5A34D0D76}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    keywords: "IVIM"
    status: "Proposed"
    version: "1.0"
    order: 10
    note: |
      For IVI based use cases the message shall define the Geographic area (Quadtree) as follows:
      The event is characterized by its referencePosition, detectionZone(s), relevanceZone(s) and DestinationArea. These fields draw a geographic area and C-ITS Actors shall publish in a set of tiles corresponding to the maximum set of tiles containing all the geographic indication mentioned.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {2187323E-800C-46a1-9C09-B8F4021C678D} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
  - name: "11.2.4.1"
    guid: "{87917A51-EBC7-4212-A114-A3B36A741A8A}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 11
    note: |
      For IVI based use cases the system shall enable the road operator to optimize the management of warnings, information and regulations knowing the real-time traffic characteristics.
    links:
      - "Association «belongs to» → FRAME_User_Need_Topic4 IVIM Messages"  # {5F8E5EBB-E3A8-4e26-BC6E-0D4FA678ACC7} → {857CA053-1A9D-4a23-9E1B-0AFA0A439BC4}
