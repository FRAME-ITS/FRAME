  - name: "Parking Area Management"
    guid: "{8DE27522-3716-477e-B08C-3BAAC7A52E94}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Functionality of a parking are management system which takes the static data as input from the parking area operator and also calculates the status and occupancy. The part of FRAME Functional View describing a Parking Area Monitoring system is used in this case as an example. Since the related ITS Directive do not mandate how the information should be gathered from the vehicles in the parking area, this functionality can be replaced, if a Member State or an parking area manager would like to extract this information in another way. In such cases the preferred service will have to provide the same information to the rest of the functional ecosystem.
