elements:
  - name: "Data Platform NAP"
    guid: "{E5881292-2F25-4bc1-8840-23C9D1CC23A4}"
    type: "Component"
    stereotype: "FRAME_Component"
    status: "Proposed"
    order: 0
    tags:
      "LocationDescription": ""
      "Standrdization": ""
    note: |
      The Data Platform NAP component represents the hardware/software implementation of the ITS Service. It consists of modules performing data and metadata quality checks, hosting data and metadata, user data, and credentials, allowing the creation and retrieval of metadata records as well as real data from the internal database and user support.
  - name: "Metadata Directory NAP"
    guid: "{1B971F1C-E2FC-46e2-97A3-CCB248436727}"
    type: "Component"
    stereotype: "FRAME_Component"
    status: "Proposed"
    order: 0
    tags:
      "LocationDescription": ""
      "Standrdization": ""
    note: |
      The Metadata Directory NAP component represents the hardware/software implementation of the ITS Service. It consists of modules performing metadata quality checks, hosting metadata, user data, and credentials, allowing the creation and retrieval of metadata records from the internal database as well as user support.
