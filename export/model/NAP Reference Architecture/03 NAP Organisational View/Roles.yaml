  - name: "NAP IT Provider (NIT)"
    guid: "{273E7961-AD50-416e-AC9A-92FA926DD4A7}"
    type: "Object"
    stereotype: "FRAME_Role"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Key Issue": ""
      "Role Part Of Value Chain": ""
      "Role Value": ""
      "Role View": ""
    note: |
      Key issue:
      Manage IT allowing NAP operation under the service level agreement.
      
      Tasks and responsibilities:
      Set up the IT infrastructure. Scale the IT infrastructure according to the CPs, CCs, and NO demands. Operate, manage, and secure the infrastructure. Report to the NO and resolve promptly any technical issues. Provide technical user support.
      
      From NAP technical operator Role:
      Key issue: Provide the technical means for the NAP Content Manager incl. interfaces to externals. (Hoster of the NAP) Deliver services as requested;
      
      Area of responsibility: Provide common interfaces for the participants and technical support for the service operator.
      
      Tasks:
      
      	- Implement  and operate technical platform, incl. interfaces, databases ...
      	- Second level support for technical issues
      	- Present the different existing ways to access content;
      	- Make content available in the selected way of the content consumer;
      
      
      (includes properties of the former "NAP Content Publisher")
      
      Processes:
      
      	-     Vendor contracting
      
      
      	-     Platform creation and operation
      
      
      	-     NAP user Support process
      
      
      	-     Content reception
      
      
      	-     Content publishing according to metadata directory
      
      
      ITS Capability:
      
      	- Capability to create the technical platform
      	- Capability to generate a metadata directory
      	- Capabilities for the user support
    links:
      - "Dependency → NAP Maintainer"  # {824E4F9B-F144-4855-958E-1FEDC0B0A5A1} → {C36B6532-FE00-4759-82AB-2BF1908C6978}
