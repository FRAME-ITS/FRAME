      - "Abstraction «is Type of» → NAP Content Consumer"  # {D8AF9E54-38F1-4853-860B-BA52A4FEE4E0} → {6713B765-606E-4208-8FE8-99B0D50851A5}
      - "Association «performs» → NAP Content Consumer (CC)"  # {23DC667E-8339-4648-BFBC-B3033D35B957} → {D6B4B664-6BE7-4041-8FFE-448812935D1D}
  - name: "Content Provider"
    guid: "{3F2BCF06-A0E6-4aac-BD7A-3395E43C395B}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Any legal person, data subject, or public or private entity/organization who has the right to grant access to or to share the data under its control. The subject in question shall hold the data that are required to be made accessible via NAP by or more of the Delegated Regulations.
      
      NOTE1: We do not create objects for each Content Provider actor type.
      NOTE2: Content Provider includes the Data Holder term as it is specified in MMTIS and RTTI regulations.
      
      Content Provider actor represents and fulfills the interests of the Content Provider Stakeholders.
      
      Represented by:
      
      For the RTTI (2015/962 repealed from 1 January 2025 by 2022/670) concerning:
      
      	- data on infrastructure: road authorities, public or private road operator/s, tolling operators, recharging and refuelling-related stakeholders
      	- data on regulations and restrictions: road authorities, public or private road operator/s, tolling operators
      	- data on the state of the network: road authorities, public or private road operator/s, holders of in-vehicle generated data, service providers*
      	- data on the real-time use of the network: road authorities, public or private road operator/s, holders of in-vehicle generated data, service providers*, recharging and refuelling-related stakeholders
      
      
      * ‘service provider’ means any public or private provider of a real-time traffic information service, excluding a mere conveyer of data to data users;
      
      For the SRTI (886/2013) concerning:
      
      	- road safety-related traffic data: Service providers, public and/or private road operators, broadcasters dedicated to traffic information, and automotive industries (as service providers when processing vehicle data) [886/2013, art. 7]
      
      
      For the SSTP (885/2013) concerning:
      
      	- static and dynamic information related to safe and secure parking: public or private parking operators and service providers (any public or private body that provides the information service to users) [885/2013 art. 5]
      
      
      For the AFIR (2023/1804) concerning:
      
      	- static and dynamic information related to alternative fuel infrastructure: operators of publicly accessible recharging points and refuelling points for alternative fuels, or, under the arrangements between them, the owners
      
      
      For the MMTIS (2017/1926 amended by 2024/490) concerning:
      
      	- static, historic and observed travel and traffic data: transport authorities, transport operators, infrastructure managers, transport on demand service providers
      	- dynamic travel and traffic data: see above
      	- linking travel information services: travel information service provider
      
      
      This Generic Actor Role Content Provider shall represent any provider of traffic and transport data.
      
      The Content Provider describes this data with meta-data on the NAP (to be stored in D3.15 NAP Meta-Data). Information about the Content Provider, such as contact details, shall be kept in D3.17 NAP Content Providers.
      Content Providers are for example public and private road operators, road authorities, service providers, transport authorities, transport operators, infrastructure managers, transport on-demand service providers. The obligations to make contents accessible via the NAP mainly depends on the type of data according to the Delegated Regulations 885/2013, 886/2013, 962/2015, 1926/2017
      
      Key issue: Provide and publish content (to which he has the legal rights to publish); collect content
      
      Area of responsibility: Provide timely and accurate traffic data
      
      Tasks: Provide content relevant to the ITS domain and according to contracts with the NAP and content consumers
      
      Mnemonic: nap.cp
