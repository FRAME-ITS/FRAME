elements:
  - name: "KPI 3.1 Search functionalities"
    guid: "{4CE86A2C-C410-439b-AFFD-9793CCF8B41E}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Search functionalities” KPI assesses whether dataset discovery services are incorporated into a NAP. It is assumed that the existence of such services is associated with a minimum acceptable level of service, irrespective of the extent to which these services rely on the use of harmonized/coordinated metadata records. Provided that harmonized/coordinated metadata records are used, there are several additional parameters through which the maturity of these services can be judged. Depending on whether existing services comply with those parameters, the value of the current KPI is increased by one. The first two parameters relate to the possibility of searching the dataset by using free-text or proposed keywords that are both based on harmonized metadata records. The third parameter involves the possibility of including wildcard characters—or other expressions limiting the search results as required—in the search queries logical operators. The next parameter involves search options based on enumeration values. The final two parameters involve map- or location-based search functionalities as well as the possibility to save search patterns and settings.
      
      Can a user search/filter content on the NAP?
      
      0 N/A
      1: Discovery services available (not necessarily based on harmonized metadata)
      2. Discovery services available (search/filtering) based on harmonized metadata (free text or keywords)
      Value+1 (for each of the following options) Which search/filtering functionalities are available to the user? You can select more options:
      a. Search/filtering options AND, OR, wildcard (*), range (from... to...) available
      b. Enumeration search/filtering based on harmonized metadata
      c. Map-based search
      d. Other location-based search (e.g., NUTS-Code)
      
      
      
      Minimum acceptable value for interoperability: 2
    links:
      - "Association «fulfilled by» → F3.6.4 Manage Metadata Retrieval"  # {4286AC1E-060E-43ef-909E-616AEA475CBC} → {2F2393E9-9A59-4344-A2C0-207945E7F438}
  - name: "KPI 3.2 Search results"
    guid: "{3EDFD1C1-DFC2-44f5-B31C-F85FBB99684A}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      Search results” KPI aims to assess the performance of a NAP in terms of presenting and further analyzing search results. Foreseen possibilities include the listing of search results, their further filtering and sorting, or even their visualization (e.g., in the form of a map). It is assumed that a simple listing of search results constitutes a minimum acceptable operational prerequisite of a NAP.
      
      Are the search results displayed?
      
      0: No
      1: Yes (at least list of search results)
      Value+1 (for each of the following options): Are there more features than a basic list of search results? How are the search results displayed? You can select more options:
      a. List of search results that can be further “filtered or sorted”
      b. Map-based presentation of search results
      c. Option to save search pattern or settings
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Association «fulfilled by» → F3.6.4 Manage Metadata Retrieval"  # {B3A94854-5FE1-46d9-921B-5A9FCBE8CE01} → {2F2393E9-9A59-4344-A2C0-207945E7F438}
  - name: "KPI 3.3 Machine-readable metadata"
    guid: "{9BD4B8DE-4CA0-4a91-95F8-F0A7FD7CE558}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Machine – readable metadata” KPI aims to assess the machine readability of a NAP’s metadata. A value equal to 1 indicates that metadata are machine readable and can be represented in a common self-describing format (e.g., JSON, XML), while a value equal to 2 indicates that metadata comply to a harmonized application profile and can be represented in a common format promoting the concept of Linked Data (e.g., RDF).
      
      Is machine-readable metadata provided by the NAP?
      
      0: No availability of machine-readable metadata
      1: Provision of machine-readable metadata in a self-describing format (JSON, XML, …)
      2: Provision of machine-readable metadata as Linked Data (“RDF” that also can be expressed in JSON-LD, ...) in a self-describing format
      3: Provision of machine-readable metadata in a self-describing format complying to commonly agreed standard mobilityDCAT-AP
      
      
      Minimum acceptable value for interoperability: 2
    links:
