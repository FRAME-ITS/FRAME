elements:
  - name: "KPI 7.1 Data reuse – NAP"
    guid: "{D72070D6-9ECF-411a-8281-534019823FD6}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      Link to NAR: ???
      
      “Data reuse – NAP” KPI assesses, from the perspective of a NAP operator, whether a NAP operator provides descriptive/detailed information about the terms and conditions for data reuse (or not). A value equal to 0 points out an absence of such a provision, a value equal to 1 indicates that there is a descriptive provision, while a value equal to 2 indicates that there is a detailed provision through sample contracts or standardized data licensing frameworks. It is assumed that a NAP should at least provide descriptive information about the terms and conditions for data reuse.
      
      Does the NAP provide Terms and Conditions for reuse of metadata, data and other relevant information displayed at the NAP?
      
      0: No
      1: Descriptive (brief text description)
      2: Detailed (where necessary – terms and conditions and/or standardized licenses framework)
      
      
      Minimum acceptable value for interoperability: 1
  - name: "KPI 7.2 Data reuse – data provider"
    guid: "{8A1CF06F-F5C9-4f65-B5F6-84DA47139132}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      Link to NAR: ???
      
      “Data reuse – data provider” KPI assesses, from the perspective of data provider, whether a data provider provides descriptive/detailed information about the terms and conditions for data reuse (or not). A value equal to 0 points out an absence of such a provision, a value equal to 1 indicates that there is a descriptive provision, while a value equal to 2 indicates that there is a detailed provision through sample contracts or standardized data licensing frameworks. It is assumed that a NAP should at least provide descriptive information about the terms and conditions for data reuse.
      
      Is it possible for the NAP to provide “Terms and Conditions” for reuse of data published by the data provider at the NAP?
      
      0: No
      1: Descriptive (brief text description)
      2: Detailed (where necessary – full sample contract conditions and/or standardized licenses framework)
      
      
      Minimum acceptable value for interoperability: 2
  - name: "KPI 7.3 Operational procedure information"
    guid: "{16AB0A17-9AC4-4aec-9EAA-7EA1F349055C}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      Link to NAR: ???
      
      “Operational procedure information” KPI assesses whether a NAP includes guidelines about the operational procedures that need to be followed for becoming a data provider of a NAP or, in general, who is responsible for doing what. In this case, the ACC value is set to 1 reflecting that NAPs shall provide such guidelines.
      
      Does the NAP provide operational procedure information, i.e., information about the processes in the NAP, e.g., how a potential data provider/consumer becomes accredited, how the data is provided, what is a contact point where to discuss the technical issues etc.?
      
      0: No
      1: Yes
      
      Minimum acceptable value for interoperability: 1
  - name: "KPI 7.4 Dataset indicators"
    guid: "{78665FD8-6086-4226-8ABE-C8E96A54FE8C}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Dataset indicators” KPI examines whether a NAP provides information about the compliance of its datasets with the requirements set by the Delegated Regulations supplementing the ITS Directive (e.g., regarding the quality, accessibility, exchange timeframe, re-use, and update of the provided data). A value equal to 1 indicates that a NAP provides information about whether a self-declaration form has been submitted by the provider of a dataset, while a value equal to 2 indicates that a NAP provides information about the results of the compliance assessment process (if any). However, this KPI is assumed as not relating to the minimum acceptable level of service of a NAP.
      
      Does the NAP provide information about the compliance of its datasets with the requirements set by the Delegated Regulations supplementing the ITS Directive (e.g., regarding the quality, accessibility, exchange timeframe, re-use, and update of the provided data)
      
      0: No
      1: Provision of information about whether a self-declaration has been provided
      2: Provision of information about whether a positive compliance assessment has been executed
      
      
      Minimum acceptable value for interoperability: 1
