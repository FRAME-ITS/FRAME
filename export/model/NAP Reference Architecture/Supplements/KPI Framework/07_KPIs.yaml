  - name: "KPI 7.5 Compliance assessment"
    guid: "{CD0A503A-335F-4864-8536-9F4576474961}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      Link to NAR: Not defined yet in WG5
      
      “Compliance assessment” KPI assesses whether a NAP facilitates the procedure of compliance assessment by providing self-declaration templates or by enabling data providers to submit self-declarations (to National Bodies). In the first case, the KPI is equal to 1, whereas in the second one the KPI is equal to 2. This KPI is once again assumed as not relating to the minimum acceptable level of service of a NAP.
      
      Does the NAP facilitate the procedure of compliance assessment by providing self-declaration templates or by enabling data providers to submit self-declarations to the NAP. ?
      
      0: No
      1: NAP provides self-declaration forms/templates without any additional involvement in process.
      2: NAP facilitates the submission of self-declarations  , in addition to providing the templates.
      
      
      Minimum acceptable value for interoperability: 1
  - name: "KPI 7.6 Association of published datasets with Delegated Regulations"
    guid: "{747DB3C3-C956-4030-9637-30756698054B}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Association of published datasets with Delegated Regulations” KPI assesses whether the metadata provided by a NAP can indicate the relevance of its datasets with the Delegated Regulations supplementing the ITS Directive. Both ACC and REQ value is set to 1, reflecting that such an association is necessary.
      
      Are datasets published associated with Delegated Regulations supplementing the ITS Directive?
      
      0: No
      1: Yes
      
      
      Minimum acceptable value for interoperability: 1
  - name: "KPI 7.7 Quality indicators for datasets"
    guid: "{C344E742-01BB-4f58-B613-19C5B75E57B6}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Quality indicators for datasets” KPI assesses the extent to which a NAP provides insight into the quality of the provided data/metadata. There are four possible values that this KPI may take. A value equal to 1 indicates that a NAP includes a description of the quality of the provided metadata (e.g., based on a pre-established metadata quality assessment scheme). A value equal to 2 indicates that a NAP provides a description of general quality definitions to support its users to self-assess the quality of utilized data or high-level quality assessment statements in the metadata of hosted publications. On the other hand, a value equal to 3 indicates that a more detailed data quality description is provided in the metadata of hosted publications; however, provided details and values do not cover the entirety of quality fields that may relate to the nature of exchanged data. Finally, a value equal to 4 indicates that there is a solid description of all fields. It is assumed that a NAP shall at least provide metadata quality descriptions for achieving a minimum acceptable level of service.
      
      Does the NAP provide information or descriptions for data quality?
      
      0: No
      1: Yes, a metadata field where the data provider can describe the quality of the dataset.
      2: Yes, description of general quality definitions
      3: Yes, description of some of datasets (fields) quality
      4: Yes, description of all datasets (fields) quality
      
      
      Minimum acceptable value for interoperability: 1
