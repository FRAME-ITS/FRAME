elements:
  - name: "KPI 5.1 Documentation & description of datasets"
    guid: "{DEAE1C7A-1D84-41ec-8301-E4726F387B6F}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Documentation & description of datasets” KPI assesses whether the datasets of a NAP are accompanied by supporting material, such as documentation, high-level descriptions (included in a metadata filed), or even explanatory links providing further information (e.g., schemas). The minimum level of service is associated with a high-level description of datasets on the platform. In case there are available links with additional information about datasets, an advanced level of service is assumed.
      
      How is the NAP providing documentation and description of datasets?
      
      N/A: Metadata directory case (No relevancy, this is a responsibility of data providers)
      0: Lack of dataset documentation and description or high-level description of datasets on the platform (e.g., in the metadata page)
      1: Availability of links and supporting material (e.g., XML schemas), where necessary
      2: Availability of links and validated supporting material (e.g., validated and up-to-date XML schemas), where necessary
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {4E09E0E5-83C4-4a96-AF53-E93EDADCCEC3} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "KPI 5.2 Classification of datasets"
    guid: "{83214B25-55CB-415c-B142-439C41EEF164}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Classification of datasets” is the second KPI grouped into this category. Dataset classification can be based either on custom parameters such as parameters indicating the type of network or on formal terminology and coordinated metadata. A classification based on the former parameters is associated with a minimum acceptable level of service, while a classification based on the latter parameters is associated with a REQ required level of service.
      
      Does the NAP provide classification of datasets based on standard/controlled vocabularies?
      
      0: Lack of dataset classification
      1: Classification of datasets based on custom parameters only (e.g., transport mode/network covered)
      2: Classification of datasets based at least on formal terminology/keywords (vocabulary of the mobility-DCAT-AP) or coordinated metadata catalogues
      
      
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {407DBB2A-BE5B-4b19-A5DC-B9AEBE83B466} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
