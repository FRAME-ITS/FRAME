    note: |
      Not linked to NAR!
      
      Does the NAP adhere to principles of web structure, page layout and menu structure?
      
      Initial value 0 and then +1 for each of the following options: You can select more options:
      a. Menus are in the same position
      b. Use of same fonts and colours throughout the site
      c. Availability of a search box on each page
      d. Logo links back to the home page
      e. Existence of a hierarchical arrangement of web subpages
      f. Existence of a “sitemap” page easing navigation (e.g., a tree structure with links to individual pages)
      
