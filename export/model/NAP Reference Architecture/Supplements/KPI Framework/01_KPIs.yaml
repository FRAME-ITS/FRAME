  - name: "KPI 1.4 Responsiveness"
    guid: "{A619225B-8550-4dca-B6EE-0505006A4749}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Responsiveness” KPI examines whether a NAP’s web design is adaptable to different devices and screen sizes. There are three possible values that this KPI may take. A value equal to 0 indicates that there is no responsiveness, a value equal to 1 indicates that a NAP is responsive to different screen sizes and, lastly, a value equal to 2 indicates that a NAP is responsive to both different screen sizes and devices. The minimum level of service is associated, in this case, with the responsivity of a NAP to at least different screen sizes.
      
      0: No responsive web design
      1: Responsive web design for different screen sizes on PC
      2: Responsive web design for different screen sizes and devices
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Association «fulfilled by» → Data Platform NAP"  # {36EA20EC-F99D-49c4-A93C-FF74BEDE910A} → {E5881292-2F25-4bc1-8840-23C9D1CC23A4}
      - "Association «fulfilled by» → Metadata Directory NAP"  # {D8846E4E-BEEB-4c0d-B142-828F4679F335} → {1B971F1C-E2FC-46e2-97A3-CCB248436727}
  - name: "KPI 1.5 Web performance – Simplicity / usability"
    guid: "{19537BDF-1852-45b1-A148-C47A90792691}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      What is the average number of operations (e.g., key presses, mouse wheel movements, mouse/screen clicks) required to get access to metadata (without getting the data itself)?
      The value should be relevant for getting access to “metadata language” or “metadata contact point” (if you are having both, please, use an average).
      The value should be relevant to a skilled user, i.e., who already knows the set-up of the website (where to find the metadata).
      The value refers to unregistered or logged-in user (the logging process is not involved in the parameter).
      
      Value 0 to infinity
      
      Minimum acceptable value for interoperability: 10
    links:
      - "Association «fulfilled by» → Data Platform NAP"  # {EF45F417-2FAF-43ce-A241-C70363E22BD1} → {E5881292-2F25-4bc1-8840-23C9D1CC23A4}
      - "Association «fulfilled by» → Metadata Directory NAP"  # {F5C45B1D-8866-4c1b-AE6C-D8106300B9E2} → {1B971F1C-E2FC-46e2-97A3-CCB248436727}
  - name: "KPI 1.6 Data visualization"
    guid: "{029037A9-99C2-45b7-BA28-87E427702779}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      Not linked to NAR elements!!
      
      Does the NAP include data visualization functionalities?
      
      Note: The visualization can include graphs summaries of data aggregation, time series, maps with areas of service, maps with information from data (location of pitstops) etc.
      
      Note: Even if no data is provided via NAP interface (like in metadata directories), it is still possible to have visualization available, e.g., through WMS.
      
      0: No visualization of data
      0: Visualization is available
      Value+1 (for each of the following options): What types of data visualization functionalities are available? You can select more options:
      	a. Data download, allowing the user to do some visualization at the clients' side
      	b. Visualization available as images presented on the web
      	c. Visualization available as interactive web map services
      	d. Visualization available projecting a time-lapse video (for a selected time period)
      
      Minimum acceptable value for interoperability: 1
  - name: "KPI 1.7 Web performance – Consistency and navigability"
    guid: "{4B3700B3-CF65-470c-83D9-B0FB0A7D7E69}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
