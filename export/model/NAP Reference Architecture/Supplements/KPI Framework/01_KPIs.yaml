  - name: "KPI 1.9 Security – Technical"
    guid: "{F1AE9278-2AB5-4ade-9476-7518D07969C2}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Security – Technical” KPI addresses the existence of security features (i.e., security certificates) and the protection of personal data provided by NAP users. A value equal to 0 points out the absence of any security feature. On the other hand, a value equal to 1 indicates the existence of security certificates in specific parts of a NAP’s website, while a value equal to 2 indicates the existence of security certificates throughout the website of a NAP. In that case, a minimum level of service is assumed to be exhibited by a NAP when SSL certificates cover at least the most critical (in terms of data protection) parts of a NAP’s website.
      
      
      0: Absence of security certificates
      1: Partial existence of security certificates (e.g., in the landing page but not in the elements of the main sitemap)
      2: Existence of security certificates in the entirety of the platform’s elements
      
      Minimum acceptable value for interoperability: 1
