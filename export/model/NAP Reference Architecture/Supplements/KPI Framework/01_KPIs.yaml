  - name: "KPI 1.8 Support of commonly used languages"
    guid: "{69E72527-738E-4f0d-AB71-879AF126CC0A}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
    note: |
      “Support of commonly used languages” KPI may take four possible values. A value equal to 0 indicates that a NAP supports only the national language. A value equal to 1 indicates that although a NAP supports English, some of its content (e.g., metadata of included publications) is provided only in the national language. On the other hand, a value equal to 2 indicates that a NAP fully supports the English language.
      
      Note: This is relevant to the webpage while this is not relevant to the metadata/data content that depend on its publisher.
      
      0: Supports national language only, other than EN
      1: Supports EN but some content in national language only (other than EN)
      2: Supports EN for platform and all content (user interface and all text content)
      
      Minimum acceptable value for interoperability: 1
