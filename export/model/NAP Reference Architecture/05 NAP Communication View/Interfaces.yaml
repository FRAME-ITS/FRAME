  - name: "Content Provider Metadata repository interface"
    guid: "{DAA1010E-3FD1-49b7-AC66-2080DB101A8E}"
    type: "Interface"
    stereotype: "FRAME_Interface"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This interface is used to provide metadata to the NAP.
      
      As a guideline for minimum expectation the following values can be used:
      
      Data type: Raw data
      
      max bytes per message
      up to 500 kBytes for meta data
      up to 10 MBytes for attached files
      
      maximum delay [s]
      system response time below 100ms (independent from user internet connection)
      delay for uploading meta data: 0.5s
      delay for uploading attached files: 10s
      
      message interval
      one minute - assumption that two data provider are putting data in parallel at the same time; depends on client numbers
      
      security level
      level high:
      authorization by the system
      encrypted data transfer on system side
      
      transfer mode
      wired connection
    links:
      - "Association «adheres to» → Proposal Usability"  # {C5E54DBA-AB48-44b5-9123-11F0664F2044} → {FCEC8243-9F60-43ec-8978-F5EF5F50D1F3}
