package: "NAP Reference Architecture/00 NAP Motivation Layer/Bussiness Expectations"
guid: "{2D034B97-F528-4d60-A51D-ED727D8A4F0F}"
alias: ""
version: "1.0"
note: ""
elements:
  - name: "Access to the content providers and their services"
    guid: "{BEEC92A0-2D8F-4223-80CC-93C134836DD3}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The National Body expects better and easier access to the content providers and their services (with their description and (observed) qualitative parameters) as they are being promoted through NAP, instead of finding and reaching out to the content consumer separately.
    links:
      - "Association «defines» → Fulfilling National Access Point obligations according to ITS directive"  # {9918B3AF-B7AE-452B-B042-D703595C82D5} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
  - name: "Better data visibility and usability"
    guid: "{A74A1B0F-B29F-4ef3-B785-89BF9BED3ACC}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Data and Service Providers expect fulfilling obligations stipulated by the ITS Directive and related Delegated Regulations and as side effects  increased visibility of their data by publishing them (or respective metadata) at the NAP and increased usability of their data by adopting EU wide recommended standards and profiles.
    links:
      - "Association «defines» → Fulfilling National Access Point obligations according to ITS directive"  # {A266ABB5-EABD-43BC-A8F8-CC6D2FD3F1A5} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
  - name: "Better mobility services for citizens"
    guid: "{B1BC2597-7347-4c5e-AD8F-54DD1CD5430C}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Member State  is the main protagonist in creating and implementing European Policy through the European Parliament and legislature development process. It has similar expectations to the European Commission e.g. more efficient transport and less accidents. It also has expectations targeted to increased use of governmental data as well as data from private parties. Better cross-border traffic management and increased MS cooperation.
    links:
      - "Association «defines» → Fulfilling National Access Point obligations according to ITS directive"  # {8B7AAF24-7805-42E9-A1FA-1A45006E3796} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
  - name: "Clear set of requirements"
    guid: "{C5BF4F37-E65D-4998-BC18-CF0C0F8F8AF9}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The NAP Operator is the main facilitator of the data and service exchange between provider and consumer. They expect easy / defined operational and legislative environment lay out by Member States.
    links:
      - "Association «defines» → Fulfilling National Access Point obligations according to ITS directive"  # {F491AF54-C5E2-4E6E-A10D-A866EF383642} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
  - name: "EU-wide coverage and harmonized delivery of ITS services"
    guid: "{40E6AD55-91B5-46d0-97FB-DAD263613E62}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The European Commission is main policy facilitator, it proposes and implements legislation. The EC expectations are stipulated within the EU mobility strategy documents and are ultimately focused on reducing the environmental impact of European transport and reduction of fatalities and accidents on European roads through facilitation of easy to access EU wide harmonized traffic and travel data exchange.
    links:
      - "Association «defines» → Fulfilling National Access Point obligations according to ITS directive"  # {8FE74ECD-D1CC-4BD0-8406-D187A292C7E0} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
  - name: "Easy access to harmonized services"
    guid: "{BC8FFFD0-5AB4-49dc-B949-BEB69CF1D447}"
    type: "Artifact"
    stereotype: "FRAME_Business_Expectation"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Content Consumer expects all mobility data or services accessible online at one place (NAP), uniformly described, and with content aligned by recommended standards and/or relevant profiles.
    links:
      - "Association «defines» → Fulfilling National Access Point obligations according to ITS directive"  # {E160E280-1BD6-420E-A724-B222CBD118C8} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
