  - name: "Traffic and traveller information"
    guid: "{8B164E93-51CD-4297-9892-68CF32915834}"
    type: "Artifact"
    stereotype: "FRAME_ITS_Domain"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Transport Network
      European road and railroad, tram and underground and ferry transport  network and extensible to Public Transport and Interfaces of other modes e.g. air and waterways.
      
      ITS Service
      EU wide ITS services coverage with seamless handover between different member states for easier and consistent ITS service building at neighbouring regions, states and at EU level.
      
      ITS Service Type
      static, dynamic data and information sets as well as services of public and private stakeholders including parking, safety related traffic information, real time traffic information and multimodal travel information.
      
      Level of detail
      Organizational view of NAP stakeholders and their cooperation, including a functional definition of the ITS service at meta level and including their data content coverage/contribution in the defined ITS domain.
      
      Perspective
      Policy perspective, with contribution from public and private stakeholders in the service development and delivery.
      
      Focus
      Cooperations between roles and Information systems, interfaces and standards to foster regular data exchange.
    links:
      - "Usage «Instantiate» → Fulfilling National Access Point obligations according to ITS directive"  # {B3DB16B7-F14A-4b8e-8A41-FD0AE12F7882} → {5BC72E89-BADD-4468-8CF6-53736DE6B090}
