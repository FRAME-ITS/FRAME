      It contains data objects that provide metadata that has been retrieved from the store of NAP Metadata following a request.  The metadata that has been read from the store gives information about the contents which are made accessible by the NAP Content Provider. The required and optional elements of metadata can be found in a metadata catalogue: https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/index.html
      
      Apart from data specified by the above said catalogue other data are managed by the read function these are data quality records and NAP User event log.
