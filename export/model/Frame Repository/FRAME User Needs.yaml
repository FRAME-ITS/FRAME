    type: "Requirement"
    stereotype: "FRAME_User_Need_Service"
    alias: "7.5"
    version: "5.0"
    order: 0
    note: |
      These are applications and services that enhance the efficiency of traffic by providing Traffic Flow Optimisation, Advanced Adaptive Traffic Signals and Flexible Lane Allocation.  These User Needs are associated with functions that are expected to use V2V and V2I technologies (Cooperative Systems).
    links:
      - "Association «belongsto» → 7 Traffic Management"  # {F4EDE908-732C-4394-893D-2B8E974F6733} → {91DBA149-E681-4282-B9F3-38EB3F165EDC}
