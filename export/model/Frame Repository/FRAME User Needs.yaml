    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to monitor the passage of the Freight Vehicle, together with any current or predicted deviations or delays, and advise the Freight Vehicle Driver when there is likely to be a deviation from the planned correct driving hours.
  - name: "9.11.2.6"
