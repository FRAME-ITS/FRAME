    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to support the exchange of messages (text and audio) between the Freight Transport Operations Manager and the Freight Vehicle Driver.
  - name: "9.11.2.5"
