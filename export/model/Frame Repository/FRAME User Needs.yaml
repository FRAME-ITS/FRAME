package: "Frame Repository/FRAME User Needs"
guid: "{473A3C10-1585-4ceb-9152-C2C5BB07BA93}"
alias: ""
version: "1.0"
note: ""
elements:
  - name: "1.1.1"
    guid: "{8D031E37-BB46-4763-8F50-0B2530C58FDD}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture description shall include functional, information, physical and
      communication perspectives.
  - name: "1.1.10"
    guid: "{17E58CA9-4B78-48dd-A944-F890391371D9}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall support interaction between services provided by
      private and public bodies.
  - name: "1.1.11"
    guid: "{3D09CA06-ACD9-404d-B61E-8B91BF93AA93}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow current organisational responsibilities and legal
      liabilities to be retained.
  - name: "1.1.12"
    guid: "{8FA53EB1-2052-449c-B691-98EC16E7B119}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall, where possible, describe migration path(s) that can be
      followed to enable architectures defined for existing traffic and transport management, as
      well as other ITS control and information systems, to become compliant.
  - name: "1.1.13"
    guid: "{CF315E73-6680-4bc7-9D1A-F8FFF4E646A1}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow the use of existing and emerging communication
      infrastructures, or describe possible migration paths to explain how they can become
      compliant.
  - name: "1.1.14"
    guid: "{63EC9C63-1306-4d4b-96AA-0E020EF4B14C}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall support the integration of Traffic Information Centres
      and Traffic Control Centres into national and international networks.
  - name: "1.1.15"
    guid: "{C48F03ED-F564-4835-B85E-868DCC996FF9}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture description shall identify clearly the relevant interfaces to
      other modes of transport.
  - name: "1.1.2"
    guid: "{2AF2AA50-2109-4393-9829-4534095C1991}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture description shall include a number of reference models to
      describe the relationships between the services needed within the traffic and transport
      system.
  - name: "1.1.3"
    guid: "{5C7117CE-5C91-43d0-ACC6-1D46E1AE125E}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture description shall include a glossary to explain all the main
      concepts described in the architecture.
  - name: "1.1.4"
    guid: "{6A65E67E-3B43-4be6-AF57-CAD3EB0FC9F4}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall exchange information in a
      manner that permits road and traffic conditions to be understood by all parties.
  - name: "1.1.4"
    guid: "{A90F40AD-1283-46d2-81EF-460977B37966}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall be provided in a form which enables it to be up-dated
      after delivery.
  - name: "1.1.5"
    guid: "{935CDC3A-FDC8-4cf6-8B73-F0123C59E848}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall be technology independent.
  - name: "1.1.6"
    guid: "{F130A5FA-E6C9-4b25-A903-803BA4A230D0}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall facilitate the creation of modular and flexible designs,
      so that manufacturers can produce their own versions of equipment.
  - name: "1.1.7"
    guid: "{DBF4281A-136B-4de1-8C71-BE2BB2BF6DD3}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow equipment performing the same service to be
      provided by various suppliers.
  - name: "1.1.8"
    guid: "{2DF9E625-39A6-4651-81E8-B60A99CE46F5}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow the same service to be provided by various
      service providers.
  - name: "1.1.9"
    guid: "{7B19D1C6-7A54-4fc8-8258-6EFB811AA449}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow the user to select from one of a number of
      suppliers of the same service.
  - name: "1.10.1"
    guid: "{913D615B-8720-418d-BA5D-2B8BAD621020}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow all systems developed from it to be able to detect
      errors in operation, when higher integrity is required, e.g. for financial, security or safety
      reasons.
  - name: "1.10.2"
    guid: "{8C13452D-5897-4b0a-8DF8-CDA2DDEE26E8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall be able to monitor each safetyrelated
      component (including software), warn the user in case of problems, and disable it,
      or reduce it to a safe state.
  - name: "1.10.3"
    guid: "{1A4558CF-D6E7-4f9a-ACFB-6E7D82726D41}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all safety-related systems developed from it to
      be fault-tolerant.
  - name: "1.10.4"
    guid: "{EC350853-F6A1-406e-AF83-96B0ADE9DBA4}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to be reliable with
      respect to the legal and/or quality requirements necessary for each application.
  - name: "1.10.5"
    guid: "{F4485C24-52C9-4df1-8F49-ADE038C9CF0D}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to be able to
      operate in all potential climatic and traffic conditions.
  - name: "1.10.6"
    guid: "{49C996EB-243E-4515-B53C-70D3D3766A4C}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to check input data for
      reasonableness before it is used by a later part of the system.
  - name: "1.10.7"
    guid: "{EE410947-4940-4c38-8ED6-5631E86B8AE7}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to obtain vehicle data
      in a manner that does not affect the correct functioning of the safety functions of the host
      vehicle.
  - name: "1.10.8"
    guid: "{71E87B09-06E9-4b9c-9ACB-CA056006F5E6}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to inform drivers via
      an in-vehicle device when it is not operating correctly.
  - name: "1.11.1"
    guid: "{52B0FA1E-B722-4d93-8A69-E7BDB2200801}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide functionality that operates in a manner that
      does not generate a safety hazard for its users.
  - name: "1.11.2"
    guid: "{63B61AD4-0F06-456b-BA31-982767538297}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide functionality that operates in a manner that
      does not encourage unsafe behaviour.
  - name: "1.11.3"
    guid: "{E6886A4C-8A6A-444e-A035-4BB9A9CCF844}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide functionality that operates in a safe manner
      during degraded modes of operation.
  - name: "1.11.4"
    guid: "{C8F70F14-6A89-42ef-8CCD-FF45D1F939BA}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide functionality that is ultimately under the control
      of the human operator.
  - name: "1.11.5"
    guid: "{9EA49C4C-C77B-4324-929B-7D27D1935029}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall display information in a
      manner that will avoid driver overload, and distraction from the primary driving task.
  - name: "1.11.6"
    guid: "{CFE8B694-52D3-457c-A4C1-FB1FE69D3331}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall display messages to the driver
      in a priority order that relates to the current traffic and driving situation and the workload
      of the driver.
  - name: "1.12.1"
    guid: "{4FC2A090-B6E9-41ec-8AC1-5F6629D0DB1B}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require that systems developed from it are capable of
      surviving accidental and intentional attacks on their integrity.
  - name: "1.12.2"
    guid: "{17E9F829-239E-433f-BBDF-8666106801B8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to provide protection
      against unauthorised access.
  - name: "1.12.3"
    guid: "{A7B3EB01-0ED3-4b41-AD88-364AFFB006C4}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall encrypt all personal
      information prior to it being transmitted.
  - name: "1.12.4"
    guid: "{50B82453-E509-4cd7-9E90-5A30D0FB9478}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      System that conform to the Framework Architecture shall be able to maintain its own
      integrity, e.g. only react to authorised sources, and check that input data is reasonable.
  - name: "1.13.1"
    guid: "{DBFE3C99-DB6C-4990-A654-8BEDE3357979}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to have user
      interfaces with similar "look and feel" and similar end user assistance.
  - name: "1.13.2"
    guid: "{09038DE7-31F8-408b-B7D8-6BE46E216250}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to be simple and
      efficient for travellers to use, and easy to understand.
  - name: "1.13.3"
    guid: "{598747A9-88CC-49f6-B002-4A8B31BC4C76}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all interactive systems developed from it to
      have a user interface syntax that is easy to learn and to remember (especially for users
      with specific needs).
  - name: "1.13.4"
    guid: "{9860E89B-6A48-4387-B654-9933E96EED1F}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall produce their output within a
      time that is sufficient to be useful, and within normal expectations,
  - name: "1.13.5"
    guid: "{ADA4E475-9FB1-48aa-8742-D94B47547F9A}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to provide
      facilities that enable their users to control the speed and frequency of information
      presentation.
  - name: "1.13.6"
    guid: "{051D41C0-0AEB-44c3-A055-5ACE20CBF2A7}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall ensure that the safety and security of systems
      developed from it are not compromised by their ease of use.
  - name: "1.13.7"
    guid: "{F89534D8-B58A-48d9-8F62-EA479E8761A8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Systems developed from the Framework Architecture shall ensure that all the
      information presented to the driver on one or more channels is unambiguous and
      consistent.
  - name: "1.13.8"
    guid: "{F3D64DD0-7CB7-47ca-AB70-3F5D328D558D}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall display traffic signs according
      to the Vienna convention.
  - name: "1.14.1"
    guid: "{FEEACCB1-02B3-4a4a-A22C-D55C589BF26B}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to accommodate
      those users with one or more impairments (e.g. of upper/lower limbs/body, stature,
      coordination or power, vision, hearing, speech, cognition, epilepsy, etc.) where relevant.
  - name: "1.14.2"
    guid: "{1CC9E43E-6B3C-4434-8093-64C5DDBF3F4F}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require system developed from it to accommodate
      those users who travel with baggage and/or extra equipment (e.g. mothers with pushchairs,
      disabled persons in wheel-chairs, (guide) dogs, etc.) where relevant.
  - name: "1.14.3"
    guid: "{D9E7B623-A7C5-41b6-BFDD-4B2EB9CFCEAC}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to be able to take
      their input from a variety of alternative devices (e.g. keys, voice, buttons, touch-screen,
      smart card, etc.) to suit travellers with special needs, where relevant.
  - name: "1.14.4"
    guid: "{3F3ABE7E-69CA-4e2c-A27A-4EAB6F2EEC32}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to be able to provide
      output in a variety of alternative modes (e.g. (enlarged) text, symbols, graphics, speech,
      tactile, HUD, etc.) to suit travellers with special needs, where relevant.
  - name: "1.14.5"
    guid: "{75081DC3-945B-4187-9373-5078C7314EB8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to be able to repeat
      information on request, in particular for those with special needs, where relevant.
  - name: "1.14.6"
    guid: "{BAF2E3C1-E574-4b01-A79F-8F28C8B4FB8A}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to be able to
      recognise the identity of a traveller using a variety of alternative methods, where relevant.
  - name: "1.14.7"
    guid: "{6BFA1A86-0E37-4099-B931-E79FB71A3292}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to be able to have
      adaptable user interfaces that may be customised by the traveller, in particular those with
      special needs, where relevant.
  - name: "1.14.8"
    guid: "{1587D044-14E4-41c4-B00F-124E38937EFC}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require systems developed from it to be able to be able
      to read pre-recorded personal details (e.g. impairment and/or medical details), in
      particular of those with special needs, where relevant.
  - name: "1.15.1"
    guid: "{B942B72F-2522-4688-9414-509CC3053645}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to provide an unattributable,
      but unique, identifier to each vehicle for the duration of a trip in order to
      provide basic privacy.
  - name: "1.16.1"
    guid: "{79494CB0-A68C-42fe-9ABC-E3960BCE4DC2}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to send messages
      through more than one vehicle and/or road-side device (multi-hop).
  - name: "1.16.2"
    guid: "{CC687628-58A8-46ce-B794-9FEE37864735}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall be able to transmit data
      correctly without a re-transmission (i.e. use error correcting codes).
  - name: "1.16.3"
    guid: "{998A8294-200C-492b-B74E-FA2E26BF4393}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall manage the communications
      in a manner which ensures that the communications infrastructure is not overwhelmed by
      too many messages.
  - name: "1.16.4"
    guid: "{7F301F22-5DEE-4ac6-A0B5-55D96B4F69B8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to communicate with
      each vehicle individually, or by class (location, type, speed, lane, area, approaching or
      leaving a junction).
  - name: "1.2.1"
    guid: "{3BE4883D-2EAA-4c56-8B8B-F0D16DB45716}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide a high level description of the message sets
      and data communication protocols to be used in data transfers.
  - name: "1.2.2"
    guid: "{7BBAB162-D78B-4f20-A713-25AFEF6DFFF6}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide a high level description of data stores and data
      flows, and shall have a single data dictionary.
  - name: "1.2.3"
    guid: "{C483024B-5C1D-41e0-B18C-D4C00CB5E294}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall exchange information in a
      manner that permits a given geographic location to be understood by all parties.
  - name: "1.2.5"
    guid: "{EC1004E6-3C68-4133-9CF3-49C2B0DCD403}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide a high level description of the message sets
      used to exchange data with external interfaces.
  - name: "1.2.6"
    guid: "{613C506D-C786-478f-B604-B1C33A111796}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall support the use of seamless communications. This
      shall mean that the use of different communication networks is transparent i.e. switches
      are made without the intervention of the final user.
  - name: "1.2.7"
    guid: "{E72BAABD-15CB-41ac-918B-F6A16A5ACC0D}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall classify incidents, their severity
      and reference their locations in a standard way.
  - name: "1.2.8"
    guid: "{D6DAC6C6-A51D-4bc6-A717-8BF320FF8273}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall provide coherent and
      consistent advice to all drivers affected by an incident or congestion.
  - name: "1.3.1"
    guid: "{9E4D6D75-7BF5-45f1-BEDB-BF7D4256355C}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall be able to provide facilities that
      accommodate the needs of disabled and elderly persons, when relevant.
  - name: "1.3.2"
    guid: "{6AB1B738-F97E-4a9c-825F-AF85D00401C9}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems that conform to the Framework Architecture shall be able to provide facilities to
      enable data about the travel network to be entered and updated.
  - name: "1.3.3"
    guid: "{745E967D-2C24-42ed-A292-25DC76AFAFC7}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall not constrain its functionality to be implemented in a
      single topographical domain, be it urban, inter-urban or rural.
  - name: "1.3.4"
    guid: "{4D425160-0F09-43d0-A8F1-DB53744308FE}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall not constrain its functionality to be implemented by
      specific local organisations.
  - name: "1.3.5"
    guid: "{7D17CB5B-4591-4764-B2C6-C15483DCA6F5}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall not constrain user interfaces to be of a particular type,
      or from a particular manufacturer.
  - name: "1.3.6"
    guid: "{9C302A4F-C1BC-4431-8C62-44C10668C6A1}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall not require that each of its user interfaces must
      operate on a specific item of equipment, unless it is for safety reasons.
  - name: "1.3.7"
    guid: "{85A48985-B899-4f90-894E-EFD3AF66FE57}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems developed from the Framework Architecture shall be able to use a digital map
      which contains the necessary additional data, e.g. speed limits, curvature of corners,
      (bus) lanes, traffic signals.
  - name: "1.4.1"
    guid: "{C56AE177-3CF0-464d-B9C4-2C2B7615C362}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to comply with
      current European and National laws concerning data security, user anonymity and the
      protection of individual privacy.
  - name: "1.4.2"
    guid: "{669A978D-A7AC-4070-902F-D126F8CFEF4D}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to comply with
      the traffic laws and regulations that apply in Europe.
  - name: "1.4.3"
    guid: "{3EAAE1C7-E99F-4180-98FE-5E69CCE42529}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall conform to relevant MoU, European directives and
      guidelines, and European (de facto-) standards.
  - name: "1.5.1"
    guid: "{96728549-7D24-43db-B061-A85B92CBBD7D}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide functionality such that the quality of information
      content is continuous and consistent, both in time and space (i.e. as the traveller moves).
  - name: "1.5.2"
    guid: "{BED9A04D-238F-4733-82D0-C741E0D766EE}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide functionality that can accommodate
      environmental stress and infrastructure failures.
  - name: "1.6.1"
    guid: "{E7C5D1FE-57BA-44db-94F4-8972A60956A8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Whenever possible and practical, the Framework Architecture shall use the same data as
      input to several parts of its functionality.
  - name: "1.6.2"
    guid: "{BE67F5A7-F0F4-488b-A77E-A0B3B038B785}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall avoid the need for unnecessary multiple data sources
      or redundant data management.
  - name: "1.6.3"
    guid: "{0681BFF5-CA48-4ce4-ADAE-14FD0ADB16EB}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to be able to use
      the most cost-effective means of communication available.
  - name: "1.6.4"
    guid: "{84DDBE4C-6474-4c03-9F1B-5F2B7E08495B}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to enable
      operating costs to be reduced whenever possible, when compared with the systems that
      they replace.
  - name: "1.6.5"
    guid: "{D1BDB9A8-FE55-4a91-A32E-1D503FD873B1}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it that require
      payment from a user to be able to manage fees/fares.
  - name: "1.6.6"
    guid: "{9DCBDB5B-3C6A-46fe-B66D-2BC9EA38D690}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it that require
      payment from a user to be able to receive fees/fares.
  - name: "1.6.7"
    guid: "{FCF5CC91-12A7-42d4-B0F6-3287FD6B13DD}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Systems upgraded to conform to the Framework Architecture, and providing the same
      services, shall produce financial benefit to their owners.
  - name: "1.7.1"
    guid: "{C6DBD8BF-F826-4fd2-8834-61A5450F2CD8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall allow systems developed from it to have an
      evolutionary development strategy that enables their continuous upgrading.
  - name: "1.7.2"
    guid: "{779B0D2A-1FAD-4032-942B-0AD78598C771}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall provide services that are not constrained to operate in
      a particular geographic region.
  - name: "1.8.1"
    guid: "{53EDBD3F-2812-4904-84BB-DBBC1AD91135}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to be capable of
      being repaired.
  - name: "1.8.2"
    guid: "{F0912460-1232-4fbc-BCB1-BD8CE95A2E69}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to be easily
      maintainable with minimum disturbance.
  - name: "1.9.1"
    guid: "{A5DEECD2-76F1-4fca-9580-FAA2401C61F1}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall enable all information systems developed from it to
      provide data with a stated accuracy, either as additional information or as part of the
      documentation, at all times.
  - name: "1.9.2"
    guid: "{7BF54778-187B-4f9d-A777-AC6E33B6D379}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to check all input
      data for validity, whenever possible, and to report failures.
  - name: "1.9.3"
    guid: "{5CB5C258-543A-4019-980B-DAAAB0CD9F45}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall enable all systems developed from it to check data
      values by comparing different sources, when available, so as to ensure high-accuracy
      and completeness.
  - name: "1.9.4"
    guid: "{3384C869-3320-4a67-8698-D67FD1A82AB6}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The Framework Architecture shall require all systems developed from it to manage
      local/regional/national databases in a consistent way.
