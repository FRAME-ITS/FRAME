    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to the route taken by the Freight Vehicle as it travels on the road network, and to send this information to the Freight Transport Operations Manager at regular intervals.
