    note: |
      The system shall be able to collect data about each Freight Transport Operation to enable the performance of the Freight Transport Service to be evaluated.
  - name: "9.11.1.12"
    guid: "{A0516400-8819-48af-9928-2D1084DAE55E}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be provided with both current (dynamic) and historical data about traffic conditions in the road network, and the availability of services from other non-road based modes of transport.
  - name: "9.11.1.13"
    guid: "{F631EED4-C8B7-4f3c-90E2-E1E78866FACE}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to deduce information about the transport network from previous operations.
  - name: "9.11.1.14"
    guid: "{5C94C15D-4447-4381-ADDF-F2D90A1EBFA3}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall maintain a list of standard procedures, set by the Freight Transport Operations Manager, to be adopted/enacted in the case of specific incidents.
    links:
      - "Association «belongsto» → F8.6.6 Manage Incident Response Data Store"  # {E7E67DE1-2135-425b-817F-8B68F533A8BE} → {CC117A33-746F-435a-99FD-47AE519B1C96}
  - name: "9.11.1.15"
    guid: "{BADBBCD7-3BEF-4cc4-AC2A-3DE18E02A82C}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to support the Freight Transport Operations Manager to negotiate the availability of third party services and/or resources, including other modes, during the transportation of Freight Transport Load Item(s) through the implementation of a Freight Transport Execution Pan.
    links:
      - "Association «belongsto» → F8.6.5 Provide FTOM Interface for FTEP Monitoring"  # {134FD656-0B90-484e-BAA1-CC0EC2FD77FD} → {8AD8B9D5-30E2-40a0-BF8A-30F3F57ECDF6}
  - name: "9.11.1.2"
    guid: "{50CEA6A4-DA8F-4c44-9025-0E489BDDC247}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to support the Freight Transport Operations Manager to establish an itinerary of one, or more, journey segments for different sets of Freight Transport Load Items.
  - name: "9.11.1.3"
    guid: "{41CA4238-0A3A-4d25-925B-4030F0B608EC}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to support the Freight Transport Operations Manager to produce Freight Transport Execution Plans that conform to the relevant road network management policies.
  - name: "9.11.1.4"
    guid: "{B079E354-B8F2-4b98-B097-A049412E8F2B}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall enable the Freight Transport Operations Manager to access to the facilities that manage the use of Freight Terminal Areas, and for their use to be specified in a Freight Transport Execution Plan.
  - name: "9.11.1.5"
    guid: "{9CC2B628-F45B-4507-BC20-69B2E069C35A}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall enable the Freight Terminal Area(s) identified in a Freight Transport Execution Plan to be booked once the implementation of the Plan commences, and for the expected times of arrival and/or departure to be amended.
  - name: "9.11.1.6"
    guid: "{7CEBA355-23A2-4178-BC45-ACE85F9644B0}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to obtain current and predicted road network and traffic status information to support the planning of a Freight Transport Execution Plan.
  - name: "9.11.1.7"
    guid: "{E0D33EBD-6329-475c-8176-8C4F8A329BD8}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to provide geographic information specifically relevant to freight transport execution measures (e.g. to avoid unsuitable roads, where possible).
  - name: "9.11.1.8"
    guid: "{1AC3E21C-4311-4d0d-A127-F53D7F63F3E4}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to provide information to support the planning of a Freight Transport Execution Plan for non-standard, e.g. dangerous or overweight, cargo.
  - name: "9.11.1.9"
    guid: "{535F2E8E-F903-4222-B4C1-AFC2262E90F7}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to request specific traffic management measures from the traffic management system for the passage of abnormal (e.g. overweight, over-sized) Freight Vehicles that result from abnormal Freight Transport Load Items.
    links:
      - "Association «belongsto» → F8.6.1 Implement FTEP"  # {997AA87D-87B4-4de5-ADBC-359F65CBE771} → {510B21B5-5C4B-43ec-A42D-BAF28FD4E528}
  - name: "9.11.2.1"
    guid: "{03442F02-E9E1-46bf-AAA7-936B31C1E439}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The system shall be able to support the Freight Vehicle Driver with suitable navigation information about the route(s) to be followed for the road-based part(s) of the Freight Transport Execution Plan.
  - name: "9.11.2.2"
    guid: "{EFA8A173-3EF9-444c-882F-DDE1532EF800}"
    type: "Requirement"
    stereotype: "FRAME_User_Need"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
