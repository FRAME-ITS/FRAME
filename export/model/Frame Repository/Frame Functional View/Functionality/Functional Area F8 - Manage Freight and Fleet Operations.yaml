  - name: "F8.6.3 Provide Freight Vehicle Driver Interface"
    guid: "{65F5CC11-C577-45fc-BC18-4DB4BCA41E0A}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide an audio and/or visual interface through which the Freight Vehicle Driver can be provided with outputs that give route guidance and other information, plus enable the exchange of messages
      (2) The ability to deliver outputs to the Driver and receive inputs from the Driver in such a way that the outputs are easily understood and the inputs can be achieved by the Driver without impeding the driving of the Freight Vehicle.
      (3) The ability to receive instructions for the Freight Vehicle Driver from other functionality and generate appropriate audio and/or visual outputs so that the Freight Vehicle can be driven to follow the routes to the locations required by the Freight Transport Execution Plan.
      (4) The ability to enable the Freight Transport Operations Manager and the Freight Vehicle Driver to exchange audio and/or visual messages either about the active Freight Transport Execution Plan or about other unrelated topics.
      (5) The ability to enable the Freight Vehicle Driver to provide audio and/or visual inputs that are comments on how a Freight Transport Execution Plan is being or has been implemented so that they can be sent to other functionality for storage and analysis.
      (6) The ability to record the actions of the Freight Vehicle Driver, including the messages exchanged with the Freight Transport Operations Manager plus other inputs and send them to other functionality for storage and analysis.
    links:
      - "Aggregation «component of» → F8.6 Provide Freight Transport Service"  # {9B7CB52B-E285-474b-9541-ECF10B3D5CCF} → {4B60AD8D-35C5-4df5-A17B-3DD9C9952F2A}
