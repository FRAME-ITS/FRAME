  - name: "F8.4.4 Prepare Freight Transport Execution Plan for Implementation"
    guid: "{0E77F27F-D215-45d0-B051-5C6E61E59127}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Enable the initiation of the preparation of a new Freight Transport Execution Plan following a request received through other functionality in the Manage Freight and Fleet Operations Functional Area and using data objects provided by that functionality.
      (2) If required retrieve data objects containing an existing Freight Transport Execution Plan from the functionality that manages its storage.
      (3) Send new Freight Transport Execution Plans that have just been prepared to other functionality in the Manage Freight and Fleet Operations Functional Area for approval by the Freight Transport Operations Manager and Freight Transport User.
      (4) When a new Freight Transport Execution Plan is approved in (3) above send it to the functionality that manages its storage.
      (5) Upon request from the Freight Transport Operations Manager revise a Freight Transport Plan that is currently being implemented from the point in the Plan that has been reached.
      (6) Upon request from other functionality in the Manage Freight and Fleet Operations Functional Area revise a Freight Transport Plan that is currently being implemented from the point in the Plan that has been reached.
