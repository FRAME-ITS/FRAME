    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Manage the store of previously prepared Freight Transport Execution Plans.
      (2) Update the store in (1) as and when new Plans are created and approved by other functionality in the Manage Freight and Fleet Operations Functional Area.
      (3) Provide approved Plans for implementation by other functionality in the Manage Freight and Fleet Operations Functional Area.
      (4) Respond to requests by providing details of previously prepared Freight Transport Execution Plans.
