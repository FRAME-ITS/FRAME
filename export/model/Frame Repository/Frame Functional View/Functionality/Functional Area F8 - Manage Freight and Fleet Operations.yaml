  - name: "F8.6.1 Implement FTEP"
    guid: "{510B21B5-5C4B-43ec-A42D-BAF28FD4E528}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to respond to the receipt of data objects containing a comment to implement a particular Freight Transport Execution Plan by requesting the content of the Plan from other functionality and proceeding to implement the Plan.
      (2) The ability to send instructions to functionality that provides an interface for the Freight Vehicle Driver(s) that will enable them to follow the road-based part(s) of the itinerary included in the Freight Transport Execution Plan.
      (3) If the Plan shows that the Freight Transport Load Item(s) constitute an abnormal load, the ability to declare this as an incident to the Manage Traffic functionality in the system so that the appropriate mitigation action can be taken.
      (4) If the Plan includes the use of other modes of transport, the ability to inform systems for the specified mode(s) of the expected time of arrival (eta) of the Freight Vehicle(s) carrying the Freight Transport Load Item(s).
      (5) If the other mode of transport in (4) above is unable to accommodate the Freight Transport Load Item(s) the ability to direct the Freight Vehicle Driver(s) to park up somewhere until the other mode becomes available.
      (6) Where (5) above applies the ability to report the status of the other mode of transport to the functionality that provides an interface for the Freight Transport Operations Manager.
      (7) The ability to recognise that an incident has occurred with the implementation of the Freight Transport Execution Plan through data objects received from other functionality and to (a) request an incident response from other functionality, and (b) to declare an incident to the Manage Traffic functionality in the system.
      (8) For (7)(a) the ability to implement the incident response if one is provided.
      (9) The ability to provide the expected location of the Freight Transport Load Item(s) to other functionality that will monitor the progress of the implementation of the Freight Transport Execution Plan.
      (10) The ability to send records of the Freight Transport Plan implementation status to other functionality that will compare it with the actual status for reporting to the Freight Transport Operations Manager.
      (11) The ability to send records of progress with the implementation of the Freight Transport Execution Plan to other functionality that will use it to analyse the way the Plan has been implemented.
    links:
      - "Aggregation «component of» → F8.6 Provide Freight Transport Service"  # {09A3F4CD-D5E2-4039-9AC1-B0AC73DC22F6} → {4B60AD8D-35C5-4df5-A17B-3DD9C9952F2A}
