  - name: "F8.4.3 Provide Freight Transport Operations Manager Interface"
    guid: "{8FBDF54B-6B59-4624-BAA2-0843DE946DB2}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Provide an interface through which the Freight Transport Operations Manager shall be able to perform the following activities:
            (a) Manage the creation of new Freight Transport Execution Plans at the request of the Freight Transport User using data objects provide by the User, plus other data objects about relevant statutory regulations and the capabilities of available Freight Vehicles;
            (b) Initiate the implementation of a previously created Freight Transport Execution Plan when requested by the Freight Transport User;
            (c) Check the content of a prepared Freight Transport Execution Plan;
            (d) Review the facilities available at Freight Terminal Areas and include any that are relevant with the data objects that are to be used to prepare a Freight Transport Execution Plan;
            (e) Provide and review information about the capabilities of available Freight Transport Vehicles and include any that are relevant with the data objects that are to be used to prepare a Freight Transport Execution Plan.
      (2) Manage the store of Freight Transport Execution Plan details provided by the Freight Transport User to prevent the un-necessary repeat input of common data, e.g. the location from which the Freight Transport User regularly moves Freight Transport Load Items.
      (3) Manage the store of the capabilities of available Freight Transport Vehicles updating the content as Vehicles are required for use in the requested implementation of Freight Transport Execution Plans.
