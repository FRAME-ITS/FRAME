  - name: "F8.5.1 Collect Road Network Data"
    guid: "{3BCBC290-332B-4aa6-A554-FB6C4DFAE8BD}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive data objects about the road network covering both static data (e.g. road layout and geometry) and dynamic data (e.g. historic, current and predicted traffic flows) from functionality in other parts of the system.
      (2) The ability to receive data objects containing weather related information for the geographic area covered by the road network.
      (3) The ability to receive data objects containing the previous performance of the implementation of Freight Transport Execution Plans.
      (4)The ability to manage the store of Road Network Data, including the integration of the data objects received in (1), (2) and (3) above.
      (5) The ability to respond to requests from other functionality in the system for some or all of the content of the store of Road Network Data.
