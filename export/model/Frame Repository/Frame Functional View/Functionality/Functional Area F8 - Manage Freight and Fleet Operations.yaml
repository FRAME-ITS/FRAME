  - name: "F8.4.1 Provide Freight Transport User Interface"
    guid: "{6983F8F3-33BD-4e31-A9FB-DB14981B86DB}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) An interface through which the Freight Transport User shall be able to do the following activities:
            (a) Provide data objects for use in the preparation of a Freight Transport Execution Plan that will enable the Freight Transport User to have specified Freight Transport Load Items moved from one location to another;
            (b) Approve the content of a prepared Freight Transport Execution Plan, or request changes using new data objects;
            (c) Request the implementation of a previously prepared Freight Transport Execution Plan;
            (d) Request the status of Freight Transport Load Items being moved by active Freight Transport Execution Plans.
      (2) Interface with other functionality in the Manage Freight and Fleet Operations Functional Area to:
            (a) Provide the data objects created from the inputs specified in (1) above;
            (b) Collect data objects needed for the outputs specified in (1) above.
