  - name: "F8.6 Provide Freight Transport Service"
    guid: "{4B60AD8D-35C5-4df5-A17B-3DD9C9952F2A}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This High-level Function shall be responsible for the implementation and monitoring of Freight Transport Execution Plans.  A Plan shall only implemented at the request of the Freight Transport User, who shall be able to monitor the progress of the implementation.  It shall be possible for the functionality to implemented two or more Freight Transport Execution Plans at the same time without any interference between them.  Instructions shall be provided to the Freight Vehicle Driver about collecting the Freight Transport Load Items specified in the Plan and delivering them to a Freight Terminal Area, another mode of transport or the final destination, or any combination of these.  If a fault is detected with the Freight Vehicle involved in the implementation of the Plan, the appropriate response shall be implemented or in the absence of a pre-defined response, it shall be requested from the Freight Transport Operations Manager.  If necessary and incident shall be declared to the appropriate functionality in the Manage Traffic Functional Area.
