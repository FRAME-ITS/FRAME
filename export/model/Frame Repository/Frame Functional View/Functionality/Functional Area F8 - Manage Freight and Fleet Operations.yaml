  - name: "F8.7.2 Calculate FTEP Implementation Status"
    guid: "{351B4E2D-FC21-4b86-B2C7-FD2524C0030A}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive from other functionality data objects that show the current status of the Freight Vehicle and equipment on-board that is used to carry and/or load/unload Freight Transport Load Items onto/off the Vehicle.
      (2) The ability to process the data objects received in (1) above to create data objects that show the status of the Freight Vehicle and its location, and to send these data objects to other functionality for output to the Freight Transport User and/or Freight Transport Operations Manager, or for, storage and/or analysis.
      (3) As part of (2), if the data objects that have been received indicate that an incident has occurred that involved the Freight Vehicle and/or the Freight Transport Load Item(s) it is carrying, create data objects to show this and send them to the appropriate functionality.
      (4) As a result of the data objects received in (1) above calculate the expected arrival time (eta) at the next Freight Terminal Area identified in the Freight Transport Execution Plan and if not the same as in the Plan send data objects containing the amended eta to the Freight Terminal Area Facilities Terminator.
      (5) As a result of (4) receive data objects from the Freight Terminal Area Facilities Terminator containing its response and inform the appropriate functionality of the need to change the way that the Freight Transport Execution Plan is currently being implemented.
