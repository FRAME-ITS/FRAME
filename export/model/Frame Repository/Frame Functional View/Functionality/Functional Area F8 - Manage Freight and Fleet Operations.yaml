  - name: "F8.6.6 Manage Incident Response Data Store"
    guid: "{CC117A33-746F-435a-99FD-47AE519B1C96}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the store of Incident Response Data so that its content is stored and accessed in an efficient and timely manner.
      (2) The ability to receive from other functionality data objects containing the required response to particular identifiable types of incident and load them into the store of Incident Response Data.
      (3) The ability to respond to data objects containing requests for the response to one or more particular types of incident to be retrieved from the store of Incident Response Data and sent to the functionality that made the request.
      (4) If no pre-defined response is found for the requested type of incident the ability to send data objects indicating this to the functionality that provides the interface for the Freight Transport Operations Manager.
