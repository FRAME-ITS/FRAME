  - name: "F8.6.2 Monitor FTEP Implementation"
    guid: "{D320C8CB-7271-40f3-9C39-963E76B15D5B}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect data objects containing details of the road network, such as geometry and location of road segments, junctions, etc.
      (2) The ability to receive from other functionality data objects that provide the current location of the Freight Vehicle as given by sensors on the Vehicle.
      (3) The ability to receive from other functionality data objects that provide the expected location of the Freight Vehicle according to the Freight Transport Execution Plan.
      (4) The ability to compare the locations provided by (2) and (3) above and from this generate a status update, e.g. the Freight Vehicle is/is not where it is expected to be according to the Freight Transport Execution Plan.
      (5) The ability to provide other functionality with the location of the Freight Vehicle for output to the Freight Transport Operations Manager and for use in reporting its status.
      (6) The ability to predict the time of arrival (PTA) of the Freight Vehicle at multi-modal interchange points and to send data objects containing these predictions to other functionality.
