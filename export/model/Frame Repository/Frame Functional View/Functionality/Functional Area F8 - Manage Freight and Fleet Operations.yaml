  - name: "F8.6.4 Provide Interface to Other Transport Modes"
    guid: "{16E599A1-12F3-4e20-80D6-9447C898EB54}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to communicate and exchange data objects with one or more Multi-Modal Systems that manage the operation of other modes of transport, e.g. railways, ferries and air freight.
      (2) The ability to send data objects provided by other functionality and containing the expected time of arrival (ETA) of the Freight Vehicle that is carrying the Freight Transport Load Item(s) to the system managing the appropriate other mode of transport.
      (3) The ability to update the data objects sent in (2) above using data objects provided to it by the Freight Vehicle position monitoring functionality.
      (4) The ability to send data objects to the appropriate Multi-Modal System to indicate that the Freight Vehicle is ready for the Freight Transport Load Item(s) it is carrying to be moved by the other mode of transport.
      (5) The ability to provide the current status of all other modes of transport with which the system has connections for use by other functionality even if they are not involved in the implementation of any active Freight Transport Execution Plans.
      (6) The ability to respond to requests for the provision of alternative services from other modes of transport, which may not be the same modes as those specified in the Freight Transport Execution Plan that is being implemented by sending requests to the appropriate Multi-Modal System(s) and forwarding the response(s).
      (7) The ability to generate data objects containing instructions about where to pick up Freight Transport Load Items that have been delivered by other modes of transport and send them to the functionality that provides the interface with the Freight Vehicle Driver.
      (8) The ability to provide to other functionality the current status of the movement of Freight Transport Load Items by other modes of transport when provided by the multi-modal systems.
    links:
      - "Aggregation «component of» → F8.6 Provide Freight Transport Service"  # {E9B16546-E070-4d47-B7BD-3A0D20D2F39D} → {4B60AD8D-35C5-4df5-A17B-3DD9C9952F2A}
