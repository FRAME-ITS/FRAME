  - name: "F8.7.1 Collect Data from Freight Vehicle"
    guid: "{6BE61F07-B5AB-40d5-8408-51434FE8E9D0}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive inputs generated by equipment and/or sensors on-board a Freight Vehicle that will enable the following to be determined:
      - the status of equipment used to carry and/or load/unload Freight Transport Load Items onto/off the Freight Vehicle,
      - the current speed of the Freight Vehicle,
      - the current location of the Freight Vehicle,
      - the current status of the Freight Vehicle.
      (2) The ability to convert the inputs received in (1) into data objects that show the parameters identified in it and to add to each of those parameters, as a minimum, the following data objects:
      - date,
      - time,
      - Freight Vehicle identity, e.g. VIN.
      (3) The ability to send the data objects created in (1) and (2) above to other functionality for storage and analysis.
