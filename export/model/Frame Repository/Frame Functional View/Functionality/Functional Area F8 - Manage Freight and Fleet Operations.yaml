    guid: "{3A01549B-EA04-4e49-B86F-C136E05EA085}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive the basic data from which a new Freight Transport Plan is to be produced, e.g. number of Freight Transport Load Items, their origin(s) and destination(s) and their expected departure/arrival times, plus the type of Freight Vehicle needed and any route constraints.
      (2) Based on the content of the data objects in (1) above, the ability to request other functionality to provide data objects containing details of the road network, plus historic, current and predicted traffic data, weather data and any relevant previous Freight Transport Execution Plan data.
      (3) If required by the data objects received in (1), request data objects containing details of services to be provided by other modes of transport and third party service providers.
      (4) The ability to combine all the data objects collected in (1), (2) and (3) above, together with data objects showing the previous performance of other modes of transport and third party service providers to create a comprehensive set of data objects from which a Freight Transport Execution Plan can be prepared by other functionality.
