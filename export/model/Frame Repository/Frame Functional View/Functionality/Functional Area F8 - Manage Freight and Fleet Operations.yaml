  - name: "F8.7.3 Evaluate FTEP Implementation"
    guid: "{F0EF1DD1-012D-4a7d-BF47-C8E4608ECCFB}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the store of Freight Transport Execution Plan Implementation Records so that its content is stored and accessed in an efficient and timely manner, with the records for each Freight Transport Execution Plan being kept separately.
      (2) The ability to receive data objects from other functionality containing details of how the implementation of a Freight Transport Execution Plan is progressing and to load these data objects into the store of Freight Transport Execution Plan Implementation Records.
      (3) The ability to respond to data objects sent from other functionality that request the records which were created as a result of the implementation of particular Freight Transport Execution Plans.
      (4) The ability to deduce the road network performance from the records of the implementation of one or more Freight Transport Execution Plans and to send the results to other functionality.
      (5) The ability to deduce the performance of other modes of transport from the records of the implementation of one or more Freight Transport Execution Plans and to send the results to other functionality.
