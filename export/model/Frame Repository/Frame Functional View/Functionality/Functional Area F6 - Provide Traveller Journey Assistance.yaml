elements:
  - name: "F6. Provide Traveller Journey Assistance"
    guid: "{910E7108-BA0F-478e-BF7A-5197C2E6F477}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Functional Area shall provide functionality that enables the provision of information to all types of Travellers about traffic conditions and about other modes of transport.  The functionality shall also provide pre-trip journey planning, including special routes for Emergency Vehicles and Freight Vehicles.  On-trip route guidance shall also be provided, together with the ability to change a trip itinerary due to Traveller input, or the occurrence of events that affect the flow of Vehicles through the road network or other factors that will affect the successful implementation of the trip plan that the Traveller has prepared.  As part of the trip planning process, the functionality shall provide the Traveller with access to other services such as accommodation, the location of points of interest that may be relevant to the prepared route and enable the use of other non-road based modes of transport as part of the trip plan.
      
      Mnemonic: ptja
