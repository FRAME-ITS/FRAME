  - name: "F6.3 Support Trip"
    guid: "{5443746E-DAB0-49fb-9EB8-533BFD7558A7}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide support for the implementation of a trip plan by a Traveller.  This support shall include providing actual "guidance" to the Traveller about what to do, regardless of the transport being used.  Progress with the implementation shall be monitored and checked for compliance with the trip plan, e.g. will the Traveller arrive at the destination at the expected time.  If not it shall be possible for a revised trip plan to be created for immediate implementation if accepted by the Traveller.  During the implementation of the trip plan travel conditions may change that may influence the ability to complete the trip in the manner required by the Traveller when the trip was planned. Using the trip itinerary the consequences of these changes shall be evaluated and a revised trip plan suggested to the Traveller for immediate implementation once accepted.
