  - name: "F6.5.3.12 Provide Trip Planning Operator Interface"
    guid: "{8984B4EF-3E8D-4ee8-B776-C6DDF843AC80}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 7
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Travel Information Operator can set up, view and modify criteria used to prepare and/or modify trip plans requested by Travellers.
      (2) It shall be possible for these criteria to ensure that all trip plans conform to travel and traffic management policies (if any) for the road network and the appropriate use of the available transport modes.
      (3) The HMI shall not enable the Operator to have access to the personal data about Travellers or Freight Vehicle Drivers who either have made, or are in the process of creating trip plans, or to be able to identify which Travellers or Freight Vehicle Drivers are currently preparing particular trip plans.
    links:
      - "Aggregation «component of» → F6.5.3 Trip Planning"  # {BA64BFD2-BF3B-49db-ACCE-675AB1AA2394} → {6F340DB9-BA19-42ef-9A31-CB4E2C70AFAE}
