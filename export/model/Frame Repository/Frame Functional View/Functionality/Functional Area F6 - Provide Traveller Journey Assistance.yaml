  - name: "F6.5.3.11 Provide Green Wave Routes"
    guid: "{F3931589-B20B-46e1-811D-EE2F7FDD8E56}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to produce routes for Emergency Service and Other Vehicles as a result of specific requests.
      (2) For Emergency Vehicles, the ability to produce routes that enable them to reach the scene of an incident in the shortest possible time.
      (3) The purposes of the routes for Other Vehicles will be varied but must enable them to get from their current location to the specified destination in the shortest possible time.
      (4)  Routes for both types of Vehicles shall take account of the current and predicted traffic conditions and the times of the relevant green phases at all the signalised road junctions along the route.
      (5) Data about the routes shall include the identities of all the junctions and include the required average speed for each segment.
      (6) In some cases, the route may only contain one signalised road junction, in which case the objective of the route shall be achieved using local priority at the junction.
    links:
      - "Aggregation «component of» → F6.5.3 Trip Planning"  # {BC4320E3-CBC5-4679-8E57-1D49CEE1B663} → {6F340DB9-BA19-42ef-9A31-CB4E2C70AFAE}
