  - name: "F6.6.1 Provide Traveller Information Interface"
    guid: "{B75EAEB5-F795-4a15-967E-82ACB4FBE1D5}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Traveller may obtain information about travel conditions.
      (2) The ability to provide information for all current modes of travel in the geographic area relevant to the current location of the Traveller, including information about other modes of transport, e.g. heavy rail, air and maritime.
      (3) The HMI shall enable the Traveller to request output of information and if desired may select criteria for its output.
      (4) The HMI shall not enable information to be output without a request from the Traveller.
      (5) The ability to obtain the relevant information from the store of Travel Information Data through its management Function.
      (6) If the current location of the Traveller is known then the ability to filter the information from the store of Travel Information Data to that which is location specific before output, although the filtering criteria shall be configurable by the Traveller.
      (7) The HMI shall enable the Traveller to configure the output so that it can be provided against a map background, or in different languages.
      (8) The HMI shall generate the output in a form that is easy to understand and be suitable for those with disabilities.
    links:
      - "Aggregation «component of» → F6. Provide Traveller Journey Assistance"  # {6D45E4C1-C841-4b83-9964-957AB7E6A6BB} → {910E7108-BA0F-478e-BF7A-5197C2E6F477}
      - "Aggregation «component of» → F6.6 Provide Traveller Information"  # {E8327674-5B97-4924-A59A-C5EC750E0E14} → {DF3C13ED-BE7F-403d-B88A-1E0B0C89E01A}
      - "Association «IN» → ptja_request_travel_information"  # {6DD23D3E-095B-4269-B9EB-AF945E17E38A} → {555DDC3D-64F0-4a7d-8A7D-2B7481D858DA}
      - "Association «IN» → tt-requested_travel_information"  # {67E4C3C7-FE89-47f4-B21A-50C9E46DCF6A} → {6E2D7940-04B2-4990-8F8F-AB87A535F818}
  - name: "F6.6.2 Produce Travel Information"
    guid: "{F838CC43-0D6E-41b4-BBA4-609BDDD519A9}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to produce travel information using inputs it receives from other Functional Areas.
      (2) The ability to modify the inputs according to filters set by the Travel Information Operator to reflect policy and other factors, so that for example information about certain types of services, travel modes, Personal Services, or Points of Interest are not included in what is sent for output to the Traveller.
      (3)  When the information is ready, the ability to respond to the Function that manages the store of Travel Information Data for use by the Provide Traveller Information Interface Function when the Traveller requests travel information.
    links:
      - "Aggregation «component of» → F6. Provide Traveller Journey Assistance"  # {E6657741-C137-4af0-BAB2-267CBC2B84EE} → {910E7108-BA0F-478e-BF7A-5197C2E6F477}
