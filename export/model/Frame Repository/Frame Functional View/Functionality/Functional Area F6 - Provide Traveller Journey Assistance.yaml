  - name: "F6.5.3.9 Plan Trip Details"
    guid: "{2AB906E1-0864-4458-9917-F8388133E990}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the production of trip plans based on data provided by the Traveller through functionality in other parts of the system.
      (2) The ability to prepare trip plans for journeys that are either one way,  or for a return trip (including weeks/months ahead), and that take advantage of late opening hours, special facilities etc.
      (3) The ability to check the criteria provided by the Traveller and obtain information for the specified modes to be used in the requested trip, but taking account of the trip planning criteria that have been set up by the Travel Information Operator.
      (4) The ability to use data from the store of Road Trip Planning Data and/or the store of PT Trip Planning Data, plus also to collect information about Points of Interest (POI) and Personal Services (PS) from External Service Providers.
      (5) Where specified by the Traveller the ability to request information about the services provided by other transport modes, tolls plus other charges if they will need to be paid in order to complete the proposed trip, and to pass all of this information on to the Provide Traveller Information functionality.
      (6) The ability to create trip plans for cyclists and pedestrians using the road network data and related perturbations, but disregarding traffic incident information.
      (7) The ability to revise a part completed trip plan when a Traveller departs in any way from its contents, or travel conditions change, starting from the current Traveller location and mode of travel.
      (8) The ability to exchange journey time data for each segment of the road network with its implementation in other devices and to plan trips when the only traffic related data that is available this journey time data.
