  - name: "F6.5.8 Enable Final Approval of Trip Plan"
    guid: "{C9B427C7-4C4F-4385-A282-F2850E00E673}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 2
    note: |
      This Function shall capable of providing the following facilities:
      
      (1) The ability to enable the Pre-Trip Traveller to give final approval to the trip plan that has just been prepared.
      (2) The ability to provide the Pre-Trip Traveller with the trip itinerary encompassing travel modes, schedules, bookings, payments made and further information coming out of the Trip Planning functionality.
      (3) If so desired by the Pre-Trip Traveller, the ability to include any maps for road trips or route descriptions, as well as safety advice concerning all conditions that are likely to be encountered by following the route that have been produced as part of the trip planning process.
      (4) The ability for the Pre-Trip Traveller to give final approval to the trip plan after which it will be sent to the Manage Store of Trip Plan Data for implementation when so requested by the Pre-Trip Traveller.
      (5) The ability for the Pre-Trip Traveller to cancel the trip at this stage, in which case a "cancel bookings" command shall be sent to the Make Bookings and Payments for Trip Function and the trip planning process will be implemented again from the beginning.
  - name: "F6.5.9 Make Trip Bookings and Payments"
    guid: "{B6BC0B65-1756-480e-82A4-9208F43777FE}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 3
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to make any bookings for services that are needed as part of a trip, or to make payment for the use of the actual trip planning service itself.
      (2) For bookings of services that are needed as part of a trip, the ability to select the best choice of services to be booked based on what they provide and the price to be paid, i.e. obtain the best value for money.
      (3) If the best choice cannot be used, the ability to suggest possible alternatives to the Traveller by sending their details to the Provide Traveller Trip Planning interface.
      (4) The ability to initiate any necessary payment action by sending the details to the Financial Clearinghouse for processing and waiting for receipt of confirmation that payment has successfully been made.
      (5) The ability to cancel all of the bookings made for a previous trip and send a confirmation message to the Provide Traveller Trip Planning interface when a "cancel bookings" request is received.
