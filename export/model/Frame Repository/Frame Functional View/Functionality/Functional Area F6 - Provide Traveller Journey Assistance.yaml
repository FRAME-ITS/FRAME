  - name: "F6.7.2 Evaluate Trip After Completion"
    guid: "{160BF34B-D137-4f2e-B422-009D9FF501A7}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to evaluate the success of the trip plan implementation.
      (2) The evaluation shall be based on data provided by the Support Trip functionality and optional input from the Traveller collected after the trip has been completed.
      (3) The ability to collect any required input as comments on the trip and on the support given using the Define Traveller's General Trip Preferences functionality.
      (4) The ability to send the results of the analysis of the trip performance for output to the Travel Information Operator through the Enable Operator Access to General Trip Preferences functionality.
