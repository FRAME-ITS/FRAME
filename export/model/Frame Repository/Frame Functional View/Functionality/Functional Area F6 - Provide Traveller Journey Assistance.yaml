    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to obtain data for use in the provision of information to Travellers that will be provided by the Traveller Information functionality.
      (2) The ability to periodically pass to Traveller Information functionality the data that it has obtained from the store of Road Trip Planning Data and the store of PT Trip Planning Data, plus data about Points of Interest (POI) and Personal Services (PS) that it has been provided to it by the Plan Traveller Trip Function.
