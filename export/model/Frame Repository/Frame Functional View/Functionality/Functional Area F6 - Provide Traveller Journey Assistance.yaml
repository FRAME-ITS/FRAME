    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI that enables the Travel Information Operator to have access to the contents of the General Trip Preferences (GTP) Data Store.
      (2) The HMI shall enable the Travel Information Operator to output reports on the performance of planned trips.
      (3) The reports shall be produced so that the GTP data that contain will be anonymized in accordance with any data protection laws operating in the area where this functionality is implemented, e.g. the European GDPR regulations.
