  - name: "F6.5 Prepare Trip Plan"
    guid: "{AA1602B6-7456-4fd1-98CC-6CA7DD14285B}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall include facilities to enable the preparation of trip plans by the Traveller, and for other functionality, e.g. the Emergency Services and Freight Operations.  The preparation of trip plans shall take into account all kinds of factors such as when the Traveller wants to travel, the transport modes the Traveller is able to use and the duration of the trip.  The functionality shall be provided with up to date information about transport conditions, including PT Services, and shall be able to obtain details of the services provided by other transport modes.  This information shall be stored for use until it is updated again following changes detected by functionality in other Functional Areas.  In any trip plans created by the Traveller the functionality shall also be able to include such items as personal services (e.g. hotels and restaurants) and points of interest (e.g. tourist sites) and enable any required bookings to be made.  These shall not be included in trip plans for the Emergency Services and Freight Operations.  The functionality shall also provide the option for a charge to be made for creating trip plans.
