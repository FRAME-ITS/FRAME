  - name: "F6.5.3 Trip Planning"
    guid: "{6F340DB9-BA19-42ef-9A31-CB4E2C70AFAE}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This High-level Function shall plan the road based portions of trips.  It shall use up to date information about road network and PT Services, plus changes to weather and traffic conditions. These shall be stored and continue to be used until updated.  If the trip plan is for a Vehicle carrying freight the functionality shall take into account route restrictions due to the size and type freight, e.g. some types of freight cannot use tunnels or pass through residential areas and the need to driver rest stops.  Trip plans for use by the Emergency Services shall be created with a detailed route through the road network with point to point timings in the form of a 'green wave'.  The creation of trip plans for Travellers that only specify cycling and/or walking as permitted transport modes shall use the road network data but can ignore some road traffic incidents because the Travellers will be able to use routes that are not available to road Vehicles such as cars and vans.  Trip plans for Travellers can also include information about personal services (e.g. hotels and restaurants) and points-of-interest (e.g. tourist sites) and can take account of the forecast availability of parking spaces both at the destination and at way points along the route.  The information used to create trip plans will also be provided to High-level Function F6.6 for use in creating travel information that can be accessed by and displayed to Travellers.
    links:
