  - name: "F6.3.13 Provide Traveller Trip Interface"
    guid: "{43F1DFB0-6524-4e76-819F-84B874AF51C2}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Traveller can request the implementation of a trip plan, be given trip navigation instructions or manage changes to the trip plan that is currently being implemented.
      (2) The ability for the HMI to output in whatever form best suits the Traveller the instructions for implementing the trip plan that are provided by the Implement Trip Plan and Track Traveller function.
      (3) If a proposal is received for revising the trip plan that is being implemented, the ability of the HMI to display details of the proposed changes to the Traveller and send back the response that is received to the Manage Revised Trip Plan Creation for Traveller function.
      (4) The ability for the HMI to receive requests for changes to the trip plan from the Traveller and also send them to the Manage Revised Trip Plan Creation for Traveller function.
