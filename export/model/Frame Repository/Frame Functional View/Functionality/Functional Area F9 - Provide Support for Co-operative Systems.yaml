  - name: "F9.2 Provide Access to Bus Lanes"
    guid: "{49FB5289-B936-4c75-A900-FDD675FDF34A}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide functionality that enables flexible lane allocation.  It is aimed principally at Bus Lanes and shall enable them to be used by Other Vehicles, when PT Vehicles are not using them.  Use of Bus Lanes by other Vehicles shall be granted through the allocation of a licence that applies to specific lanes and shall only be valid for a particular length of time.  It shall only be possible for a licence to be granted for Other Vehicles to use some of the Bus Lanes on their route to their destination.  The use of the Bus Lanes shall be monitored and if Other Vehicles are likely to impede the movement of PT Vehicles, they shall be requested to leave the Bus Lane at the end of the next section.  If Other Vehicles are found to be using a Bus Lane without a licence, their details shall be passed to Law Enforcement functionality for subsequent prosecution.
