elements:
  - name: "F9. Provide Support for Cooperative Systems"
    guid: "{F0D7E9A8-9F88-4e8f-AF0F-661C1990D546}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Functional Area shall provide the functionality that is needed to support the implementation of some Co-operative Systems (C-ITS) services that cannot be wholly assigned to parts of any other Functional Area.  The particular services that shall be supported by this Functional Area include the management of priority for Other Vehicles, the use by non-Public Transport Vehicles of any spare capacity in Bus Lanes, Vehicle access to sensitive geographic areas within the road network, special routes for Hazardous Goods Vehicles and Urban Un/loading Zones.
      
      Mnemonic: pscs
