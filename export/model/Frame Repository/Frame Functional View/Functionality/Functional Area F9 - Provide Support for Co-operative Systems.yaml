      This Function shall be capable of providing the following facilities:
      
      (1) The ability to monitor the Vehicles using Bus Lane and collect images and Vehicle data and compare the latter with a list of those non-PT Vehicles that have been granted licences.
      (2) Where a non-PT Vehicle is found not to have a valid licence, the ability to send a warning message to the Vehicle Management functionality.
      (3) If the Vehicle continues to use the Bus Lane without a licence, the ability to send details of the Vehicle and the Bus Lane it is incorrectly using to the Law Enforcement functionality.
      (4) The ability to send data showing that Vehicles were incorrectly using a Bus Lane to the Manage Bus Lane functionality for recording in the store of Bus Lane Data.
