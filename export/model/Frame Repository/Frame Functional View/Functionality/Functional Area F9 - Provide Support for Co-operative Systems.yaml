  - name: "F9.5 Manage Urban Un/Loading Zones"
    guid: "{73A6BD74-8CDC-47de-9E81-86066B69AD2F}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide functionality for the management of loading and unloading (unloading) zones for Freight Vehicles in the urban road network.  It shall enable Freight Vehicle Drivers and Freight Transport Operations Managers to book the time at which a Freight Vehicle will be in particular zones to load or unload freight.  The Drivers and Freight Transport Operations Managers shall also be able to update these booking if their expected time of arrival changes.  If a particular requested zone is not available for the Freight Vehicle that needs to use it, then the Driver shall be provided with instructions about the holding zone that is to be used as a place to park until the requested zone becomes available.  Facilities shall be provided to enable the Parking Operator to be responsible for the overall management of the zones.
