  - name: "F9.2.1 Provide Driver Interface for Bus Lanes"
    guid: "{59F5833C-D2BB-442b-ACB1-BD3861818AED}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Driver can request the use of Bus Lanes and be informed about the success of the request.
      (2) The HMI must require the Driver to provide the destination plus any "way points" for the route on which the use of Bus Lanes is being requested.
      (3) The HMI must also be able to inform the Driver of the need to leave the Bus Lane because a PT Vehicle is about to use it.
    links:
