  - name: "F9.3 Manage Vehicle Access to Sensitive Areas"
    guid: "{BECAF613-EAD1-4f7d-BBA6-63FBDADA831A}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide functionality that shall enable the management of the use of parts of the road network that are in close proximity to geographic areas that are designated as being "sensitive areas".  It shall be possible for Vehicles to be barred from access to any of these "sensitive areas" and for Vehicles approaching the entrance(s) and exit(s) to be monitored.  When Vehicles are granted access to these "sensitive areas", instructions shall be passed to Drivers about their use using functionality in the Provide Support for Host Vehicle Systems Functional Area.  If a Vehicle tries to enter a "sensitive area" without having been granted access the same mechanism shall be used to send a warming message to the Driver.  Details shall also be sent to the Provide Support for Law Enforcement Functional Area for processing into a prosecution.
