  - name: "F9.2.2 Manage Vehicles using Bus Lanes"
    guid: "{C4EAFE90-C758-40f3-8B2C-6058BB8C9437}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the non-PT Vehicles that wish to obtain licences to use Bus Lanes.
      (2) The ability to receive the request for using Bus Lanes from the Driver interface functionality and collect data about the Vehicle characteristics, such as its speed and current location, from its own interface and sensors.
      (3) When all the data has been accumulated, the ability to send the Bus Lane use request as a licence request to the functionality responsible for managing the use of Bus Lanes and to pass on the response to the Driver interface functionality.
      (4) If the response contains a licence, then the ability to monitor the location of the Vehicle as it moves through the road network and provide messages for output to the Driver through the Driver interface functionality when the Vehicle correctly using any Bus Lanes.
