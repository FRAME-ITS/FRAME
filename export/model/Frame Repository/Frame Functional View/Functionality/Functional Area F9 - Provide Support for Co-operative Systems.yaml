  - name: "F9.5.2 Provide Loading/Unloading Zone Operator Interface"
    guid: "{8FD6AAD1-5692-44fb-BA18-3DC91BDD5241}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Un/Loading Zone Operator can manage the use of parking places in loading or unloading zones and their associated holding zones.
      (2) The HMI shall enable the Un/Loading Zone Operator to approve booking requests, plus obtain and update data about the zones.
      (3) If an incorrect Freight Vehicle is found to be using a parking place, the ability for the HMI to output information about the Vehicle to the Un/Loading Zone Operator.
