  - name: "F9.1 Enable Other Vehicle Priority Selection"
    guid: "{3976CD5F-BB81-4c2d-9056-390F2CA60098}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide facilities that enable Other Vehicles to request "green waves" through signalised road junctions on the route to their destinations.  Once a "green wave" has been successfully requested, it will be implemented immediately through the Manage Traffic functionality.  If there is only one signalised junction on the route, then the "green wave" will be implemented through a request for local priority at that junction.  If priority conflicts arise at a junction, the functionality will give priority to Emergency Vehicles, then PT Vehicles and finally Other Vehicles.  Priority conflicts between Other Vehicles will be resolved in favour of the Vehicle that first requested priority.  Other Vehicles will be informed if their priority request has been successful or not, and if successful will be provided with speed advice to follow the "green wave".  All Vehicles approaching a signalised junction will be informed if priority has been granted to any Other Vehicles approaching it.
