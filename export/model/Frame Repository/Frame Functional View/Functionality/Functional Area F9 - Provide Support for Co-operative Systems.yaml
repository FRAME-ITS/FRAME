  - name: "F9.3.2 Manage Data about Vehicle use of Sensitive Areas"
    guid: "{2C6AAFEF-FD0A-4959-9171-9973E8050899}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for the management of the use of "sensitive areas".
      (2) The ability to receive requests from Host Vehicles to enter these "sensitive areas" and to grant access provided that certain criteria are fulfilled.
      (3) When access is granted, the ability to use the Host Vehicle location data that it receives to monitor the use the Host Vehicles are making of the "sensitive areas" and to send instructions for output to Drivers via other functionality if and when required.
      (4) The ability to store information about the Host Vehicles that use the "sensitive areas" and the criteria for their admission in the store of Sensitive Area Monitoring Data.
      (5) The ability for the Road Network Operator to provide updates to the admission criteria and to see the current criteria through the Provide Operator Interface for Sensitive Area use Function.
