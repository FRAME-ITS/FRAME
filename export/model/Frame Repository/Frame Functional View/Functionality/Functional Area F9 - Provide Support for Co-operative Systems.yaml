  - name: "F9.1.1 Provide Driver Interface for Vehicle Priority"
    guid: "{AF1096E2-EC99-4ffb-BE69-8EAF40ADEC6D}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Drivers can request priority for their Vehicle through the urban road network and receive the responses to these requests.
      (2) The HMI must require the Driver to indicate the destination and any constraints, e.g. mandatory "way points", so that a green wave route can be created.
      (3) The ability to send the data provided by the Driver through the HMI to the Priority Request functionality.
      (4) The HMI must output the data from the Priority Request functionality as soon as it is received, superseding for the duration of its relevance any other outputs that the Driver may be receiving from other functionality.
