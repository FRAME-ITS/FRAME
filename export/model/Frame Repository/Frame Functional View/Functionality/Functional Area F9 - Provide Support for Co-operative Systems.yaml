  - name: "F9.4.5 Manage Hazardous Goods Vehicle Route Creation"
    guid: "{47723257-C4DF-457d-8BBD-BC59233D37EB}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the creation of routes by Vehicles carrying Hazardous Goods.
      (2) The ability to get route for the Vehicle created by the Trip Planning functionality using criteria provided by the Road Network Operator together with data about the actual route provided by the Driver through the HMI on-board the Vehicle.
      (3) The ability to determine from the time the route will take to implement, the need for the Driver to take a rest break.  If this is needed then the Function must request a parking space from the Manage Traffic functionality.
      (4) The ability to respond to the Driver through the HMI on-board the Vehicle of the success or failure of the route creation process.
      (5) The ability to keep all routes that are created plus a unique identifier, the criteria used to do this, the Vehicle details, route origin and destination as a record of what was used and in case they may be useful in the future in the store of Hazardous Vehicle Routes Data.
      (6) When a route has been created and implementation is requested by the Driver through the HMI on-board the Vehicle, the ability to send it to other functionality for actual implementation.
      (7) The ability to send details of the route to another instance of itself and to receive details of routes from other instances of itself.
      (8) For routes received from other instances of itself, the ability to store it and when it required send it to other functionality for actual implementation.
    links:
      - "Aggregation «componentof» → F9. Provide Support for Cooperative Systems"  # {83C59747-228B-452a-88D6-6D3BC9275202} → {F0D7E9A8-9F88-4e8f-AF0F-661C1990D546}
