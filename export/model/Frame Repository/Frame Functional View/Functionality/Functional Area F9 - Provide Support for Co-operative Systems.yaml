  - name: "F9.4.6 Provide Interface for Hazardous Goods Vehicle Driver"
    guid: "{3ECE82EA-7550-46b0-9D04-152E6A4939BE}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Driver of a Hazardous Goods Vehicle can request a route to a specified destination and be given guidance for its implementation.
      (2) The ability to determine the current Vehicle location and details about the Vehicle from other inputs.
      (3) The ability to notify the Driver when a new route has been successfully created.
      (4) In response to an input from the Driver request that a previously created route is implemented.
      (5) The ability to display received route guidance instructions to the Driver.
      (6) When a route is being implemented, the ability to continuously provide the Vehicle location so that progress along the route can be monitored by other functionality.
      (7) If this other functionality sends a message that the Vehicle is departing from the determined route, the ability to immediately output a warning to the Driver, making sure that this output takes priority of all other non-emergency outputs.
    links:
