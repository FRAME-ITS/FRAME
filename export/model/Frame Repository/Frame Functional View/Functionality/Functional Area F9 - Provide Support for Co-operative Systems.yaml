  - name: "F9.4.7 Manage Hazardous Goods Vehicle Route Implementation"
    guid: "{0150B315-9BA0-4e79-93EC-DC17410CBA73}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to generate route guidance instructions for the implementation of a route that the Driver of a Hazardous Goods Vehicle has previously requested that can be sent to the Driver interface functionality.
      (2) The ability to receive updates of the Vehicle's location as it moves along the route.
      (3) The ability to use these updates to find the next appropriate set of instructions, which it will send to the Driver interface functionality.
      (4) The ability to manage the simultaneous use of route segments by Vehicles carrying different types of hazardous goods.
      (5) The ability to identify from the updates of the Vehicle's location that it has deviated from the route and send it to the Driver interface functionality.
      (6) The ability to identify from the updates of the Vehicle's location that it is going outside the geographic area managed by the system and send a route implementation request to another instance of the functionality in this High-level Function.
