  - name: "F9.5.3 Manage Store of Loading or Unloading Zone Use"
    guid: "{0427B4D8-1171-43b4-BAF2-5E05609B38BA}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the store of Loading or Unloading Zones Data, which contains data about Loading and Unloading zones plus their associated Holding Zones.
      (2) The ability to load into the store the data about each zone (e.g. location, number of places, use restrictions, use guidance) that is provided by the Loading/Unloading Zone Operator via the Provide Loading/Unloading Zone Operator Interface function.
      (3) The ability to update the store with information about bookings for parking places in the zones so that it has access to a coherent and up to date record of the historical, current and forecast use.
