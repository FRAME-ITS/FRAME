  - name: "F7.3.5 Sort Violation Notifications"
    guid: "{40851971-A935-4f69-B668-62412F36BC19}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to carry out the classification of the violation notifications received from the functionality in other Functional Areas or directly from the Detect Violation Function.
      (2) If the violator's identity is not included in the notification, the ability to send the data that is available to the Identify Violator Function for it to be retrieved.
      (3) The ability to carry out the classification according to different criteria: level of seriousness, field (road, financial, commercial) and repeat offence.
      (4) Once the classification has been completed, the ability to send it together with all the other information about the violation to the Create File for use in Prosecution Function.
    links:
