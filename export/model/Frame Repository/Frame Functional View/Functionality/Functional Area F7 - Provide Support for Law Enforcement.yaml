  - name: "F7.1 Detect Violation"
    guid: "{35333EE8-BA25-4119-8879-CDE727500979}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall perform the detection of specific types of violation not carried out by functionality in this and other Functional Areas, such as Weight In Motion (WIM).  It shall determine the nature of the violation, the data that shows the violation has occurred, e.g. the parameters that have been exceeded and the means of identification of the violator.  These data shall be combined into data objects that are sent for processing by another High-level Function in this Functional Area.
