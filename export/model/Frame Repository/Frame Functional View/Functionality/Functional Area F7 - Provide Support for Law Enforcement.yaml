  - name: "F7.3.3 Output Violator Identities to Urban Roads"
    guid: "{1FD8F86E-E8DB-4536-A1DD-D211066E1F16}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to output the identity of a Vehicle that has exceeded a speed limit, or not used the correct lane in the urban road network.
      (2) The ability to provide the output at the roadside at or near (down stream) the location of the violation, as in-vehicle outputs will be provided separately.
