  - name: "F7.1.3 Get Vehicle Information"
    guid: "{3981486A-8FFD-4886-BB07-705C0E602503}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect inputs from which data objects can be created to provide details about a Vehicle to check that it is complying with the rules enacted for the road network.
      (2) The ability to process the information if it has been collected by functionality in other Functional Areas, or by sensors connected to the Function.
      (3) The ability to process the information provided to the Function even if it has not been systematically checked.
      (4) The ability to collect inputs provided by "Weigh-In-Motion"sensors and creating data objects from them to record the weight per axle and gross weight for Freight Vehicles.
      (5) The ability to request the Vehicle's Driver to provide records, of route, speed, hours until the next rest stop, etc.
      (5) The ability to receive guidelines from functionality in the Manage Traffic Functional Area about the way that rules should be applied and compliance checked.
    links:
