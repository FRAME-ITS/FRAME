  - name: "F7.3 Process Violation Notifications"
    guid: "{484A054E-FDBF-4cf2-BA2D-6E62961E0722}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall process all the violation notifications detected by functionality in this and other Functional Areas.  It shall classify the notifications by kind of violation, level of importance.  If not already done, the Function shall ask for the identification of the violator. Depending on the type of violation, it shall build a prosecution file gathering all the information required by the Law Enforcement Agency and send it.
