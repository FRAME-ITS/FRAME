  - name: "F7.3.6 Create File for use in Prosecution"
    guid: "{1929C09D-9343-41f6-91D6-A9BD7AEE510E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to send the file containing all the elements necessary for the prosecution of the violator to the most appropriate Law Enforcement Agency.
      (2) As part of the process of preparing the file, the ability to check that the violation is not the result of an instruction that has been given to and acknowledged by a Driver and to abandon the prosecution process if it was.
      (3) The ability to also send the resulting file, plus all the elements received, to the functionality that stores violation notifications.
    links:
