elements:
  - name: "F7 Provide Support for Law Enforcement"
    guid: "{114B0BB0-2D5A-4635-A605-D99FE54477BE}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Functional Area shall provide functionality to enable the provision of an interface to Law Enforcement Agencies.  This interface shall be used to provide to the Law Enforcement Agency information about violations of traffic regulations and rules that have been detected by functionality within other Functional Areas.  Examples of traffic regulation violations shall include, but not be limited to, speeding, incorrect use of lanes in the road, incorrect observance of other commands sent to Drivers.  Over-weight vehicles shall be detected by functionality within this Functional Area itself and the details passed to the Law Enforcement Agency.
      
      Mnemonic: psle
    links:
