    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to obtain the identity of the violator, i.e. the person who has committed the violation, from the store of User's Registration Data using the identification of the violating Vehicle as the reference for the data.
      (2) The ability to send this extracted information to other functionality in the Provide Support for Law Enforcement Functional Area.
