  - name: "F7.2.1 Analyse Image"
    guid: "{FC89F403-7AB3-4cf6-9222-DF71EDBB2399}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to analyse the image received from the Process Violation Notifications or Detect Violation Functions.
      (2) The ability to determine the ID of the violator vehicle, and the type of violation involved from the received image.
      (3) Once the image has been analysed, the ability to send the results to the Determine Violator ID Function.
