  - name: "F7.2 Identify Violator"
    guid: "{2F5B1A41-93A6-4663-AB3D-34BCA59B8EDF}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall analyse the image or information included in the violation notifications sent to it by either functionality in other Functional Areas, or the "Detect Violation" Function.  From this analysis the functionality shall determine the identity of the violator and shall supplement it with information stored in the store of User's Registration Data.
