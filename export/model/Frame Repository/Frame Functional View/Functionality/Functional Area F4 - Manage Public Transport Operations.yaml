  - name: "F4.2 Plan PT Service"
    guid: "{11256DFE-FADE-493f-803F-220E79388CDC}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall perform the strategic planning of all the Public Transport services on the basis of all available information about the availability of resources and a record of historical data.  The scheduling of all the Public Transport services shall mainly be performed off-line according to parameters such as analysis of demand, revenue, fleet and personnel resources, etc. It shall take into account the configuration of the road network so that the routes that are used by the services will be accessible to Public Transport vehicles.  Specific functionality dealing with the planning of car-pooling services, according to the demand and availability of travellers and drivers, shall also be provided.  Availability of on-demand services shall also be defined by this Function as well as all definition and management of tariff schemes.
