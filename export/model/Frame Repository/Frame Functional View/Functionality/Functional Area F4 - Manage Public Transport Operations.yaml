  - name: "F4.2.8 Plan New PT Service Schedule"
    guid: "{6646E43B-CB56-4531-A39F-0D4D27299BFC}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to prepare new PT Service Plans at the request of the PT Operator, taking account of constraints such as, the geographic area to be served, quality of service parameters (e.g. frequency of Vehicles, required routes), timetables, synchronisation, PT Driver duty scheduling, co-ordination with other modes of transport, etc.
      (2) The ability to also prepare new PT Service Plans that are variations in the normal service provision when input is received about such things as special events, unusual traffic conditions, changes in the services provided by other PT operations, the occurrence of incidents that affect the flow of traffic in the road network and requests resulting from the implementation of a demand management strategy.
      (3) The ability to send the newly prepared PT Service Plans to the Manage PT Service Plan Data function for use by other PT functionality and to other Functional Areas, such Provide Traveller Journey Assistance, where it will be used to plan Travellers' trips.
      (4) The ability to also send newly prepared PT Service Plans to other instances of this functionality such as different PT service providers and the operators of other transport modes.
