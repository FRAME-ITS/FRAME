  - name: "F4.2.10 Manage PT Service Plan Data Store"
    guid: "{A753E2CC-1878-4a0a-ACCE-B7D407196651}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Manage the information objects in the store of PT Service Plan Data to ensure that its coherency is maintained at all times ensuring that the new data objects that are loaded are either applied to a new PT Service Plan or are used to update an existing PT Service Plan.
      (2) When received from the Plan New PT Service Schedule function, load the data objects containing details of the new or updated PT Service Schedule into the Data Store.
      (3) Every time data objects containing a new or updated PT Service Schedule into the Data Store, also send copies to the Prepare Fare Schemes, Optimise PT Fleet Control, Provide PT Driver Management and Provide PT Maintenance Co-ordination functions.
      (4) When requested by the Plan New PT Service Schedule function extract all the details of the existing PT Service Plans from the store of PT Service Plan Data and send them back to the function.
