  - name: "F4.1.17 Manage Real Time PT Vehicle Status Data Store"
    guid: "{216603D1-339C-4041-88DF-A65C160D1A49}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 12
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Manage the information objects in the store of Real Time PT Vehicle Status Data to ensure that its coherency is maintained at all times. merging the real time data objects that are received with data objects containing the relevant PT Vehicle static data.
      (2) When received from the Collect PT Vehicle Data function, load the data objects containing real time PT Vehicle data into the Data Store.
      (3) Every time data objects containing real time data are received, send copes to the Calculate PT Service Performance, Predict PT Vehicle Timings and Optimise PT Fleet Control functions.
      (4) When data objects containing static data about a PT Vehicle are received from the Provide PT Operator Fleet Control Interface function load them into the Data Store.
    links:
      - "Aggregation «component of» → F4.1 Monitor PT fleet"  # {EFF58CC4-6697-438c-A096-D0FF2C8E2A1E} → {6371794D-1857-4152-B781-18AE7C5B8FC3}
