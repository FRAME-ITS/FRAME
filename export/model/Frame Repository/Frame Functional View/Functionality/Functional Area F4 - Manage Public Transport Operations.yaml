  - name: "F4.1.18 Manage Historical PT Vehicle Data Store"
    guid: "{2DE909B2-973A-4eb2-827E-C8BFAEFDB1BD}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 13
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Manage the information objects in the store of Historical PT Vehicle Data to ensure that its coherency is maintained at all times. merging the historical data objects that are received with data objects containing the relevant PT Vehicle static data.
      (2) When received from the Collect PT Vehicle Data function, load the data objects containing averaged PT Vehicle data into the Data Store.
      (3) Every time data objects containing averaged PT Vehicle data are received, send copes to the Predict PT Vehicle Timings, Optimise PT Fleet Control and Plan New PT Service Schedule functions.
      (4) When data objects containing static data about a PT Vehicle are received from the Provide PT Operator Fleet Control Interface function load them into the Data Store.
      (5) When received from the Optimise PT Fleet Control function, load the data objects containing the PT Vehicle control strategy into the Data Store.
