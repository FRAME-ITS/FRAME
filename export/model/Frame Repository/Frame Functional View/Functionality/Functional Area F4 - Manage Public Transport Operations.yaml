  - name: "F4.5 Provide PT Fare Facilities"
    guid: "{0B6EE3D2-3124-4ff6-A5B3-3C8F646B059F}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide facilities that enable fares to be collected for the use of PT Services.  Fares are only collected using a "fare card" for which payment is collected via the Financial Clearinghouse.  The use of cash (coins/notes) for fare payment is not supported by the functionality.  PT Passengers can top up their "fare cards" as and when they wish and with as much credit as they wish.  Every time the "fare card" is used, the amount of credit that it contains is reduced by the cost for the use of the PT Service.  The PT Driver is provided with in indication of whether or not the "fare card" transaction was successful or not.
