    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 2
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to optimise actions to improve the reliability and schedule adherence of PT services, due to such events as changes in Passenger numbers (e.g. high demand), PT Vehicle breakdown and incidents that have occurred that affect the flow of traffic through the road network.
      (2) The ability to change the current way that PT Services are being operated, including sending revised instructions to PT Vehicle Drivers, and introducing extra PT Vehicles to support those already delivering the current services.
      (3) The ability to send to other functionality requests PT Vehicle priority for late running services or individual PT Vehicles and additional Vehicles added to services when Traveller demand is high.
      (4) The ability to exchange data with the functionality providing the HMI that enables the PT Operator to monitor and manage PT service delivery.
      (5) The ability to exchange data about PT Service operation with other instances of PT management functionality,
      (6) The ability to interact through an interface function with other transport modes to enable co-operation on the maintenance and variation in PT Services
      (7) The ability to use both real-time and historic PT Vehicle data in its actions and to record service information in the Store of historic PT Vehicle data.
