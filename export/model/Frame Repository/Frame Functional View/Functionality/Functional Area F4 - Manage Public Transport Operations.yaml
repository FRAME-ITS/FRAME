  - name: "F4.6.1 Provide Vehicle Sharer Interface"
    guid: "{03E45E36-BEAB-4729-B2FB-DCA15B1A6590}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Vehicle Sharer can register or de-register to be included in vehicle sharing travel plans.
      (2) The HMI shall also enable the Vehicle Sharer to take part in plans that they propose, or are proposed by other Vehicle Sharers.
      (3) The ability through the HMI for Vehicle Sharers to accept or reject any proposed travel plan to be shared with other Vehicle Sharers and to request and view only those travel plans in which they are active participants.
      (4) The HMI shall also be capable of operating in a variety of locations and if necessary provide controlled access for registered Vehicle Sharers.
    links:
