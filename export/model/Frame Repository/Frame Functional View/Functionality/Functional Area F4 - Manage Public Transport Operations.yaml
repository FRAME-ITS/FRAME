  - name: "F4.1.13 Provide Operator Interface for Manage PT Fleet"
    guid: "{56DD3309-3A47-453b-BC17-4214FBD1D4DF}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 8
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The provision of a suitable HMI through which the PT Operator can monitor and manage the operation of the PT Vehicle fleet.
      (2) The ability to request and display through the HMI real-time information about PT Vehicles, including the current locations and predicted arrival times, using digital map data as a background.
      (3) The ability to request and display through the HMI data about the performance of the PT Vehicle fleet in the delivery of its services.
      (4) The ability to display through the HMI details of alarms raised by PT Passengers at PT Stops.
      (5) The ability to display and write, using a suitable HMI, messages that are exchanged with PT Drivers in PT Vehicles.
