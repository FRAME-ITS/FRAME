elements:
  - name: "F4. Manage Public Transport Operations"
    guid: "{132D4B60-A4E2-4229-9661-F6171B8DE3C2}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "4.5"
    order: 0
    note: |
      This Functional Area shall provide functionality to enable the management of Public Transport operations.  It shall include the scheduling of PT Services, the set up of fare schemes, PT Driver and PT Vehicle management, vehicle sharing and on-demand PT Services.  This Functional Area shall have links with the Manage Traffic Functional Area (F3) to provide priority for its vehicles, and to provide data on the use of PT Services so that an assessment can be made of demand for different modes of transport.  The Manage Traffic Functional Area shall also provide requests for service changes to enable a move towards a better balance in the use of transport modes.  There shall also be links with other Functional Areas to provide information about violations and incidents that have been detected in the Public Transport network and to provide information for use in the preparation of trip plans for Travellers.
      
      Mnemonic: mpto
