    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 7
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive real-time static and fare information from other functionality from which it shall use a suitable HMI to display information to Pre-Trip Travellers, i.e. those Travellers who are still deciding when to make their journey.
      (2) The ability to know its location so that the information that it outputs to Pre-Trip Travellers can be filtered to remove anything that is not relevant to its location unless this is overridden at the request of the Traveller.
