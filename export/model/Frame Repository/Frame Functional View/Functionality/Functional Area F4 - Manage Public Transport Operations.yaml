  - name: "F4.1.11 Manage PT Vehicle Stop"
    guid: "{B0F0527D-5DDB-44f5-83F3-2942C76C930E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the operation of a PT stop used by PT Vehicles using real-time, static and fare information that it has received from other PT management functionality and from other PT stops.
      (2) The ability to collate, filter and fuse all the received data and to present it at the PT Stop using a suitable HMI to Static Travellers, i.e. Travellers who have commenced their trips but are not actually moving because they are waiting for a PT service to arrive at the stop.
      (3) The data filtering process shall remove all information that is not relevant to PT Services that use the PT stop and because its location is known, any information that is not geographically relevant.
      (4) The ability to detect any unexpected activity in the area surrounding its location and provide an emergency call facility for use by Static Travellers at the PT stop.
      (5) When an emergency notification is received, the ability to forward it to the Provide Safety and Emergency Facilities functionality and output the acknowledgement that is received.
      (6) The ability to send all the data it has collected to any adjacent PT stops for them to similarly process and where relevant output to Travellers.
      (7) The ability to output information to those with disabilities, e.g. deafness and blindness.
      (8) The ability to continuously monitor its operation and when a problem is detected, send a message to the Monitor PT infrastructure functionality.
    links:
      - "Aggregation «component of» → F4. Manage Public Transport Operations"  # {7CE9683A-4CA7-413f-B242-C3037B8DA10A} → {132D4B60-A4E2-4229-9661-F6171B8DE3C2}
