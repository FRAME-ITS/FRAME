  - name: "F4.6 Provide Facilities for Vehicle Sharing"
    guid: "{A8C5BEF7-4F95-43ce-9B22-C4329AFFB177}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function provides facilities that support the sharing of Vehicles by Travellers making a journey.  These Travellers are identified by the Car Pooler Terminator and are able to set up travel plans for a journey in which they combine with other Car Poolers to share the use of their Vehicles.  A travel plan may link up to the current PT services, or the services provided by other transport modes and may involve the use of car parks or service areas as places to start/finish particular segments of the journey.  Once all the car poolers in a travel plan have accepted it, the implementation is up to them.  Thus a travel plan may be for a single journey or for multiple repeats of the same journey, depending on the needs of the Car Poolers who are involved.  For security reasons, a car pooler can only find out about the travel plan(s) in which they are personally involved and can only contact other car poolers in that travel plan through the communications mechanism that each provides.  Payment for the Vehicle sharing is not included in the functionality.
