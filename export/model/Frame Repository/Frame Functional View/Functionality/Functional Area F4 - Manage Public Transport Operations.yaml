  - name: "F4.6.3 Manage Vehicle Sharing Information"
    guid: "{77F474EF-B1AA-4def-BDBF-F826363D1E8C}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the store of Vehicle Sharing Data which contains data about Car Sharers and their travel plans.
      (2) As one part of the management activity, it shall be possible for a Vehicle Sharers to register to take part in shared travel by providing sufficient data about the trips that they wish to make and their willingness to share their own Vehicle, or share Vehicles belonging to other Vehicle Sharers.
      (3) Another part of the management activity shall enable a record to be kept of the currently accepted travel plans for use in new travel plans, or for retrieval by the Vehicle Sharers involved in them.
      (4) A further part of the management activity shall control access to the store of Vehicle Sharing Data so that Vehicle Sharers may only see the travel plans in which they are active participants.
      (5) The store of information about each Vehicle Sharer must conform to the requirements of the relevant European Data Protection laws and any local variations that may have been introduced.
      (6) If notice of a Vehicle Sharer de-registering is received from the Vehicle Sharer interface functionality, details of the affected travel plans shall be sent back to that functionality for output to the other Vehicle Sharers who are involved in them.
    links:
      - "Aggregation «component of» → F4. Manage Public Transport Operations"  # {C4B0BDB5-EEA3-4f09-8C30-EC6371042D37} → {132D4B60-A4E2-4229-9661-F6171B8DE3C2}
