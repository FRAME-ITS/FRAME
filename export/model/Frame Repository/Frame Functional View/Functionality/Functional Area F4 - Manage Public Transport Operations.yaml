  - name: "F4.1.16 Monitor PT Vehicle Status"
    guid: "{9D0B55DE-B1B6-4c2a-871F-130A9C3C5CE1}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 11
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect data from sensors and other functionality on-board the PT Vehicle, including Vehicle parameters, numbers of PT Passengers currently on-board, PT Vehicle alarms, notification of unusual passenger activity and notification of an incident from Passengers on-board the PT Vehicle.
      (2) The ability to forward the PT Vehicle alarms and incidents to the Provide Safety and Emergency Facilities functionality and send the response to other functionality.
      (3) Send the collected PT Vehicle data to other functionality for processing.
      (4) Send PT Vehicle data plus details of alarms and their responses to the PT Driver interface functionality.
      (5) Also send alarms raised by PT Passengers to the Emergency Operator as these may be indication of some form of civil disturbance on-board a PT Vehicle.
      (6) Support for data and interchange with the PT Vehicle.
