  - name: "F4.6.2 Create Travel Plans for Vehicle Sharing"
    guid: "{B7D57CA7-84EE-403f-8C46-3D00AA7F7E52}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability for Vehicle Sharers to create travel plans only in response to a request for a new travel plan from a Vehicle Sharer.
      (2) The details of the travel plan must show the requesting Vehicle Sharer showing how they will travel from their origin place to their desired destination using either their own Vehicle (with other Vehicle Sharers) or as passengers in Vehicles belonging to one or more other Vehicle Sharers.
      (3) It shall be possible for the implementation of a new travel plan to be conditional on its acceptance by any Vehicle Sharers that will be affected, because their existing travel plans will be changed.
      (4) It shall also be possible for a travel plan to use of the current PT Services, travel services provided by other modes and meeting points in car parks
      (5) The ability for the criteria used to create travel plans to be made available to the PT Operator through a HMI provided by a separate function.
      (6) It must not be possible for the PT Operator to obtain information about individual Vehicle Sharers.
      (7) The ability to obtain data about existing travel plans and Vehicle Sharers through the functionality that manages the store of Vehicle Sharer Data.
      (8) The ability to exchange travel plan data with the functionality providing the HMI for Vehicle Sharers, so that new travel plans can be displayed, modified and approved, at which point they will be sent to the functionality that manages the store of Vehicle Sharer Data for future use.
      (9) The ability to modify created travel plans in response to requests from Vehicle Sharers.
    links:
      - "Aggregation «component of» → F4. Manage Public Transport Operations"  # {514BF9A9-6F7E-4cce-B63A-E6A12C793378} → {132D4B60-A4E2-4229-9661-F6171B8DE3C2}
