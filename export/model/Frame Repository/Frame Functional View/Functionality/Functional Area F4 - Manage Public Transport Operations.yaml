  - name: "F4.5.1 Provide PT Drivers access to Fares"
    guid: "{05AF58D0-FF47-427e-A589-47A0E41D7775}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI to enable the PT Vehicle Driver to provide information about the date, time and route that the PT Vehicle is operating so that any fare information that is obtained is relevant.
      (2) The HMI shall also enable through which the PT Vehicle Driver can be provided with a display of the fares that are applicable to the current route being operated by the PT Vehicle.
      (3) The ability to obtain the most up to date fare information from the store of Fare Schemes Data through the Manage Fare Schemes Data Store function whenever the Driver makes a request.
