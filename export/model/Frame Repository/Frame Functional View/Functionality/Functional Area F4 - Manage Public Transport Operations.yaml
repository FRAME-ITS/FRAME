  - name: "F4.1 Monitor PT fleet"
    guid: "{6371794D-1857-4152-B781-18AE7C5B8FC3}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide continuous real time monitoring of the Public Transport vehicles progressing along their routes. Data shall be available by means of a direct data and voice link to vehicles and their drivers. Any available vehicle indicators (e.g. travel time, number of passengers, diagnostic, etc.) shall be regularly observed and estimated, before being made available to other functions.  Also special events detected by vehicles shall also be processed, e.g. emergencies, alarms, etc.  Archiving functionality shall also be included.  This Function shall provide the interface to vehicles for operators and other functions. Predicted data shall be made available to Travellers through functional Area 6.  The Function shall consist of the following lower level Functions:
