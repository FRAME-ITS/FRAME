  - name: "F5.15.1.8 Detect Vehicle Attitude Status"
    guid: "{46031CA6-419E-45d7-81CB-197FEB857A02}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to continuously receive data about the current speed, trajectory and location of the Host Vehicle.
      (2) The ability to use the Host Vehicle current speed, trajectory and location to determine if it is in the correct attitude, i.e. has not fallen over, or turned upside down, or on its side.
      (3) The ability to send data for a warning message that the Host Vehicle is not in a proper attitude.
    links:
      - "Aggregation «componentof» → F5.15.1 Provide Detection for the Vehicle Surroundings"  # {08BD6A5F-8A29-4af4-BBA7-8DA75BEAC306} → {63E3B0BC-06DA-4321-A618-EF67962816EA}
