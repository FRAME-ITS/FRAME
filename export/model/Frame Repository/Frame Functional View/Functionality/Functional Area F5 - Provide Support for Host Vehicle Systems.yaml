  - name: "F5.15.1.7 Detect Stationary Objects in Host Vehicle vicinity"
    guid: "{E350AC14-567F-465a-8AF7-2C644A7CCED1}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for processing information from sensors that detect the presence of Stationary Objects near to the Host Vehicle, i.e. the Vehicle in which it is operating.
      (2) The ability to process the sensor data to determine the location of the Stationary Objects and if they are in the road carriageway that is in the forward trajectory of the Host Vehicle, or if they are in the other carriageway.
      (3) Once processing is complete, the ability to send the data in digital form to the Determine and store local Host Vehicle Conditions Function.
    links:
      - "Aggregation «componentof» → F5.15.1 Provide Detection for the Vehicle Surroundings"  # {637BBFC7-4E07-463d-BECC-09DF12B4C87D} → {63E3B0BC-06DA-4321-A618-EF67962816EA}
