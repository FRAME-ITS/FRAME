  - name: "F5.13.9 Determine Applicable Road Information"
    guid: "{012D531C-E8BB-42b0-9C9C-24C15E871CC3}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide support for the Driver to determine the applicable road based information that can be displayed in the Host Vehicle.
      (2) The ability to include in the information the current legal speed limit and information about junctions that are being approached as the Host Vehicle moves through the road network.
      (3) The ability to receive digital map data from the Geographic Information Provider including legal speed limits and road signs, which shall be loaded into the store of Road Information Data.
      (4) The ability to use the data from the store together with the current location of the Host Vehicle in the road network to determine the current maximum legal speed for the Host Vehicle and any approaching changes in road geometry and layout for which signs are available.
      (5) If available the ability to apply any override of the legal speed limits provided by the Manage Traffic functionality.
      (6) The ability to send the legal or overridden speed limits to other functionality for display to the Driver and for use in monitoring the safety behaviour of the Vehicle.
    links:
      - "Aggregation «componentof» → F5.13 Provide Vehicle Data and ISA"  # {4EA92361-A452-49fd-A54B-12BCC5F8BAB0} → {F91C0ED5-7F89-4fd1-B561-6CE9E766291A}
