  - name: "F5.15.3.2 Analyse Road Situation around Host Vehicle"
    guid: "{0A5D11AA-6D5C-4ed1-9EE0-1157A6B90784}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to determine the probability of a collision between the Host Vehicle (i.e. the Vehicle in which it is operating) and another Vehicle.
      (2) The ability to use data about the location of Other Vehicles in the vicinity of the Host Vehicle and the predicted immediate forward trajectory of the Host Vehicle to determine if there is a high possibility of collisions taking place between them.
      (3) If a high possibility exists, the ability to send a warning to the Driver, Other Vehicles and to the Incident Management functionality suggesting the possibility of an accident.
      (4) The ability to perform this determination every time that the trajectory of the Host Vehicle or the position of Other Vehicles changes.
    links:
      - "Aggregation «componentof» → F5.15.3 Determine Host Vehicle Situation"  # {A7CA86D7-2762-4822-8AE9-8A6109CC2D59} → {D880D0A8-228C-4e34-8130-5ABAB4C9A865}
