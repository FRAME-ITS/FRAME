  - name: "F5.13.6 Determine Vehicle Position"
    guid: "{638106FA-A290-4941-8FF6-5278BD4C9F37}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to enable the Vehicle to determine its position.
      (2) The ability to determine the Vehicle position with the accuracy required by other functionality to provide their specific services to the Vehicle but as a minimum shall enable the Vehicle to determine its position relative to lanes in the road carriageway.
      (3) The ability to use data from the Location Data Source, In-vehicle system and its own sensors to determine a "dead reckoning" position and for generally improving positioning accuracy and reliability.
      (4) The ability to use map data to provide "map matching" so that the actual identity of the part of the road network in which the Vehicle is currently positioned can be determined.
      (5) The ability to provide updated position information to other functionality as soon as a change occurs.
