  - name: "F5.15.1.3 Detect Pedestrians near to Host Vehicle"
    guid: "{9B714517-CCE2-4b9c-95E9-E4FFD13A014C}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for processing information from sensors that detect the presence of Pedestrians near to the Host Vehicle, i.e. the Vehicle in which it is operating.
      (2) The ability to process the sensor data to determine the location of the Pedestrians (including Vulnerable Road Users (VRU's)) relative to the Host Vehicle and their probable trajectory.
      (3) Once processing is complete, the ability to send the data in digital form to the Determine and store local Host Vehicle Conditions Function.
