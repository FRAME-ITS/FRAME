  - name: "F5.15.1.1 Detect Other Vehicles near to Host Vehicle"
    guid: "{6DAE5D64-1C77-4e13-BB59-D3B5C52CDFB0}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for processing information from sensors that detect the presence of Other Vehicles near to the Host Vehicle, i.e. the Vehicle in which it is operating.
      (2) The ability to process the sensor data to determine if any Vehicles are present, their location relative to the Host Vehicle and to determine their types and probably trajectories.
      (3) Once processing is complete, the ability to send the data in digital form to the Determine and store local Host Vehicle Conditions Function.
    links:
      - "Aggregation «componentof» → F5.15.1 Provide Detection for the Vehicle Surroundings"  # {94CE0001-DA3F-4791-A331-98474425CE20} → {63E3B0BC-06DA-4321-A618-EF67962816EA}
      - "Association «IN» → pshvs_vehicle_detected_nearby"  # {0F0C70BB-08F4-4f4f-ABF2-5105564B4B42} → {80685EAC-6A6F-4307-B2AD-22D8F98B2575}
  - name: "F5.15.1.2 Detect Other Road Users in nearby geographic area"
    guid: "{44CED227-A383-4108-8D98-AD781491CEE5}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for processing information from sensors that detect the presence of Other Road Users near to the Host Vehicle, i.e. the Vehicle in which it is operating.
      (2) The ability to process the sensor data to determine the type of Other Road User (cyclist, motorcyclist, Vulnerable Road User (VRU), "non-equipped" Vehicle) that is nearby, their location relative to the Host Vehicle, and to determine its type and probably trajectory.
      (3) Once processing is complete, the ability to send the data in digital form to the Determine and store local Host Vehicle Conditions Function.
