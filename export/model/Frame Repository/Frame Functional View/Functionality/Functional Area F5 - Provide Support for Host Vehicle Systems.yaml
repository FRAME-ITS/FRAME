  - name: "F5.15.1.4 Detect Atmospheric Conditions near Host Vehicle"
    guid: "{CE67284F-08FE-4fab-8CC6-936325C903C1}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for processing information from sensors that detect the atmospheric conditions near to the Host Vehicle, i.e. the Vehicle in which it is operating.
      (2) The ability to process the sensor data to determine such things as temperature, wind strength and direction (taking account of the Host Vehicle's direction of travel), the presence of rain, etc.
      (3) Once processing is complete, the ability to send the data in digital form to the Determine and store local Host Vehicle Conditions Function.
    links:
      - "Aggregation «componentof» → F5.15.1 Provide Detection for the Vehicle Surroundings"  # {D086A73A-CE4B-42f8-BF43-97CA0D9AF0D0} → {63E3B0BC-06DA-4321-A618-EF67962816EA}
