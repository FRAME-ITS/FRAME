      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect Extended Floating Car Data (XFCD) from the host Vehicle and the Other Vehicle plus fused data from the System that it has collected from other Vehicles.
      (2) The ability to collate and fuse all of the data that has been collected to provide a coherent and consistent view of the road and traffic situation around the host Vehicle.
