  - name: "F5.15.1 Provide Detection for the Vehicle Surroundings"
    guid: "{63E3B0BC-06DA-4321-A618-EF67962816EA}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function provides facilities for the detection of what is happening in vicinity of the Host Vehicle.  It contains functionality that can create data objects from sensors that detect Other Vehicles, Other Road Users, Pedestrians, atmospheric conditions, visibility, road surface state and stationary objects.  The data objects produced by the detection functionality are sent to other functionality in its parent High-level Function for storage and analysis.
