  - name: "F5.13.12 Monitor Vehicle Safety Behaviour"
    guid: "{C9E2F886-6705-42c3-BD16-AE9948362536}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 7
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to monitor the safety behaviour of the Vehicle.
      (2) The ability to receive data about the current location of the Vehicle, its speed and position, plus the legal and recommended speed limits for the road section that it is currently using.
      (3) The ability to use this data to determine whether or not the Vehicle is being driven in a safe manor.
      (4) The ability to consider unsafe behaviour to be such things as excessive speed and swerving from one lane to another.
      (5) It is determined that the Vehicle is being driven in an unsafe manor the ability to send a warning for display to the Driver and an indication of bad safety behaviour to the functionality that collects FCD/XFCD so that this data is not used to calculate traffic conditions.
