  - name: "F5.15.1.5 Detect Visibility in Host Vehicle vicinity"
    guid: "{91746B4E-ABF9-4750-A4F7-1D9AE330EDA5}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for processing information from sensors that detect the level of visibility in the geographic area surrounding the Host Vehicle, i.e. the Vehicle in which it is operating.
      (2) The ability to process the sensor data to determine the level of visibility and the reason for it, e.g. fog, darkness.
      (3) Once processing is complete, the ability to send the data in digital form to the Determine and store local Host Vehicle Conditions Function.
    links:
      - "Aggregation «componentof» → F5.15.1 Provide Detection for the Vehicle Surroundings"  # {F2B434CB-F85F-4242-A0F2-EB90B84EB6FE} → {63E3B0BC-06DA-4321-A618-EF67962816EA}
