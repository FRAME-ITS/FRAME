      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for enabling the Freight Vehicle Driver or the Freight Transport Operations Manager to make any required payments for the trip planning service and/or make any required advanced payments for services included in the accepted Vehicle Trip Plan.
