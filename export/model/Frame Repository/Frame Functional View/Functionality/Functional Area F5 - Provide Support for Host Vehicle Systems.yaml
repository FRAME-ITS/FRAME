  - name: "F5.16.3 Assess Dynamic Command & Warning Indications"
    guid: "{36B45597-0C64-4842-AB9F-2F44B1D42810}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Use its own sensors to obtain details of the commands and warnings that are being output to Drivers from the roadside.
      (2) Make comparisons between the details obtained in (1) and the commands and warnings that are being output to Drivers from within the Vehicle.
      (3) If the assessment in (2) shows that there is a difference, the Function shall report this to the Provide Commands and dynamic Warnings Function so that a suitable output can be made to the Driver.
