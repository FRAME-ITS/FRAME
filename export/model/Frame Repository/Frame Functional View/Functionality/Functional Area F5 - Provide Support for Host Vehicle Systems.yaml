  - name: "F5.15.3.1 Predict Host Vehicle Trajectory"
    guid: "{1104A701-AC9D-4027-81D9-C1D4476BC3DD}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for predicting the trajectory of the Host Vehicle, i.e. the Vehicle it which it is operating.
      (2) The ability to receive data about how the Host Vehicle is moving and its current location within the carriageway and within the road network.
      (3) From this data the ability to predict the immediate forward trajectory of the Host Vehicle, e.g. staying in lane, lane change, overtaking, turning, reversing, stopping and stationary.
      (4) The ability to classify whether the predicted immediate forward trajectory of the Host Vehicle is safe or not.
      (5) If the predicted immediate forward trajectory of the Host Vehicle is found to be unsafe, the ability to send a warning message to other functionality for output to the Driver of the Host Vehicle.
      (6) The ability to also use the data it receives from traffic signals that are relevant to the future trajectory of the Host Vehicle showing when red (stop) and green (go) will be displayed to determine whether the Host Vehicle will run a red light.
      (7) If the data received from traffic signals shows that the Host Vehicle will run a red light, the ability to send a warning to other functionality for output to its Driver and also to other functionality for transfer to Other Vehicles.
    links:
      - "Aggregation «componentof» → F5.15.3 Determine Host Vehicle Situation"  # {FD55C65A-928B-47a8-B845-F267726A3BF2} → {D880D0A8-228C-4e34-8130-5ABAB4C9A865}
