  - name: "F5.15.3.3 Classify Host Vehicle Driver Behaviour"
    guid: "{97FF3690-227C-480e-B516-DA3455A0603C}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for classifying the expected behaviour of the Host Vehicle (i.e. the Vehicle in which it is operating) according to the status of its Driver.
      (2) The ability to receive data about the predicted immediate trajectory of the Host Vehicle from its current location within the carriageway and the road network.
      (3) The ability to analyse the data received about the behaviour of the Driver of the Host Vehicle and use this together with the immediate trajectory to classify the future operation of the Vehicle as safe or un-safe.
      (4) If the behaviour of the Driver is shown to be un-safe, the ability to send a warning for output to the Driver of the Host Vehicle.
    links:
      - "Aggregation «componentof» → F5.15.3 Determine Host Vehicle Situation"  # {EDBC5015-6968-44b0-A908-63AA9891BA6F} → {D880D0A8-228C-4e34-8130-5ABAB4C9A865}
