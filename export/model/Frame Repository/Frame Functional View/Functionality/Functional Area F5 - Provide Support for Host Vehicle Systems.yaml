  - name: "F5.14.17 Prepare and Amend Trip Plans"
    guid: "{635F7A9D-F419-43a6-A58C-CD756C0AA250}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 10
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for the management of the preparation of Vehicle Trip Plans.
      (2) The ability to create Vehicle Trip Plans for one of three reasons:
      - as a result of a request from a Driver (called the Trip Planning Driver) in this instance,
      - because the implementation of a previously created Vehicle Trip Plan shows that changes are needed to provide an improved road trip experience for the Driver,
      - as a result of a request from functionality in the Manage Freight and Fleet Operations Area, so that the Vehicle Trip Plan can form part of a Freight Transport Execution Plan.
      (3) The ability to send its requests for Trip Plans to be created to the Trip Planning functionality within the Provide Traveller Journey Assistance Functional Area and to seek acceptance from the Driver of the resulting Trip Plans.
      (4) If the Trip Plan was created as a result of the first data flow in (a) wben it has been accepted by the Driver, and the use of rest areas and/or unloading zones has been includedthe ability to send it to the Manage Store of Vehicle Trip Plans function so that it can be available for implementation.
      (5) If the Trip Plan was created as result of the second data flow in (a), start its implementation so that the Driver sees no interruption to their journey.
      (6) If the Trip Plan was created as result of the third data flow in (a), return it to the functionality in the Manage Freight and Fleet Operations Area that requested its creation.
