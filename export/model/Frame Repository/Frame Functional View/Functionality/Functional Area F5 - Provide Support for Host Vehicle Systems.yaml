  - name: "F5.14.12.1 Check for Rest Area Requirement"
    guid: "{AE25EFB0-1CCD-4d81-B2B3-71142EB5C4BC}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to check the time that it will take to complete a trip plan.
      (2) For those trip plans for which their time to complete exceeds the maximum hours a driver may work that is allowed by the relevant European Working Time Directive(s), the ability to refer the trip plan for the inclusion of one or more stops in rest areas.
      (3) For those trip plans for which their time to complete does not exceed the maximum hours a driver may work that is allowed by the relevant European Working Time Directive(s), the ability to refer the trip plan for checking to see if use of un/loading zones is needed.
    links:
      - "Aggregation «componentof» → F5.14.12 Manage Use of Rest Areas"  # {9E6E79AE-4110-45d5-AD78-CAF576E06F88} → {B09645ED-4FB1-4c86-9564-5E6C67631974}
      - "Association «IN» → pshvs_trip_plan_with_no_truck_parking_needs"  # {67F953C8-F494-4f34-AF2D-DA359CAD2093} → {B3CCE931-ABC4-4142-983E-026FE4525C38}
      - "Association «IN» → psvhs_trip_plan_with_rest_area_needed"  # {D8009015-5C58-454a-9000-BAA15CA76C1F} → {9D3A619A-C1D8-4a1f-A60E-5ADEFA1E792B}
  - name: "F5.14.12.2 Find Suitable Rest Areas"
    guid: "{82F75F74-2552-4594-8875-37A215852C9F}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide facilities that enable suitable rest areas to be identified along the route included in a Vehicle Trip Plan the use of which will enable Freight Vehicle Drivers to comply with the relevant European Working Time Directive(s).
      (2) The ability to assume that these rest areas are part of what are called "service areas" managed by a Parking Operator using other functionality and shall have to be used in order that Freight Vehicle Drivers can comply with the relevant European Working Time Directive(s).
      (3) The ability to re-send the trip plan back to the Prepare and Revise Trip Plans function for it to be updated with a revised route and ETA(s).
    links:
      - "Aggregation «componentof» → F5.14.12 Manage Use of Rest Areas"  # {4468170A-2BCD-4538-9D85-9B6638CAF526} → {B09645ED-4FB1-4c86-9564-5E6C67631974}
