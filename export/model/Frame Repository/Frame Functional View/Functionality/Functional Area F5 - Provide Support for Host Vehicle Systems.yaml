  - name: "F5.12.7 Communicate with In-vehicle Systems"
    guid: "{9B153E15-917E-4e7b-99C7-D2FFDA904992}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 3
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide an interface between the systems inside the Host Vehicle and other ITS related functionality in the Host Vehicle.
      (2) The ability to continuously analyse the data objects available from the Vehicle Systems through a "read only" interface, so that the integrity and safety of the systems themselves and the Host Vehicle cannot be compromised.
      (3) The ability to send the data objects available from (2) to other functionality in the Host Vehicle.
      (4) The ability to calculate the position and trajectory of the Host Vehicle from the data objects available from (2) and send it to other functionality in the Host Vehicle.
      (5) The ability to instantly respond when data objects are received that show the eCall activation has been automatically triggered.
      (6) The ability for the response in (5) to cause data objects about the current status of the Host Vehicle to be sent to other functionality in the Host Vehicle so that an eCall message will be sent.
