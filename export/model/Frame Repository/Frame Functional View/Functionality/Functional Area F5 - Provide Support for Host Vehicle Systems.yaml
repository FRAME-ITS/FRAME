  - name: "F5.11.11 Monitor Status of Driver"
    guid: "{43F6095D-E2AF-4a63-AC37-91289C849A12}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to continuously monitor the status of the Driver.
      (2) The ability to use data collected about the Driver to determine whether or not there is any impairment of the Driver due to any reason, which shall include, but not be limited to, fatigue, alcohol/drug abuse, sudden health problems, prolonged inattention, etc.
      (3) The ability to report the results of its determinations about the status of the Driver to other functionality in the System.
