  - name: "F5.11.7 Provide In-vehicle eCall Facilities"
    guid: "{4B6AAED4-EE90-4d5f-9C66-1D1D0C9BB919}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 2
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide facilities that enable an eCall message to be automatically sent to the Public Safety Answering Point (PSAP) by the Host Vehicle that has detected that it has been involved in an accident.
      (2) The ability to include the following data objects in the eCall message: VIN, current and previous Host Vehicle locations, Host Vehicle position can be trusted, direction in which the Host Vehicle is moving, fuel type, number of occupants, some basic information on the reason for the call, e.g. it is a real call, or a test call
      (3) The ability to check the current location of the Host Vehicle based on its own input from the Location Data Source.
      (4) The ability to send an eCall message to the PSAP either as a result of input from a Host Vehicle occupant, or automatically by the Driver monitoring system.
      (5) The ability for the Driver to cancel the automatic initiation of the eCall message.
      (6) The ability to display call acknowledgement messages from the Mobile Network functionality and the PSAP to the Driver and other occupants (if any) in the Host Vehicle.
      (7) The ability to re-send the eCall message if the Mobile Network functionality returns a "message failed" indication.
    links:
      - "Aggregation «componentof» → F5.11 Provide Driver Monitoring and eCall"  # {C6F827CF-CEAE-4450-AE8C-828EB144AE0F} → {1D137B7D-49D7-469b-B75F-C889DED53DC9}
