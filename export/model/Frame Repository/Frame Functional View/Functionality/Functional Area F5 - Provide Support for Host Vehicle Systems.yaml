  - name: "F5.16 Provide Outputs to Host Vehicle Drivers"
    guid: "{0AAEF8C7-9771-4c0b-8E27-5BD596BF8380}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide facilities that enable the output of messages, warnings and other information to be provided to the Driver in the Host Vehicle.  It shall output these messages in a pre-determined priority so that those with the highest priority are easily seen by the Driver and take precedence over those with lower priorities.  The Function shall also compare the content of the messages, warnings and other information with what the Driver can see being displayed by equipment outside of the Vehicle, and report any differences.
    links:
      - "Aggregation «componentof» → F5. Provide Support for Host Vehicle Services"  # {5220452C-97B6-46e2-981A-6F9AA2E8C281} → {F1EBADEA-D763-4ff2-9557-A98565A22658}
