  - name: "F5.12 Provide Vehicle Communications Interfaces"
    guid: "{D7C917ED-CA9B-4e92-868E-80C5A2AA7BC3}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall enable data objects to be created from the Host Vehicle's systems interfaces, data objects created by its functionality to be made available to the Host Vehicle's systems and to enable communications between the Host Vehicle and Other Vehicles, in order to support the provision of advanced Driver assistance systems by systems in the Host Vehicle.  It shall provide functionality to enable copies of the current traffic signals to be displayed to the Host Vehicle Driver, the Host Vehicle identity (ID) to other functions, and shall inform the relevant authorities when the Host Vehicle is being used illegally.
