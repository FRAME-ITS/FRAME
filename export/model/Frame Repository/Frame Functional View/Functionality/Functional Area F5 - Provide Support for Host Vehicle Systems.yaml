  - name: "F5.13.10 Display Current Road Information to Driver"
    guid: "{065FC334-1C33-4fc4-A058-51E93FE08DF6}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive both the current recommended speeds and headways and the legal speed limits for display to the Driver of the Host Vehicle.
      (2) A HMI that shall be able to display both speed limits, except when either there is no recommended speed limit, or it is greater than the legal speed limit.
      (3) If there is no recommended speed limit, or it is greater that the legal speed limit, the HMI shall have the ability to display the legal speed limit with a warning that there is no recommended speed limit.
      (4) If the speed of the Host Vehicle exceeds either the recommended speed or the legal speed limit, then the HMI shall display a warning message to the Driver.
      (5) The HMI shall only display the headway with the recommended speed limit.
      (6) When any changes are made to the recommended speed and headway, the HMI shall be able to provide an indication of the reason for the change.
      (7) The HMI shall also have the ability to display a warning when the Host Vehicle is being driven in an unsafe manor, i.e. poor safety behaviour due to excessive speed, or maintaining less than the minimum headway.
      (8) The HMI shall be able to continuously update the display to provide the Driver with the speed and headway for the Host Vehicle's current and expected locations within the road network and to show or remove any unsafe driving warnings.
      (9) If for any reason the HMI does not receive any inputs, it shall have the ability to show a "system not working" indication.
    links:
      - "Aggregation «componentof» → F5.13 Provide Vehicle Data and ISA"  # {791B087A-FF0E-4743-8D5E-313CD6A8106E} → {F91C0ED5-7F89-4fd1-B561-6CE9E766291A}
