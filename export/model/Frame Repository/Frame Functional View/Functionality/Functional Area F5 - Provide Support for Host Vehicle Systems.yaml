elements:
  - name: "F5.11 Provide Driver Monitoring and eCall"
    guid: "{1D137B7D-49D7-469b-B75F-C889DED53DC9}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide the facilities to monitor the status of the Driver and enable eCall messages to ne sent from the Host Vehicle.  The Function shall detect when the Driver is no longer alert, or has become ill, in which case it shall prompt the Driver to become more alert.  In the event that this fails, the Function shall issue an eCall automatically.  It shall also be possible for the Function to issue an eCall on request from the Driver.  No matter which way the eCall is initiated, the Function shall advise the Driver of the response.  The Function shall also record the key events of each trip and enable them to be subsequently reviewed in the event that the Vehicle is involved in an incident for which the Law Enforcement Agency has become involved.  When a green wave route is requested by a Driver, the Function shall send the request to the Provide Traveller Journey Assistance functionality for the route to be determined.  Once the route has been provided, the Function shall send it to the Manage Traffic functionality for implementation, unless it only includes one signalised road junction.  In this instance, the Function shall only request local priority at that junction.
