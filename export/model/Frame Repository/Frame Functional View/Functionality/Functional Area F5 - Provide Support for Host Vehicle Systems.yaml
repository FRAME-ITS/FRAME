  - name: "F5.13.8 Provide Suggested Speeds and Headways for ISA"
    guid: "{92749611-12FE-47cf-904C-706334E09A85}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide support for the Driver by suggesting the optimal speed and headway for the Host Vehicle in both its current and expected locations in the road network.
      (2) In a suitably equipped Host Vehicle, the ability to enable it to automatically keep at or below the optimal speed (Intelligent Speed Adaptation - ISA) and headway.
      (3) Once the optimal speed and headway have been determined, the ability to send them for display to the Driver, to the Other Vehicle via the Vehicle Communications Function and to the Monitor Vehicle Safety Behaviour Function.
      (4) The ability to ensure that the optimal speed is always less than or equal to the legal speed limit and enable it to vary from one road segment to another.
      (5) When sending the optimal speed and headway for display to the Driver, the ability to provide the reason(s) for any changes in the suggested speed and/or headway.
    links:
      - "Aggregation «componentof» → F5.13 Provide Vehicle Data and ISA"  # {742165E7-5308-4ae5-BAD5-A8301E636688} → {F91C0ED5-7F89-4fd1-B561-6CE9E766291A}
