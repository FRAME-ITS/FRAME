  - name: "F5. Provide Support for Host Vehicle Services"
    guid: "{F1EBADEA-D763-4ff2-9557-A98565A22658}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This Functional Area shall provide functionality that enables data objects to be collected from an interface in the Vehicle about its behaviour and external conditions, and for data objects to be provided for possible use by its management functionality.  Functionality shall also be included in this Area to enable the output within the Vehicle of traffic and travel information based on data objects provided by functionality in the Manage Traffic Functional Area.  Other functionality shall enable warning messages produced from data objects provided by functionality in other Functional Areas to be output to Drivers, for the exchange of data objects with similar functionality in other nearby Vehicles and the detection of objects in the vicinity of the Vehicle.  This Functional Area shall provide Drivers with functionality that shall enable trip planning to be done from within the Vehicle.  Data objects that have been collected from the Vehicle about its operation shall be distributed to functionality in other Functional Areas.  Interfaces shall be provided to the Provide Safety and Emergency Facilities Functional Area to enable a speedy response to eCalls that have been received from Vehicles.  Vehicle identities shall be provided by the functionality when requested by other Functional Areas.
      
      Mnemonic: pshvs
