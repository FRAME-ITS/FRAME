elements:
  - name: "F1. Provide Electronic Payment Facilities"
    guid: "{B98FD399-70DD-4ab3-92FB-F2F1B1C6B2C9}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Functional Area shall provide functionality that enables the acceptance of payment for services provided by other Functional Areas within the Architecture. It shall have an interface with the Financial Clearinghouse to enable actual payment transactions to be made. If incorrect payments (frauds) are detected, any details that are available shall be passed to functionality in the Law Enforcement Area.
      
      Mnemonic: pepf
