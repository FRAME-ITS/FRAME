  - name: "F1.3.4 Inform and Guide User"
    guid: "{DD8C0DBD-4E6C-41cf-BDF7-2D1034AF47A8}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Traveller or Driver can be guided to provide the precise definition of the service that they want, and the way that they wish to pay for it.
      (2) The HMI shall also enable the Traveller or Driver to select the appropriate contract, inform them about their rights to use the service, and display the associated price.
      (3) The ability for the Function to be activated by functionality in the Provide Traveller Journey Assistance Area, or even directly for simple operations.
      (4) The ability to ask for a credit check to be done on the Traveller or Driver and also to check to see whether an advance payment has been made.
      (5) The ability to initiate the recovery of any advanced payment, or else initiate the computation of the fee.
    links:
      - "Aggregation «component of» → F1. Provide Electronic Payment Facilities"  # {24D2AA14-EA28-4eb3-8180-808664C07293} → {B98FD399-70DD-4ab3-92FB-F2F1B1C6B2C9}
