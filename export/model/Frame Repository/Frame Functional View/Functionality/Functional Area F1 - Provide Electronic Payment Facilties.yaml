  - name: "F1.1.2 Establish Contract Statistics"
    guid: "{F8DAF14F-D832-4892-A0B9-42A85AA02490}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to process the different contracts made by the Travellers to produce statistical information for the corresponding Electronic Fee Collection Operators, or Service Providers.
      (2) The ability to respond to requests from ITS Service providers for statistical reports about the contracts that the Traveller has set up for their services.
      (3) The ability to provide a HMI through which the Electronic Payments Operator can request a statistical report for all of the contracts.
