  - name: "F1.4 Manage Operators' Revenue"
    guid: "{F08657CA-C46C-4690-B21A-277021DF88E8}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This High-level Function shall credit the account of the different Operators according to the transactions that have been made.  It shall apportion their revenue according to established rules.  The Function shall also enable Operators and Service Providers to have a clear view of the transactions that have been performed that are relevant to them.
