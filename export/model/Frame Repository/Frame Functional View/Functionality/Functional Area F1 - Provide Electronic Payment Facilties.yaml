  - name: "F1.1.3 Manage Service Data"
    guid: "{FFDE2739-9338-47a2-8A36-CBE393CEB1C8}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    tags:
      "Functionnal Requirements": "<memo>"
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the content of the store of Service Information Data (D1.3).
      (2) The management of the store shall enable the Electronic Payments Operator to review the contents of the store.
      (3) The management of the store shall also enable the contents of the store to be updated by Service Providers.
      (4) The ability to provide details of services on request to the Create EP Contract function.
