  - name: "F1.1.1 Create EP Contract"
    guid: "{E16ADC9D-3B05-4160-B14A-9456218F4885}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Traveller can establish a contract with the provider of ITS Services to be used during the implementation of a trip plan.
      (2) The HMI shall present the Traveller with information about the different types of ITS Services available, and record the choices that they make for use by other functionality.
