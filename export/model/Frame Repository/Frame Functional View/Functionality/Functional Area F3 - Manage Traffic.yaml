  - name: "F3.1.7.3 Provide Tunnel Operator Interface"
    guid: "{B15A0BD8-87B5-46a0-9AB9-5B34A9B58F1D}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) An HMI through which the Tunnel Operator can monitor and manage the operation of tunnels in the road network managed by the System.
      (2) The ability of the HMI to inform the Tunnel Operator of any exceptional situations that have been detected, e.g. congestion, blocked lane, fire and pollution and of the action being automatically taken in response.
      (3) If the Tunnel Operator is advised that there are no pre-defined actions that can be taken, the HMI shall enable them to be defined by the Operator for immediate implementation.
      (4) The ability for the Tunnel Operator to set up actions in advance of the detection of any exceptional situations.
