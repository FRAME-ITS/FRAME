  - name: "F3.1.2.14.6 Send Messages to Approaching Inter-urban Vehicles"
    guid: "{69EDBF36-8BA1-4601-8620-A82C6FCF84C2}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive and store data for information and warning messages plus commands that have been output to Drivers of preceding Vehicles using the inter-urban road network.
      (2) Use internal sensors to detect that a Vehicle is approaching.
      (3) When an approaching Vehicle is detected, the ability to output to it the data for information and warning messages plus commands relevant to the management of traffic using the inter-urban road network.
      (4) The ability to continue with the output to approaching Vehicles, changing the data every time it is changed, and stopping output if there is no data to transmit.
