  - name: "F3.5 Manage Road Maintenance"
    guid: "{2C4E39A1-4DAE-4e21-B46B-C2922531FA3F}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide the facilities needed to manage the maintenance of the road network and associated equipment in the geographic area served by the System.  This shall include the physical pavement and any equipment used to manage the use of the road network by vehicles, cyclists, pedestrians and others.  When it is found that short term or long term maintenance is needed, or repairs must be made the Function shall obtain confirmation from the Maintenance Operator before requesting the Maintenance Organisation to carry out the work.  This work shall also include the de-icing or the road surface when it has been determined that this is needed.
