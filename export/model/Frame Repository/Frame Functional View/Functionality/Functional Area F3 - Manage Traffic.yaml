  - name: "F3.3 Manage Demand"
    guid: "{4BFDC8AC-0614-4098-AEF0-9C645EAFA294}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide facilities for the management of the demand from Travellers within the road network.  The Function shall provide facilities that enable Travellers to be directed and encouraged to use all modes of transport, including walking and cycling.  The management activity shall be based on information objects collected within the Manage Traffic Area and by other Functional Areas.  The High-level Function shall enable these other Functional Areas to be involved in the implementation of demand management strategies that aim to re-distribute Traveller demand between modes of transport.
