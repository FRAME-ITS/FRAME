  - name: "F3.1.4.1 Monitor numbers of vehicles in Car Parks"
    guid: "{03937AFF-60E8-4231-8B73-41F17FB8F249}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to detect vehicles using the entrances and exits of car parks in the urban road network.
      (2) The ability to collect the data as raw input by sensors that are capable of detecting the passage and presence of all types of road vehicle, from bicycles to Heavy Goods Vehicles (HGV's).
      (3) The ability to process the data to provide actual vehicle count data, i.e. numbers of vehicles, using the entrances and exits of each car park.
      (4) The ability to send the processed data to other functionality for collation and use in traffic management.
    links:
      - "Aggregation «componentof» → F3.1.4 Provide Management of Car Parks"  # {33263767-5338-4324-A67A-245F158183B3} → {CFC380C7-2010-46fb-9DE1-6BF39DBDA8B0}
      - "Association «IN» → mt_carpark_entrance_exit_vehicle_detection"  # {6079CEEE-73F1-4e6f-9611-D5D57D6AA0E0} → {D8427A91-3B21-40f6-8476-0F69F992ECB1}
  - name: "F3.1.4.2 Detect the occupancy of Car Park spaces"
    guid: "{D84EE4AD-74B1-4d89-909C-FCAE8AADCDE3}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to detect that a Vehicle is in a car park space.
      (2) The ability to collect this data as raw input by sensors that are capable of detecting the presence of a Vehicle and determining its type, e.g. car, bicycle, Heavy Goods Vehicle (HGV), Public Transport Vehicle.
      (3) The ability to send the data about the detected Vehicle to the functionality that calculates the car park spaces occupancies to that it can be determined if a vehicle has exceeded the time it is allowed to occupy a particular space.
    links:
      - "Aggregation «componentof» → F3.1.4 Provide Management of Car Parks"  # {E9F084F8-C64A-413c-9671-5A84EF940F05} → {CFC380C7-2010-46fb-9DE1-6BF39DBDA8B0}
      - "Association «IN» → mt_carpark_space_occupancy"  # {3BF69BDB-8719-44a6-B350-025145B6CFB1} → {C8774BBE-3C0D-495c-AD73-4666D0EB5322}
  - name: "F3.1.4.3 Calculate Occupancy for individual Car Park Spaces"
    guid: "{7F1329C8-7BBF-4ff1-AF83-7866B8EFD866}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to monitor the occupancy of individual car park spaces.
      (2)  When it is detected that a new Vehicle has arrived in a space the ability to provide this information to the functionality that calculates the car park occupancy status and the functionality that collects payment for the use of the car park space.
      (3) If the functionality that collects payment for the use of the car park space responds with an indication that either no payment has been received, or that there is no time left, that a warning message shall be output to the Vehicle Driver and details of the situation sent to functionality that processes the violation of traffic regulations.
      (4) If the functionality that collects payment for the use of the car park space responds with an indication that there is a valid amount of time remaining then the ability to monitor this time and to send a warning message to the Vehicle Driver when that time is about to expire.
      (5) If the Vehicle over stays its paid for (or permitted) time, the ability to send details of the situation sent to functionality that processes the violation of traffic regulations.
    links:
      - "Aggregation «componentof» → F3.1.4 Provide Management of Car Parks"  # {8739ECAE-3824-4eae-AF07-C4C9242B93EB} → {CFC380C7-2010-46fb-9DE1-6BF39DBDA8B0}
