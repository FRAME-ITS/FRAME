  - name: "F3.1 Provide Traffic Control"
    guid: "{226ED187-DB7A-409f-B509-BA8DBFFB6DB6}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "Unknow"
    order: 0
    note: |
      This High-level Function shall provide facilities for the management of traffic that is using the urban and inter-urban road networks.  It shall provide facilities that enable data objects to be collected about the traffic using the road networks and for their use in managing the flow of traffic according to the required strategies.  These and other data objects shall be used in the the optimisation of traffic flows and to provide priority of movement through the road network for selected vehicles. Functionality shall also be included to manage car parks, rest areas, and manage the use of tunnels and bridges using data objects that it has collected itself.
