elements:
  - name: "F3. Manage Traffic"
    guid: "{E9EDA059-38C0-41ba-9127-FF30B58B7C0D}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "4.5"
    order: 0
    note: |
      This Functional Area shall provide functionality to enable the management of traffic that is using the urban and inter-urban road networks.  It shall also include functionality to detect and manage the impact of incidents, produce and implement demand management strategies, monitor car park and service area occupancies, manage the use of bridges and tunnels, provide road transport planning and manage a National Access Point.  Links shall be provided to the Provide Safety and Emergency Facilities and Manage Public Transport Operations Functional Areas so that their vehicles may be given priority through the road network and to enable assistance to be provided in the implementation of incident and demand management strategies.  The External Service Provider terminator shall be sent data objects about traffic conditions and strategies.
      
      Mnemonic: mt
