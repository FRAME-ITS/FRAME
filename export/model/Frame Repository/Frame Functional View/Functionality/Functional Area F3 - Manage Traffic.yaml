  - name: "F3.1.7 Provide Traffic Management for Tunnels"
    guid: "{D328D434-5896-4fb1-9399-1446B46AA837}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide facilities for the control and management of road traffic within tunnels.  It shall use a variety of inputs from the tunnel infrastructure to assess if there are any exceptional conditions that might affect the current situations for Vehicles as well as their Drivers and passengers.  From this assessment the Function can provide warnings and other information to Drivers as they approach the tunnels.  Facilities shall be provided by the Function to enable the Tunnel Operator to monitor the actions taken as a result of the assessment process and to modify these actions or provide new ones.
    links:
