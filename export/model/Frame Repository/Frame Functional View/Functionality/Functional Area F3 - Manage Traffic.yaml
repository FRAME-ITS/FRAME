    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The detection of  Vehicles approaching a part of the urban road network (zone or "sensitive area"), to which access is controlled.
      (2) The collection of the identity and a physical image of the Vehicle from sensors within the Function.
      (3) The ability to check the detected Vehicle identity with a list of permitted Vehicles that it has been given by the Provide Urban Traffic Commands Function, as part of the traffic management strategy being currently implemented.
      (4) The output of a warning message of no entry permission for display to Drivers of detected Vehicles whose identities do not match those on the permitted list.
      (5) The output of data about the detected Vehicle to the Manage Vehicle Access to Sensitive Areas Function.
