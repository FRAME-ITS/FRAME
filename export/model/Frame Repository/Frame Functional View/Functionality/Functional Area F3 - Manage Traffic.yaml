  - name: "F3.1.5.7 Detect Vehicle Approaching Rest Area"
    guid: "{8C851E67-280F-4546-B924-DF2D4A414A95}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to continuously monitor the area around the entrance to a rest area in a service area for the approach of Vehicles.
      (2) When its sensors detect that a Vehicle is approaching the ability to use the data from the sensors to determine the Vehicle identity.
      (3) The ability to send the Vehicle identity data to the functionality that manages service area rest area bookings.
    links:
      - "Aggregation «componentof» → F3.1.5 Provide Management of Service Areas"  # {8F2EAD41-9D8F-4aca-BD32-83E7D68A4536} → {962C365C-5E2E-4b47-BA9E-9537F154665A}
