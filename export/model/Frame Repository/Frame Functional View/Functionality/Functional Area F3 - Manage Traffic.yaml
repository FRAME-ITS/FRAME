    guid: "{04BDF1B0-6E99-487e-B7CD-7A800FAEC464}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI through which the Road Network Operator shall be able to manage the collection of environmental data, plus its analysis and use by other functionality within the System.
      (2) The HMI shall enable the Road Network Operator to request and be provided with output of the data currently being collected, prediction of environmental conditions and historical data.
      (3) The HMI shall enable the Road Network Operator to request an analysis of the environmental data, receive the resulting suggested actions and confirm these actions.
      (4) The HMI shall enable the Road Network Operator to update the static data used in the prediction of environmental conditions.
