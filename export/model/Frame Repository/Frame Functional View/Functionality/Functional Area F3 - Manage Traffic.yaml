  - name: "F3.1.1.5.12 Prevent Access to Urban Zones"
    guid: "{A3F892F5-EBA3-4780-9D26-031E08CAAA8B}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide  a physical barrier to prevent Vehicles from entering a part (zone) of the urban road network, to which access is controlled.
      (2) The receipt of data about the identity of Vehicles that do not have permission to enter the part of the urban road network (zone) to which access is controlled by the Function.
      (3) The output of a warning message to Drivers of Vehicles that do not have permission to enter the zone that a physical barrier may prevent them driving their Vehicles into the zone.
      (4) The provision of data to functionality in the Provide Support for Law Enforcement Functional Area about un-permitted Vehicles that have entered the zone so that if necessary prosecution can take place.
    links:
      - "Association «IN» → mt.psle_vehicle_entering_urban_zone"  # {4034C586-2B17-4faa-B230-44458E334410} → {35E26B7A-4225-4a93-888B-F5C3CEEDD2C5}
