    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide outputs that advise or command Drivers and/or Cyclists to use particular lane(s), and/or to drive at or below particular speeds and/or to maintain a particular headway between following Vehicles.
      (2) The ability to provide these outputs in response to commands from the Manage Urban Traffic Speeds and Headways Function.
