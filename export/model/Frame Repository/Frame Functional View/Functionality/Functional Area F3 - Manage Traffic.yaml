      - "Association «IN» → mt_traffic_prediction_results"  # {6C951558-0F17-49da-96BB-DC2D3E3B6BAD} → {0633AC1F-1768-40cf-9669-6C8F8F22BFE6}
  - name: "F3.1.6.4 Manage Traffic Prediction Data Store"
    guid: "{A14D8224-9167-4fe0-B049-D05359E11358}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the use of the store of Road Traffic Simulation Data.
      (2) The ability to load into the store the road network model and traffic data from other functionality in a way that keeps the data coherent and consistent.
      (3) It shall be possible for there to be more than one model of the same road network to enable various road configurations to be assessed for the effect on traffic.
      (4) The ability to enable the Traffic Simulation Engine functionality to obtain the data it needs to run simulations for each road network model and to store the results.
      (5) The ability to enable the Transport Planner to have access to the data in the store in a controlled manner so that changes can be made to the road network model and the results extracted for output to other functionality, either by specific request or following the automatic generation of new results by the Traffic Simulation Engine functionality.
      (6) If necessary the ability to be able to exchange data from the store with similar functionality in another instance of the System.
    links:
      - "Aggregation «componentof» → F3.1.6 Provide Traffic Predictions"  # {3CA7B0A4-9769-4440-B63E-580F180B7582} → {46C6DE8C-67D9-4327-A1EE-E3D55E6B7E97}
