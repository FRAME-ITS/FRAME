  - name: "F3.1.2 Provide Inter-urban Traffic Management"
    guid: "{2EE2E618-41FE-4ac5-9413-C23D9DAF7E9E}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "Unknow"
