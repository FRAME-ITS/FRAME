  - name: "F3.2.6 Assess Incidents and Devise Responses"
    guid: "{E7385835-A669-4853-8BCC-770578F75E6D}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the assessment of incident data and to devise strategies in response to incidents that have been detected by other functionality.
      (2) The ability to periodically review the data that has been collected about incidents and decide if any mitigation action is needed.
      (3) When mitigation action is needed the ability to either use an existing incident management strategy, or devise a new one.
      (4) The ability for an incident management strategy to involve a number of measures including changes to the current traffic management strategy, output of warning messages, plus the sending of comments and warnings to other functionality within the System.
      (5) The ability for the recipients of the warnings and comments shall be defined by the Road Network Operator through the functionality providing the HMI.
      (6) The ability for the recipients of the warnings and comments to vary from one strategy to another.
      (7) The ability to check the data and information that it sends for output as part of a strategy to ensure that it is consistent, i.e. all of the actions and warning messages are coherent and do not contradict each other.
      (8) Before implementing a strategy, the ability to require that confirmation of its use is received from the functionality providing the HMI for the Road Network Operator.
      (9) The ability to create incident management strategies either in anticipation of an incident or event, or because none of the existing strategies are suitable, following a request from the Road Network Operator received through the functionality providing their HMI.
      (10) The ability to continually monitor the data that is being collected so that it can remove strategies when incidents or events are no longer in progress.
      (11) When all the strategies that have been implemented for a particular incident or event have been removed the ability to inform the Road Network Operator to signify that the incident or event has finished, using the functionality providing their HMI.
    links:
      - "Aggregation «componentof» → F3.2 Manage Incidents"  # {6D22CD52-627E-479f-8386-D4E86291DB3D} → {7B5551F4-B9B4-4df4-A228-C3111996584E}
