  - name: "F3.5.11 Evaluate Need for De-icing"
    guid: "{5C4A01ED-D7BB-4ea6-8127-2EA028FD23E5}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to evaluate the need for the de-icing of roads and pavements.
      (2) The ability to collect data about the current state of the road and pavement surfaces and evaluate these against criteria for the need to apply de-icing.
      (3) When de-icing is found to be required, the ability to request the Maintenance Organisation to carry out the activity and send  information about the activities to the Trip Planning and Incident Management functionalities.
      (4) The ability to keep a record of the current status of the requested de-icing activities, which shall be updated using the input from the Maintenance Organisation.
      (5) The ability to send the current de-icing activity status to the store of Maintenance Data so that it can be accessed by the Road Maintenance Operator.
