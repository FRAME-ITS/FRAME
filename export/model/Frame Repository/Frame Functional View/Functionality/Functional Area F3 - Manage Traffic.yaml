  - name: "F3.1.6.5 Provide Traffic Predictions Operator Interface"
    guid: "{03703979-0C02-401a-B9DB-6E04C500648B}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) An HMI through which the Transport Planner can perform various tasks.
      (2) The HMI shall enable these tasks to include the management of the operation of Traffic Simulation Engine functionality and the modification of the road network model through the functionality that manages the store of Traffic Simulation Data.
      (3) The HMI shall enable the Transport Planner to request access to view both the simulation results and the current road network data for all or any of the models plus in the case of traffic data for varying periods of time and parts of the road network.
