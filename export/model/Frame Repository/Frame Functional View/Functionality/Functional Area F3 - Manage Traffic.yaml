  - name: "F3.1.2.13.8 Provide Inter-urban Ramp Metering"
    guid: "{2E0B22F4-4294-4d57-8C59-3CD19294DFD8}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the traffic using an entrance to the inter-urban road network - sometimes call "entrance ramps" or "on ramps".
      (2) The ability apply strategies to manage the use of the "ramp" in support of other strategies that are managing the inter-urban road network as a whole.
      (3) The ability to apply suitable and appropriate algorithms so that the flow of traffic down the "ramp" causes the least disruption possible to the traffic already using the inter-urban network.
      (4) The ability to use traffic data from the inter-urban road network to determine the traffic conditions on the inter-urban road network, both in the immediate vicinity of the "ramp" as well as upstream and downstream of the ramp.
      (5) The ability to supplement traffic data provided by other functionality with data collected by its own sensors about traffic conditions on the "ramp", on the approaches to the "ramp" and in the local part of the inter-urban road network surrounding the "ramp" and to use this data to determine local traffic conditions.
      (6) A suitable HMI through which commands can be sent to Drivers using the "ramp" and to those approaching the "ramp" from an upstream part of the inter-urban road network.
      (7) The ability for the commands to be displayed to Drivers either at the roadside, or through a device in their Vehicles.
      (8) The ability to manage one or more "ramps" and to apply different strategies and/or algorithms at each "ramp".
    links:
      - "Aggregation «componentof» → F3.1.2.13 Manage Inter-urban Traffic Strategies"  # {3DDAFC96-5B95-4b79-B70D-2CC23CEB43B5} → {44E4B5FB-6CF5-40a0-9CE1-D676DB87CA84}
      - "Association «IN» → mt.pshvs_inter-urban_ramp_metering_outputs"  # {3DF9D160-3967-4fe6-91D1-98996DBF7BE4} → {2A04C704-F5B0-4a40-A50A-E0CCC49767B3}
