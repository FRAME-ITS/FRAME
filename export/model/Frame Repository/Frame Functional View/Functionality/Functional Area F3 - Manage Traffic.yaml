  - name: "3.4.8 Manage Environmental Conditions Data Store"
    guid: "{01FE39DB-280D-4a2c-92D6-076899B2A6F1}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the store of Environmental Conditions Data.
      (2) In performing this activity, the ability to collect and collate environmental data provided by other functionality and from other System(s) and load this data into the store of Environmental Conditions Data.
      (3) Periodically or when requested by the Road Network Operator, the ability to retrieve data from the store of Environmental Conditions Data and send it to other functionality in the System.
      (4) The ability to retrieve data from the store of Environmental Conditions Data and send it to other functionality in the System and when returned, load the results back into the store.
      (5) When confirmed by the Road Network Operator, the ability to add to the store of Environmental Conditions Data any confirmed actions to reduce the impact of environmental conditions.
      (6) The ability to provide the Road Network Operator with copies of the stored data when requested by the Operator.
