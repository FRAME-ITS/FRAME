  - name: "F3.5.12 Evaluate Need for Equipment Maintenance"
    guid: "{5FFB8F0E-27F7-468d-9840-83308422610E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to evaluate the need for maintenance of roadside and other equipment and request any needed repair activities.
      (2) The ability to collect information about equipment faults provided by other functionality in the System and to compare these with information about the activities needed to fix them.
      (3) The ability to maintain a record of preventative maintenance activities that may be required from time to time by the equipment.
      (4) From this comparison faults with recommended activities and the list of preventative maintenance, the ability to produce a list of actual maintenance work that needs to be carried out.
      (5) If the application of these activities is confirmed by the Road Maintenance Operator, the ability to request the Maintenance Organisation to carry out the work.
      (6) The ability to keep a list of the status of all outstanding roadside equipment faults and make this list available to the Road Maintenance Operator on request through the  store of  Maintenance Data.
      (7) The ability to update the list of all outstanding roadside equipment faults with information that it receives from the Maintenance Organisation.
    links:
      - "Aggregation «componentof» → F3.5 Manage Road Maintenance"  # {D2E0040A-4CD2-46d1-B284-824553E84DE1} → {2C4E39A1-4DAE-4e21-B46B-C2922531FA3F}
