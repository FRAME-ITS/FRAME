    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for the management of data about incidents and the production of statistical reports.
      (2) The ability to receive data about reported incidents and updates to that data from other functionality and incident data from other entities outside the System.
      (3) The ability to load all the data that is received into the store of Incident Data.
      (4) The ability to retrieve data from the store of Incident Data for assessment, when requested by other functionality in the System.
      (5) When a request is received from the functionality providing the HMI for the Road Network Operator, the ability to retrieve the data from the store of Incident Data and produce the required incident statistics reports.
