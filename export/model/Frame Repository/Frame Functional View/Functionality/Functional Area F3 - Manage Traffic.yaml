  - name: "F3.6.3 Manage Content Providers Metadata"
    guid: "{B623B347-AA95-44be-9043-55050E3CFC41}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive and process request to upload new or updated metadata from a NAP Content Provider.
      (2) The ability to forward the authorisation credentials of the NAP Content Provider to the Function Manage NAP User Registrations and to receive a result about the authorised registration of the NAP Content Provider from the Function Manage NAP User Registrations.
      (3) The ability to perform basic and consistency checks on filled in metadata (e.g. the data are filled in expected manner and are structurally complete)
      (4) The ability to send the metadata included in the request in (1) above to the Function Manage NAP Metadata Repository for loading into the data store if the checks in (2) above were successful.
      (5) The ability to send a "failure" response to the entity that made the request in (1) above if the checks in (2) and (3) above were unsuccessful or a “success” response if the checks were successful.
      (6) Ability to provide metadata created by the NAP Content Provider and data created by the NAP, i.e. quality records and NAP User event log to the NAP Content Provider.
      (7) Ability to record NAP Content Provider Activity into the NAP Users data store.
      (8) Ability to update, amend or delete existing metadata records.
      
      NOTE: the ability to browse, search and view metadata is in the functionality F3.6.4 Manage Metadata Retrieval. It is assumed that NAP Content Provider is also logged in as NAP Content Consumer.
      
      
      ===========
