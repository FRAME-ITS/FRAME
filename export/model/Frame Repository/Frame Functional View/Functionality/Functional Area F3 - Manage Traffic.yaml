  - name: "F3.1.2.13.2 Check Access to Inter-urban Zones"
    guid: "{ABA78A72-EB1B-41b2-8558-5CD35E08E2E6}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to detect Vehicles approaching a part of the inter-urban road network (zone or "sensitive area"), access to which is controlled.
      (2) The ability to obtain and the identity and a physical image of the Vehicle from its own sensors.
      (3) The ability to check the physical images of Vehicles obtained from its own sensors with a list of permitted Vehicles that it has been given by other functionality, as part of the traffic management strategy being currently implemented.
      (4) The ability to output a warning message to Drivers of Vehicles whose identities do not match those on the permitted list as they approach a point in the inter-urban road network that gives access to a zone.
      (5) The ability to send data about a Vehicle that has been detected approaching a zone to the functionality that manages access to sensitive areas.
    links:
      - "Aggregation «componentof» → F3.1.2.13 Manage Inter-urban Traffic Strategies"  # {3483CE71-80CB-4423-9391-0FCF6470C1BF} → {44E4B5FB-6CF5-40a0-9CE1-D676DB87CA84}
