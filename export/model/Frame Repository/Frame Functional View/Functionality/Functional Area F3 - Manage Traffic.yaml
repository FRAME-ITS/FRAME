  - name: "F3.4 Provide Environmental Information"
    guid: "{76CF90A1-6DE9-446b-9FA4-8F7412DA0B70}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide the facilities needed to collect and store information objects about the changes to the atmospheric conditions present in the geographic area in which road network is located.  The High-level Function shall enable the information objects that are collected and stored to cover noise, pollution and weather.  It shall be possible for these information objects to be used to predict future atmospheric pollution levels.  The stored information objects containing the predictions of atmospheric conditions shall be provided to other parts of the Manage Traffic Area and to other Functional Areas within the System.
