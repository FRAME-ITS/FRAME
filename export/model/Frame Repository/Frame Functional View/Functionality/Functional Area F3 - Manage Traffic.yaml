  - name: "F3.1.1.8 Collect Urban Data from Vehicles"
    guid: "{5FE81A1A-C46C-452d-BA7A-8CA5C1D58EB3}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Validated"
    version: "5.0"
    order: 3
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The collection of  Floating Car Data (FCD) and Extended Floating Car Data (XFCD) from suitable equipped Vehicles that are using the urban road network.
      (2) The Function shall expect the data to be the raw input data provided by functionality in the Vehicle and to contain location information, time plus Vehicle identity and status data.
      (3) The processing of the collected data to provide actual traffic flow data, e.g. flow, speed, for the urban road network, Vehicle status data, e.g. broken down, other road related data, e.g. rain, fog, slippery road, ice and to detect incidents.
      (4) The checking of the collected data for coherence and consistency both for individual Vehicles and for the traffic as a whole in each segment of the urban road network.
      (5) The exchange of data with the Monitor Urban FCD/XFCD Source Vehicles Function to confirm that the collected data actually comes from the Vehicles whose identities are included in the data, and to discard all data except traffic flow data from Vehicles being driven safely.
      (6) The provision of the processed and collected data to the Detect Incidents from Data and Urban Traffic Data Management Functions.
      (7) The ability to make all processed data anonymous so that the movement through the urban road network of specific Vehicles cannot be identified.
    links:
      - "Aggregation «componentof» → F3.1.1 Provide Urban Traffic Management"  # {0176B629-A623-4ea0-98F3-077F59085063} → {F2989AC8-51A0-4913-B32E-0D5E048A4788}
