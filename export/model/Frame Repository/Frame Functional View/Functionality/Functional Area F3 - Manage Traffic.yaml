    note: |
      This High-level Function shall provide facilities for the management of service areas.  These are assumed to exist in the inter-urban environment, although in practice as an alternative they could be used in the urban environment.  The facilities enable the use of service area spaces to be monitored in terms of the numbers being used (service area occupancy and/or state) and for the consequent state to be output directly to Drivers.  Information about the service area occupancy and status is passed to the Trip Planning and Traffic Management data storage facilities, as well as to the urban car park management facilities.  Facilities are provided in this High-level Function for the direct output to Drivers of information about the status of car parks.  The Parking Operator is able to provide data objects about the spaces available in each service area, monitor the use of the service area and to override the status setting, e.g. to close a service area.
