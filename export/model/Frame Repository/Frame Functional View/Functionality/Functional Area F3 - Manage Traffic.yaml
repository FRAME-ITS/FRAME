    guid: "{44E4B5FB-6CF5-40a0-9CE1-D676DB87CA84}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 7
    note: |
      This High-level Function shall be responsible for the management and imposition of strategies to manage the way that Vehicles are using the inter-urban road network.  It shall be able to impose strategies on some or the entire inter-urban road network managed by the System, either as part of a pre-determined timetable of changes, or at the command of the Road Network Operator, or taking account of strategies that are being used in to manage the urban road network.  The Operator shall in fact be able to override one or more of the planned strategies in all or part(s) of the inter-urban road network.  It shall also be possible for the strategies to be modified to take account of conditions on any tunnels and/or bridges and to take account of environmental conditions.
