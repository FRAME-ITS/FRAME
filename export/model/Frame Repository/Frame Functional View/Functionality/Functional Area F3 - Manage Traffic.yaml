  - name: "F3.1.5.2 Calculate Service Area Occupancy and Status"
    guid: "{462B415A-6B6D-4fd2-B79A-6CBA18BC3CEE}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to translate service area occupancy levels into service area "states".
      (2) The ability for the translation to enable the information output functionality to show either spaces or "state" according to the type of equipment that is available.
      (3) The ability for the occupancy levels to be provided by the service area occupancy monitoring functionality.
