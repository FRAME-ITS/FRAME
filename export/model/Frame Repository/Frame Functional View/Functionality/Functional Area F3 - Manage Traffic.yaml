  - name: "F3.1.7.4 Tunnel Information Output to Drivers"
    guid: "{F4368C63-81FA-4c75-9191-6311535D1C37}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI that will enable the output of information about the status of tunnels to Drivers using equipment that is outside of the vehicle.
      (2) The ability to provide facilities for the output of information about the status of tunnels to Drivers either in tunnels, or as they are about to enter them using an in-vehicle device.
      (3) It shall be possible for the information that is output to be based on data provided by both other tunnel related functionality and other functionality within the System, e.g. for the purposes of traffic management.
      (4) It shall be possible for the output from equipment outside the vehicle to be provided in a variety of ways, such as signals (stop/go), lane use indicators, text based messages, or any combination of these.
      (5) It shall be possible for Drivers to clearly see which messages are to be obeyed (mandatory) and which are for information (warnings).
      (6) It shall be possible for the output from equipment outside the vehicle to be clearly visible in all types of ambient light conditions (including darkness).
      (7) It shall be possible for the output of messages from equipment outside that instruct Drivers not to enter a tunnel to use mechanisms to physically prevent Vehicle access to a tunnel.
    links:
