  - name: "F3.1.5.3 Output Service Area Messages"
    guid: "{F615BADC-78D3-4190-97BC-FA977207938A}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide output of information about service areas to Drivers, which shall be updated as soon as new data is received.
      (2) The ability for the information to be output about car parks, if it is available from other functionality.
      (3) The ability for the information output to show either the current service area occupancy (number of spaces) or the current status depending on what is required by the Parking Operator.
      (4) The ability for the Parking Operator to select which car park occupancies and/or status are displayed.
      (5) The ability for the way in which the information is displayed to be selected from options such as, all cars/motorcycles, buses/coaches and HGV s .
