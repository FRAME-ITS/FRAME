  - name: "F3.1.2.14.4 Output Inter-urban Traffic Commands & Messages"
    guid: "{2945E366-E8A6-4bd7-A76A-C95CBA42DDAC}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to send for output the contents of traffic management strategies so that the most efficient use is made of the inter-urban road network.
      (2) The ability for the management strategies to include the output of messages to Drivers that will enable the use of road carriageway lanes, vehicle speeds and vehicle headways to be managed.
      (3) The ability for these strategies to be overridden by the Road Network Operator through the functionality providing their interface, as well as by requests for access or use of particular lanes as part of a green wave route request for Emergency Vehicles.
      (4) The ability to use current, historic and predicted traffic data from the inter-urban network and to change in real-time the actual traffic management commands being sent for output to take account of variations in this data.
      (5) The ability to continuously adapt the management of the inter-urban road network to suit the actual detected traffic conditions.
      (6) The ability to provide details of the current and previous modes of control on some or all parts of the inter-urban road network to the Road Network Operator through the functionality that provides their interface.
      (7) The ability to monitor the results of the output of commands, so that alternative action can be taken if they are not followed.
    links:
