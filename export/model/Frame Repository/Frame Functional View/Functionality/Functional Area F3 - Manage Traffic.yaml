      This Function shall be capable of providing the following facilities:
      
      (1) The ability to detect violations of inter-urban traffic control commands and report them to the law enforcement functionality.
      (2) The ability to only report a violation when it is detected that a Vehicle does not follow the current inter-urban traffic commands.
      (3) The ability for details of these commands to be provided by the inter-urban traffic management functionality.
