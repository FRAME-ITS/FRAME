  - name: "F3.1.1.6 Manage Urban Road Static Data"
    guid: "{F7014D36-DDB1-4cfd-AD72-DFF4FFDA51CE}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Validated"
    version: "5.0"
    order: 2
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The management of the store of Urban Road Static Data for use by the urban traffic management functionality.
      (2) The entry into the store of new and/or updated road network static data received from the Geographic Information Provider and/or the Road Network Operator via the operator interface functionality.
      (3) The provision from the store of current and/or updated  road network static  data  that was provided by  the Geographic Information Provider to the urban traffic management and road maintenance functionalities, plus the functionality in the Provide Support for Cooperative Systems, Manage Public Transport Operations and Provide Traveller Journey Assistance Functional Areas.
      (4) The provision of new and/or updated  road network static  data provided by the Road Network Operator to the functionality that will send the data to the Geographic Information Provider so that it can be used when digital map data is provided in the future.
      (5) The collection and loading into the store of static data about traffic regulations (i.e. speeds, access restrictions for certain Vehicle types to particular urban road segments, etc.) provided by the Road Network Operator, and its subsequent distribution to the functionality in the Provide Support for Law Enforcement, Provide Electronic Payment Facilities and Provide Support for Host Vehicle Systems Functional Areas.
