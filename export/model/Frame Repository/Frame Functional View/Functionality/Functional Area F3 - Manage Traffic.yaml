  - name: "F3.1.5.1 Monitor Service Area Vehicle Occupation"
    guid: "{0E5602CA-D10F-4daa-91FB-20F4304238A3}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect traffic data from the entrances and exits of service area vehicle parks in the inter-urban road network.
      (2) The ability to collect this data as raw input by sensors that are capable of detecting the passage of all types of road Vehicle, from Bicycles to Heavy Freight Vehicles.
      (3) The ability for the raw input data to be processed to provide actual traffic count data, i.e. numbers of vehicles, at the entrances and exits of each service area vehicle park.
      (4) The ability for the resulting data to be passed to other functionality for collation and use in inter-urban traffic control.
    links:
      - "Aggregation «componentof» → F3.1.5 Provide Management of Service Areas"  # {94A817C1-08A2-4717-860B-C80A24AF410B} → {962C365C-5E2E-4b47-BA9E-9537F154665A}
