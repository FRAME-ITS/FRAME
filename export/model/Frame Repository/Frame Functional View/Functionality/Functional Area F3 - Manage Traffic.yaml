  - name: "F3.3.8 Produce Demand Management Strategy"
    guid: "{9E267571-C180-4cf7-877F-53CD953098DB}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to produce new demand management strategies as a result of a request received from the functionality providing the HMI for the Transport Planner.
      (2) The ability for the new demand management strategies that are produced to encourage a re-distribution of the use of travel modes away from the current highly used mode(s).
      (3) The ability to use data about the current usage of different transport modes in the preparation of the new demand management strategies.
      (4) The ability to assess the data about the current usage of different transport modes against "rules" for distribution provided by the Transport Planner through the functionality providing their HMI.
      (5) The ability to send the resulting new demand management strategies to the functionality that manages the store of Demand Management Data.
