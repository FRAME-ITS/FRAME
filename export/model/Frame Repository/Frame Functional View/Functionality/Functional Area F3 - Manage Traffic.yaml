  - name: "F3.1.1.5.2 Provide Planned Urban Traffic Management"
    guid: "{B0064E43-0EE5-4919-9CF4-114928532AE0}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to enable urban traffic management strategies to be implemented automatically by a timed sequence.
      (2) The ability for the sequence mechanism to permit the implementation to be by any combination of time of day, day of week, day of month, or day of year.
      (3) The ability for new sequences to be received from the functionality that provides the Road Network Operator interface.
      (4) The ability to respond to requests received from the functionality that provides the Road Network Operator interface with details of the sequences that are currently available for use.
      (5) The ability to send requests for the implementation of traffic management strategies to the urban traffic management functionality.
    links:
      - "Aggregation «componentof» → F3.1.1.5 Provide Urban Traffic Management Facilities"  # {E8D7C2EF-5AA4-4014-9036-8219EC7DB439} → {1AF52437-DFBF-48bc-B240-E3B1A297AE9B}
