  - name: "F3.1.2.13.3 Restrict Access to Inter-urban Zones"
    guid: "{456A0D88-46A9-44fa-BFF8-107B784F0A28}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide a physical barrier to prevent Vehicles from entering a part (zone) of the inter-urban road network, to which access is controlled.
      (2) The ability to output (zone) a warning message to Drivers that a physical barrier will prevent them driving their Vehicles into the zone.
      (3) If the Vehicles are detected actually entering the zone, the ability to send the Vehicle identity to the law enforcement functionality.
    links:
