    note: |
      This High-level Function shall provide the facilities needed manage traffic using the inter-urban road network.  It shall be possible for the Traffic to be managed through control measures that result in the output of indications to drivers.  The Function shall enable these indications to be such things as messages asking that certain other actions are taken, e.g. change lane, travel at or below a certain speed, divert to an alternative route, etc.  It shall also be possible for priority for road use to be given to selected users through parts of the road network.  Data objects about the movement of traffic in the inter-urban road network shall be collected and sent to other parts of the Manage Traffic Area, to other Areas, and other Systems for their own use.
