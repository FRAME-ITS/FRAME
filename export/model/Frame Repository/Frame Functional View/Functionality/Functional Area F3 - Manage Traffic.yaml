    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to analyse the environmental data when it is received from the functionality managing the store of Environmental Conditions data to see if any action is needed.
      (2) The ability to send the results of the analysis and any recommended action to the functionality providing the HMI for the Road Network Operator for confirmation of the action.
      (3) When conformation of the recommended action is received from the functionality providing the HMI for the Road Network Operator, the ability to send the data to other functionality in the System.
      (4) The ability to send a copy of the confirmed actions to the functionality that is managing the store of Environmental Conditions for loading into the data store.
      (5) If included in the recommended action, the ability to send the data about the environmental conditions to the functionality in the System that provides the HMI through which it can be output to Drivers and/or Travellers.
