  - name: "F3.1.4.6 Collect Payment for Car Park space use"
    guid: "{24349A2F-AE19-4256-90EB-09B118127A63}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect payment from Drivers for the use of individual car park spaces.
      (2) The ability to initially show the Driver what the charges are and collect the payment for one of the specified time periods.
      (3) The ability to send details of the payment to the Financial Clearinghouse for verification and confirmation.
      (4) If confirmation of successful payment is not provided by the Financial Clearinghouse then the purchased time that is sent to the functionality that calculates the car park spaces occupancy shall be set to zero, otherwise it shall be the amount of time purchased.
