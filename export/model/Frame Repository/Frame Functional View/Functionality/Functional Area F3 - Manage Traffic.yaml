  - name: "F3.6 Operate National Access Point"
    guid: "{9363D28A-B58D-4e6d-B249-7748C0011542}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High -level  Function shall provide the facilities needed to enable a National Access Point (NAP) to operate.  It shall include functionality that enables information objects containing NAP data to be provided and stored.  These information objects shall consist of meta-data describing the data that is available and pointers to the Internet address from which data may be obtained.  NAP Content Consumers shall be able to discover, search for and obtain some or all of the NAP information objects.  These information objects will be provided to and entered for the first time by the NAP Content Provider once they have been approved as Content Providers.
