  - name: "F3.5.10 Evaluate Need for Long Term Maintenance"
    guid: "{E8CFC626-48EF-4f94-8589-A3C1FCF08E19}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 4
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to evaluate the long term maintenance needs of the road network and shall request any needed repair activities.
      (2) The ability to use the data to determine of warning should be issued to Drivers, and when these are required, send them to functionality in the Provide Advanced Driver Assistance Functional Area.
      (3) The ability to collect data about the use that traffic has been making of the road network and weather information.
      (4) The ability to compare road use data and weather information against what it means in terms of required long term maintenance.
      (5) The ability to produce recommended road maintenance activities from this comparison.
      (6) If the application of these recommended road maintenance activities is confirmed by the Road Maintenance Operator then the ability to request the Maintenance Organisation to carry out the work.
      (7) If the Maintenance Organisation is instructed to carry out the recommended road maintenance work, the ability to send information about these activities to the Trip Planning and Incident Management functionalities as they will affect traffic and because they are roadworks.
      (8) The ability to keep a record of the current status of the requested long term maintenance activities, which shall be updated using the input from the Maintenance Organisation.
      (9) The ability to send the current status of the road maintenance activities to the store of Maintenance Data so that it can be accessed by the Road Maintenance Operator.
    links:
      - "Aggregation «componentof» → F3.5 Manage Road Maintenance"  # {82DFCCD4-F4D7-4527-96FE-B5FCCC840881} → {2C4E39A1-4DAE-4e21-B46B-C2922531FA3F}
