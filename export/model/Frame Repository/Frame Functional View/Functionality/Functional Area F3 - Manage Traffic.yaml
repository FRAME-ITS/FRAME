  - name: "F3.1.6.2 Process Road Traffic Data"
    guid: "{E5845535-9E00-4901-8A0D-E18896882833}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive real-time traffic data from both urban and inter-urban functionality.
      (2) The ability to process the received data so that it can be used in the road network model by the Traffic Simulation Engine functionality.
      (3) It shall be possible for the processing to include the generation of origin/destination data for the road network and indications of unusual changes in current traffic data based on historical data.
      (4) When the data has been processed, the ability for the data to be sent to the functionality that manages the store of Traffic Simulation Data from where it can be obtained by the Traffic Simulation Engine functionality.
      (5) It shall be possible for road network (model) data to be provided and for historic traffic data to be provided periodically by the functionality managing the store of Traffic Simulation Data for use in the processing of the traffic data.
    links:
      - "Aggregation «componentof» → F3.1.6 Provide Traffic Predictions"  # {9301E9EF-C980-49ca-B8E9-44725EDC1DCA} → {46C6DE8C-67D9-4327-A1EE-E3D55E6B7E97}
      - "Association «IN» → mt_processed_road_traffic_data"  # {6FB55053-B94A-477a-B7CD-0810B1701A50} → {221CA33F-241D-4a17-9A1C-985795A89213}
  - name: "F3.1.6.3 Create Traffic Predictions with Simulation Methods"
    guid: "{416DC520-A18D-4000-999A-59F7261E5928}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to use a road network model and traffic data to provide predictions of traffic conditions for the road network.
      (2) It shall be possible for the current and historical traffic data plus road network data obtained on request from the functionality managing the Traffic Simulation Data to be used to provide the predictions.
      (3) The ability to use this data as input to a simulation engine that will predict what the traffic conditions shall be like as a result of various traffic management strategies that are provided by the Transport Planner, or have been used in the past in all or part of the road network.
      (4) The ability for these predictions to include the need for car park spaces and shall be produced at the request of the Transport Planner or at regular intervals that the Planner may specify.
      (5) When completed the ability to send the predicted traffic conditions and associated strategies to the functionality managing the store of Traffic Simulation Data.
    links:
      - "Aggregation «componentof» → F3.1.6 Provide Traffic Predictions"  # {E7AB6617-58F8-4a1a-94AE-23322CA45425} → {46C6DE8C-67D9-4327-A1EE-E3D55E6B7E97}
      - "Association «IN» → mt_operator_traffic_prediction_responses"  # {A4E202DC-6FF9-470c-BD0C-F3F9C4F80609} → {9893848C-CBF5-4b31-9F58-D2963A18FAAA}
