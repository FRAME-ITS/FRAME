  - name: "F3.1.1 Provide Urban Traffic Management"
    guid: "{F2989AC8-51A0-4913-B32E-0D5E048A4788}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall provide the facilities needed manage traffic using the urban road network.  It shall be possible to manage the traffic through control measures that result in the output of indications to drivers as to how they are to behave.  The facilities in the Function shall make it possible for these indications to be commands to stop and go, or messages asking that certain other actions are taken, e.g. divert to alternative route.  It shall also be possible for priority to be given to selected road users both at individual points and on routes through the road network.  Data objects about the movement of traffic in the urban road network shall be collected and sent to other parts of the Manage Traffic Area, to other Areas, and other Systems for their own use.
