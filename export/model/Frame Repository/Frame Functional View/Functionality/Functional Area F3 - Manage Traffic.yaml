  - name: "F3.6.2 Manage Registrations and Provide Authorisation Service"
    guid: "{B032435E-6A52-4920-97B0-C13BB3E8BFC7}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive and process a request from an entity that wants to become new NAP User.
      (2) The ability to check the new NAP User in (1) above to include electronic identification, verification that the requesting entity exists based on information included in the request and agree with terms of the NAP User (different for NAP Content Provider and NAP Content Consumer)
      (3) The ability to load information about the entity submitting the request in (1) above into the NAP Users data store, if the identification, verification, and acceptance in (2) above is successful.
      (4) The ability to provide authorisation credentials to the requesting entity.
      (5) The ability to send a rejection notice (including the reason for rejection) to the entity that submitted the request in (1) above if the identification, verification, and acceptance in (2) and (3) above was not successful.
      (6) The ability to check the authorisation of an entity which sends its credentials to the NAP functions and to response to those functions if the authorisation check has been successful.
      (7) The ability to process the information provided in an unsuccessful request for the update of NAP User data so that a suitable response can be sent to the entity that made the request and future unsuccessful update requests monitored.
      (8) The ability to register multiple user accounts within a NAP User account, i.e. users' organization.
      (9) The ability to register multiple machine accounts within a NAP User account, i.e. users' organization, for consuming or providing content from / to the NAP. The machine accounts stand for Data Requesting Systems and Data Supplying System.
      (10) The ability to organize user and machine account registered under one NAP User into organization, where user accounts have different rights to access the NAP Users data store, i.e. view, modify, add, and delete records.
      (11) The ability to remove electronic identity of the NAP User from the NAP Users data store based on reception of a request from a NAP User.
      (12) The ability to register the as one or both NAP Content Provider and NAP Content Consumer with different rights / responsibilities to perform tasks assigned to provider or consumer in the NAP via Functions Manage Content Providers Metadata and Manage NAP Metadata Retrieval.
      (13) Ability to provide registered NAP User data upon its successful authorization
      (14) Ability to log in events connected with NAP User Activity to the NAP User data store
      
      NOTE: one physical user can be part of more NAP Users but under the different electronic identity.
      
      
      =========
      
      TODO:
      
      - Split F3.6.2 functionality into 3 functions: provide authorisation and identity service, provide registration management and manage NAP Users datastore, this will simplify former F3.6.2 function
      
      - Check if NOTE is OK with everybody.
      
      - IMPORTANT: check for simplification of the functionality!!
