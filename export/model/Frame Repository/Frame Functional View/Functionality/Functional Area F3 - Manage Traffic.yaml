    guid: "{D37F617B-22C6-43f3-A21D-1C26BEA45041}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 6
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to check that the identity of Vehicles using the inter-urban road network being provided electronically corresponds to the identity obtained from matching the Vehicles' images with their registration data.
      (2) The ability to collect the images of the Vehicles and use them in the comparison process.
      (3) If no correspondence is found, the ability to send all of the Vehicle information to other functionality for potential prosecution.
      (4) If no correspondence is found, the ability to send a lack of correspondence indication to the functionality responsible for collecting FCD/XFCD data from Vehicles using the urban road network, so that the data can be marked as suspect.
