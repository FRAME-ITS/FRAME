  - name: "F3.1.5.11 Manage Rest Area Booking"
    guid: "{192BCF57-D03B-4560-8511-20C702898400}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 10
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive and store locally the results of rest area use requests made by Freight Vehicle Drivers using other functionality.
      (2) The ability to use the results of rest area use requests to enable Freight Vehicle Drivers to request that they book parking spaces in these rest areas and to seek confirmation from the Parking Operator through other functionality.
      (3) Once the Parking Operator confirms the requested booking, the ability to send this confirmation to the Freight Vehicle Driver together with details of the space that has been booked.
      (4) The ability to reject a previously confirmed rest area parking space booking if the ETA of the Freight Vehicle has changed from its previous time and spaces are no longer available at the new ETA.
      (5) The ability to remove a booking for a parking space once the Freight Vehicle that booked it has left the res area, thus making the space available for use by other Freight Vehicles.
      (6) The ability to respond to the request for the booking of a parking space for inclusion in a Hazardous Goods Vehicle trip plan, again subject to confirmation by the Parking Operator using other functionality.
