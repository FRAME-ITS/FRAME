      This Function shall be capable of providing the following facilities:
      
      (1) The ability to simulate the imposition of a demand management strategy.
      (2) The ability to carry out its simulations at the request of the Transport Planner who must specify the existing strategy that is to be simulated.
      (3) The ability to send the results of the simulation to the functionality providing the HMI for the Transport Planner.
