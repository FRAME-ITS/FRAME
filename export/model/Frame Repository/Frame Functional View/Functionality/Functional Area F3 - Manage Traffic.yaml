  - name: "F3.1.1.14 Manage Urban Traffic Data"
    guid: "{187E4725-12EA-4e77-AE1D-58ACA792603E}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 9
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1)  The ability to manage the store of Inter-urban Traffic Data.
      (2)  The ability to collect data about  traffic conditions (i.e. traffic flows, road segment use, journey times, etc.) in the urban road network and car park data from other functionality in the Manage Traffic Functional Area.
      (3) The ability to receive data about traffic conditions  (i.e. traffic flows, predicted road segment use (from trip plans), journey times, etc.) from functionality in the Provide Electronic Payment Facilities, Provide Support for Host Vehicle Systems and Provide Traveller Journey Assistance Functional Areas, plus the Cellular Communications Provider.
      (4) The ability to collate and fuse all data that is collected and received, using the inter-urban road network static data as a mechanism for achieving this where necessary.
      (5) The ability to exchange data collected by the Function with similar functionality in another instance of the System, through the Other Related System, Urban Traffic Management System.
      (6) The ability to load the collated and fused data into the store of Urban Traffic Data in a coherent way that makes it easy to retrieve it for particular road segments, or larger parts of the urban road network.
      (7) The ability to  provide the collated and fused data from  the store of Urban Traffic Data  to other functionality in the Manage Traffic area, either for its own use, or for sending to functionality in other Functional Areas and to  entities outside the System.
      (8) The ability to provide current urban traffic data for use in creating short and medium term predictions for that data and when received to load that data into the store of Urban Traffic Data.
    links:
      - "Aggregation «componentof» → F3.1.1 Provide Urban Traffic Management"  # {BD62C402-5477-449a-A638-67BB4681A3BF} → {F2989AC8-51A0-4913-B32E-0D5E048A4788}
