  - name: "F3.1.2.6 Manage Inter-urban Static Road Data"
    guid: "{3D41853C-FF9F-4fbd-8CDD-CA711AA7F552}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to take responsibility for managing the store of Inter-urban Road Static Data that is used by inter-urban traffic management functionality.
      (2) Every time a new set of data is received from the Geographic Information Provider, the ability to make it available to the inter-urban traffic management functionality and to load it into the store.
      (3) The ability to receive changes to the data from the Road Network Operator HMI functionality.
      (4) The ability to load the data received from the Road Network Operator HMI functionality into the store.
      (5) The ability to send the data received from the Road Network Operator HMI functionality, together with vehicle access regulations for the inter-urban road network to electronic payment functionality.
      (6) The ability to send changes in the data for the inter-urban road network provided through the Road Network Operator HMI functionality to functionality from which it will be returned to the Geographic Information Provider for use when digital map data is provided in the future.
      (7) When vehicle location data is received, the ability to send data about traffic regulations that apply to segments of the inter-urban road network in the geographic area relevant to the location to Driver assistance functionality.
    links:
      - "Aggregation «componentof» → F3.1.2 Provide Inter-urban Traffic Management"  # {EB6353C9-28AA-41a7-83F9-C4C71F137A80} → {2EE2E618-41FE-4ac5-9413-C23D9DAF7E9E}
      - "Association «IN» → mt.mffo_inter-urban_road_network_static_data"  # {6074CEE0-8AB0-498b-A82B-EC39D691E840} → {9C6B842F-AF96-4742-8AD7-AF42CDBFA95C}
