  - name: "F3.1.2.14.1 Provide Inter-urban Road Operator Cmd Interface"
    guid: "{E333EB24-269C-40e3-9763-49E261EE787B}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) A HMI that enables the Road Network Operator to manage the control of traffic using the inter-urban road network.
      (2) The HMI shall enable the Road Network Operator to provide commands that change the current inter-urban traffic control strategy and to override the use of lanes in the road network, except when it is imposed as part of an incident or demand management strategy, or to provide selective Vehicle priority.
      (3) The HMI shall have the ability to inform the Road Network Operator of the success or failure of the requested change.
      (4) The HMI shall have to ability to output requests to the Road Network Operator for a check to be made of the availability of auxiliary lanes (hard shoulders), and for the Operator to provide an available/not available response so that traffic can be directed to use it, or not.
    links:
      - "Aggregation «componentof» → F3.1.2.14 Implement Inter-urban Management Traffic Strategy"  # {58B78011-A039-4585-9AFA-D939778C8C45} → {033C90BB-44C7-4a7e-ADC2-10627BFE6B45}
