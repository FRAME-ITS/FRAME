  - name: "F3.1.2.13.4 Manage Inter-urban Road Network Speeds & Headways"
    guid: "{CF5F3C76-5012-401c-90EC-F1F777F1720D}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide the management of Vehicle speed and headway settings within the inter-urban road network.
      (2) The ability to receive commands to implement legal speed settings, plus both suggested speed and headway settings from either the functionality providing the Road Network Operator interface, or the inter-urban traffic management functionality, or as part of an incident, demand management, or environmental strategy.
      (3) The ability to ensure that requests from the Road Network Operator take priority and override those from the inter-urban traffic control functionality, but not override those that are part of an incident, demand management, or environmental strategy.
      (4) The ability to send speed and headway settings to the inter-urban functionality that is responsible for the output of messages to Drivers, both at the roadside and in the Vehicle, as well as to other functionality from which it can be sent to other parts of the system and to the Broadcaster.
      (5) The ability to send legal speed settings to the digital map data provider entity in case it needs to be used in future digital map updates.
    links:
      - "Aggregation «componentof» → F3.1.2.13 Manage Inter-urban Traffic Strategies"  # {11B24CA7-0950-401b-8D80-B3057312ABD6} → {44E4B5FB-6CF5-40a0-9CE1-D676DB87CA84}
