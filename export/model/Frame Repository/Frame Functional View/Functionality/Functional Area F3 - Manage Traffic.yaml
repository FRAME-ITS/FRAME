  - name: "F3.5.9 Evaluate Needs for Short Term Maintenance"
    guid: "{313DEB87-1EB5-45c7-A052-28F74C210C18}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 3
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to evaluate the short term maintenance needs of the road network and to request any needed repair activities.
      (2) The ability to use the data to determine the need for a warning to be issued to Drivers, and when these are required, the ability to send them to other functionality in the System.
      (3) The ability to use data about the amount of traffic that has been using the road network and weather information to evaluate its maintenance needs.
      (4) The ability to compare this data about the amount of traffic that has been using the road network and weather information with the parameters for activating short term maintenance activities and from this recommend the most appropriate activities to be carried out.
      (5) If the recommended short term maintenance activities are confirmed by the Road Maintenance Operator then the ability to request the Maintenance Organisation to carry out the work.
      (6) If the recommended short term maintenance activities are confirmed by the Road Maintenance Operator, the ability to send information about these activities to the Trip Planning and Incident Management functionalities as the maintenance activities will affect traffic and because they are roadworks.
      (7) The ability to keep a record of the current status of the requested short term maintenance activities, which shall be updated using the input from the Maintenance Organisation.
      (8) The ability to send the current status of the requested short term maintenance activities to the Maintenance Data Store so that it can be accessed by the Road Maintenance Operator through their HMI.
    links:
      - "Aggregation «componentof» → F3.5 Manage Road Maintenance"  # {AD21A67C-1170-4f47-99EC-AD60514FBA5C} → {2C4E39A1-4DAE-4e21-B46B-C2922531FA3F}
      - "Association «IN» → mt.pshvs_short_term_road_condition_warning"  # {6B220233-565A-4a11-B4D7-C9AD3BAD8588} → {7044D7EC-64A1-4194-84BC-DFA12BB35111}
