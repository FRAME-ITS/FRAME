  - name: "F3.2.12 Detect Incidents from Data"
    guid: "{133EE41B-40A5-49ad-9DB1-822D07A77EEA}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 7
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to analyse the data that it receives about traffic conditions in the road network to see if can detect that possibly incidents have occurred.
      (2) In the analysis of the data to detect incidents, the ability to enable the use of both data provided by other functionality and video image data as inputs.
      (3) The ability to analyse all types of data for patterns that suggest the occurrence of an incident and the ability for such patterns to be linked to the same incident if they occur in adjacent sections of the road network.
      (4) The ability for the term "incident" to include anything that is likely to impede the normal flow of traffic, including such things as wide/long loads and "ghost drivers", i.e. Vehicles travelling against the proscribed direction of traffic flow.
      (5) The ability to send details of a detected incident occurrence to the classification and storage functionality.
    links:
      - "Aggregation «componentof» → F3.2 Manage Incidents"  # {FA292B89-3CDE-4de7-A742-443A5E3BC8B8} → {7B5551F4-B9B4-4df4-A228-C3111996584E}
      - "Association «IN» → mt_incident_detection_data"  # {FBDF9CD7-5042-4cab-A217-794BEBAE0C2F} → {4899F50C-04DD-44d9-B545-7D309F392830}
  - name: "F3.3.10 Review Demand Management Strategy Effects"
    guid: "{6784737B-912B-4b57-ABBC-63FE85781002}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 7
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to review the effectiveness of demand management strategies.
      (2) The ability to carry out this review at the request of the Transport Planner who must have specified the data about the use of transport modes that is to be analysed.
      (3) The ability to send the results of the analysis of the effectiveness of demand management strategies to functionality providing the HMI for the Transport Planner.
