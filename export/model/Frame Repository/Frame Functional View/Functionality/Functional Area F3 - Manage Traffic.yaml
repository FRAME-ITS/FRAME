  - name: "F3.1.2.13.7 Manage Planned Inter-urban Traffic Strategy Change"
    guid: "{07063167-E662-4655-8A0E-F428CFF230A7}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to provide facilities that enable inter-urban traffic management strategies to be implemented automatically in a timed sequence.
      (2) The ability for the sequence mechanism to permit the implementation to be by any combination of time of day, day of week, day of month, or day of year.
      (3) The ability for the content and detail of the sequences of management comments that are to be implemented by time of day, to be received from the functionality that provides the Road Network Operator interface.
      (4) The ability to provide on request a response to the functionality that provides the Road Network Operator interface details of the time of day sequences that are currently available for use.
      (5) The ability to send requests for implementation of traffic control strategies to the inter-urban traffic management and access control functionality.
    links:
      - "Aggregation «componentof» → F3.1.2.13 Manage Inter-urban Traffic Strategies"  # {8F0DA6DD-0445-48bf-83BA-24CB078BD594} → {44E4B5FB-6CF5-40a0-9CE1-D676DB87CA84}
