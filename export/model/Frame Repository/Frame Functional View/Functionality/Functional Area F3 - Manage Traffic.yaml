    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to manage the store of Inter-urban Service Area Data.
      (2) The ability to ensure that all data sent to the store is stored in a coherent and logical manner and shall enable data to be read from the store as and when requested.
      (3) The ability to carry out these activities in such a way that they do not interfere with one another and that the integrity of the data being stored and read is preserved.
