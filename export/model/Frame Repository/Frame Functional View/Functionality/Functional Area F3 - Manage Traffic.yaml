    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to process the data collected from the car park entrances and exists to calculate the actual and historic car park occupancies.
      (2) The ability to translate the actual occupancy into the car park "status".
      (3) The ability for the translation to enable the functionality that outputs information about the car park occupancy to show either spaces or "state" according to the type of equipment that is available and/or the requirements of the Parking Operator.
