  - name: "F2.1.11 Manage eCall Messages"
    guid: "{89ADDE3A-4642-4d57-A89E-BFAE05F44CF1}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 6
    note: |
      This High-level Function shall enable eCall messages to be received from Vehicles and sent to the most appropriate Public Safety Answering Point (PSAP).  The most appropriate PSAP shall be determined by a combination of the nearest to the location from which the eCall message was sent, the availability status of each PSAP and the number of eCalls sent to each PSAP in the last period.  It shall also enable the communications links between Vehicles sending eCall messages and the PSAP's that received them to be kept open until processing of the eCall messages is complete.  It shall provide Facilities shall also be provided to enable a Communications Operator (a member of staff from the Network Operator) to maintain the list of available PSAP's and to display that list if needed.
