    guid: "{C982E490-F99F-42a0-BFE6-1F230467AB2C}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 1
    note: |
      This High-level Function shall include functionality for the processing of reports about accidents and incidents.  This includes managing the responses to eCall messages received from Vehicles and reports of accidents and incidents from other sources.  In managing the response to eCall messages, the Function will perform the role of a Public Safety Answering Point (PSAP)   It shall receive and analyse the reports so that it can classify accidents and incidents to enable the most appropriate responses to be provided.  It shall initiate these responses and manage the use of the required facilities, providing progress updates to the sources of the accident and incident reports.
