  - name: "F2.1.11.1 Manage eCall Message Transmission"
    guid: "{E3715257-281B-407c-BEC6-DE27BD1C0AAC}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive eCall messages being sent from Vehicles that are operating in the road network.
      (2) The ability to request other functionality to provide details of how to communicate with the most appropriate Public Safety Answering Point (PSAP) provider which can respond to and service the eCall message.
      (3) The ability to pass on the eCall message to the most appropriate PSAP once the details of how to connect to it have been provided.
      (4) The ability to keep the communication channel between the Host Vehicle and the PSAP open.
      (5) The ability to pass through eCall response messages from the PSAP to the Host Vehicle and to send reports of the status of the eCall message response to other functionality.
      (6) The ability to periodically communicate with all available PSAP's and to update their status depending on the availability that they each report.
      (7) If the connection with the Vehicle is lost the ability to request the previously used contact detains from the Manage PSAP Data Stores function.
