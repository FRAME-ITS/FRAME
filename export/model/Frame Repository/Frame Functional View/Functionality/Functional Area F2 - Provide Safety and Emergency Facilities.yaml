    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall manage the notification that a Vehicle has been stolen.  It shall take the data objects sent to it by the actual stolen vehicle and forward them to the Emergency Operator Terminator and Emergency System Terminator.  As part of the forwarding process, any re-formatting that is need to enable the data objects to be sent to either Terminator shall be performed.  Some form of alarm indication shall be provided by the Function to highlight the fact that a Vehicle has been stolen.  Similar action shall be taken when the vehicle stolen notification is cancelled by data objects received from the Vehicle.
    links:
