  - name: "F2.1 Manage Emergencies"
    guid: "{8B0A6367-E6D7-47e2-9086-81FB2C700C13}"
    type: "Activity"
    stereotype: "FRAME_High_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This High-level Function shall include all functionality related to the detection and reporting of accidents and incidents involving users of the road network and the responses to them provided by the Emergency Services.  It shall enable accidents and incidents to be managed so that the responses from the Emergency Services are provided in a timely manner, in an appropriate way and with the minimum of impact on other users of the road network.  Links to functionality in the Manage Traffic Functional Area shall be provided to enable traffic using the road network to be managed in a way that minimises disruption but enables the accidents and incidents to be dealt with in a timely way.
