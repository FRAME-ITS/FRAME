elements:
  - name: "F2. Provide Safety and Emergency Facilities"
    guid: "{06D291DE-AA10-4891-8C30-E42616CA8483}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Functional Area shall provide functionality that enables the Emergency Services to respond to incidents.  The Functions in this Area shall have links with the Manage Traffic Functional Area (F3) to enable the detection and reporting of incidents, the management of their impacts and the granting of priority to Emergency Vehicles, plus links with the Provide Support for Host Vehicle Systems Functional Area (F5) to enable eCall messages from Vehicles to be received, processed and responses sent back to the Vehicle.  It shall be possible for priority to be provided either locally at each controlled point on the road network, or as a "route" through the network.  There shall be links to the Provide Traveller Journey Assistance Functional Area (F6) to enable priority routes for Emergency Vehicles to be created.  In addition this Functional Area shall provide facilities to enable the theft of vehicles to be managed.
      
      Mnemonic: psef
