  - name: "F2.1.11.2 Manage PSAP Data Stores"
    guid: "{6409319D-AAE4-46c0-A424-EBA90DE58004}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to receive from the Manage eCall Message Detection function details of each eCall message that has been sent from Vehicles, including the location of the Vehicle at the time the message was sent.
      (2) The ability to access the store of  Public Safety Answering Point (PSAP) Operational Data to find the PSAP that is the most appropriate to respond to the eCall message.
      (3) The ability to extract the details of how to communicate with the most appropriate PSAP and send them back to the Manage eCall Message Detection function.
      (4) The ability to provide contact information for all PSAP's that have that information stored on request from the Manage eCall Message Detection function.
      (5) The ability to update the content of the store of PSAP Operational Data whenever such input is received from the Provide PSAP Data Operator Interface.
      (6) The ability to extract contact details for the Vehicle from which an eCall message has been received and load them into the store of PSAP eCall Session Data (D2.4).
      (7) The ability to update D2.4 every time a notification is received from the Manage eCall Message Detection function that response is received from the PSAP to an eCall message and to delete all records of the Vehicle and the messages that it has received, when the response is finished.
      (8) The ability to provide details of the current content of the store of PSAP Operational Data whenever a request is received from the Provide PSAP Data Operator Interface.
