  - name: "F2.1.2.1 Identify and Classify Emergencies"
    guid: "{0CE226C4-3FE8-48de-A914-6ADAD5CABBBA}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 0
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) The ability to collect incident notifications from a variety of sources.
      (2) The capability to filter and obtain associated information (e.g. location, cargo status, Vehicle identification, Traveller identification) to produce the data needed for the planning of the appropriate response from the Emergency Services.
      (3) The ability to provide an acknowledgement of incident notification to its source, e.g. from a Pedestrian and to follow this up with reports of progress with providing an appropriate response.
      (4) The ability to respond in a timely manner to requests for status updates from the eCall Message Management functionality
      (5) The ability to respond instantly to the receipt of eCall messages.
      (6) The ability to classify incidents and to provide data about them to other functionality so that the appropriate response can be planned and implemented and the appropriate traffic management action can be taken.
