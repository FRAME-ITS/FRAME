  - name: "F2.1.10 Accept Roadside Emergency Call"
    guid: "{C793F840-EF4D-433e-BE41-346972E00C28}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Function shall be capable of providing the following facilities:
      
      (1) Enable a Pedestrian to send an emergency call from a location that is at the roadside.
      (2) Provide the Pedestrian with the acknowledgement for the emergency call sent in (1).
      (3) Include suitable HMI's the Pedestrian at the roadside.
