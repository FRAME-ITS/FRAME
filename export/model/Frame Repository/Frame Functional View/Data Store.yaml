    note: |
      This Data Store shall be used within the Provide Security and Emergency Facilities Functional Area.  It shall contain information objects that provide details of each eCall message from Vehicles that are active at any instance in time.
      
      Each information object in the store shall contain the following data objects for each active eCall message:
      (1) identity (VIN) of Vehicle from which eCall message originated (character string - numbers and letters),
      (2) communication information for the Veihcle from which the eCall message originated (character string - numbers and letters),
      (3) time at which eCall message was received from the Vehicle (digits),
      (4) current status of eCall message handling (number)
      (5) name of PSAP to which eCall message was sent (character string),
      (6) identity of PSAP to which eCall was sent (number - optional),
      (7) communication information for the Public Safety Answering Point (PSAP) to which eCall was sent (character string - numbers and letters).
      
      Note that the functionality that manages this Data Store does not enable the Communications Operator or any other entity to access these information objects.  This is to protect the identity and communications information of the Vehicles from which eCall messages are being processed.
