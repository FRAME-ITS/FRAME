      This Data Store shall be used within the Provide Electronic Payments Facilities Functional Area.  It shall contain information objects that provide details of the tariffs of all the services available to the user.
      
      The information object for each tariff shall contain the following data objects:
      (1) Service ID (number),
      (2) Characteristics of the precise usage done, for example, duration of service usage, location, date, etc. (characters),
