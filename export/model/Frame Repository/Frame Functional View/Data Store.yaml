    note: |
      This Data Store shall be used within the Manage Public Transport Operations Functional Area.  It shall contain information objects that provide details of the fare schemes currently being operated for PT Journeys.
      
      The information objects in the Store for each fare scheme shall contain the following data objects:
      (1) Fare scheme ID (number),
      (2) Fare scheme name (characters),
      (3) Date when fare scheme expires (date string),
      (4) Time(s) of day when fare scheme operates (numbers defining hours and minutes),
      (5) Route ID(s) to which fare scheme applies (numbers),
      (6) Type(s) of PT Passenger to which fare scheme applies (characters).
      
      For each type of PT Passenger, the data objects shall be included to provide following fare information:
      (7) Range ID's of stop to which fare applies (numbers)
      (8) Numbers ID's of stops to which fare applies (numbers)
      
      There shall be one information object for each fare scheme, which shall have a unique ID.  It shall be possible for there to be several fare schemes for the same route to cover different times of day, days of the week, months, years, etc.
