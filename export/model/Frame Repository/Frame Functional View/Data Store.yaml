    note: |
      This Data Store shall be used within the Provide Traveller Journey Assistance Functional Area (F6). It shall contain information objects that provide details about the services provided by the PT operations plus the fares that will be charged, and shall be for use in planning the Traveller's trips.
      
      The information objects in the Store for PT services shall contain the following data objects:
      (1) ID (number),
