    note: |
      This Data Store shall contain information objects that provide details of the capabilities of the various Freight Vehicles that are available for use by the Freight Transport Operations Manager in the implementation of Freight Transport Execution Plans.  There shall be one information object for each Freight Vehicle and this information object shall comprise but not be limited to the following data objects:
      (1) vehicle identity - VIN (number),
      (2) type of vehicle, e.g. truck, tractor, trailer (characters),
      (3) carrying capacity - kg (number),
      (4) gross vehicle weight - kg (number),
      (5) loaded vehicle dimensions - length, height, width - cm (numbers),
      (6) on-board lifting unit available (yes/no)?
      (7) if yes, maximum load - kg (number).
      (8) type of load carried - packages, container, liquids, powders (characters),
      (9) if container, full size or half size (characters)?
      (10) currently available (yes/no)?
      (11) if no, when expected to be available (number),
      (12) type of fuel - petrol/diesel/electric/hybrid (characters).
