  - name: "D8.9 FTEP Implementation Record Data Store"
    guid: "{A886C1CB-2FF3-400f-9EAB-B92E4E47E15B}"
    type: "Object"
    stereotype: "FRAME_Datastore"
    status: "Proposed"
    version: "1.0"
    order: 53
    note: |
      This Data Store shall contain information objects that provide records of the way that each Freight Transport Execution Plan (FTEP) has been implemented.  There shall be one information object for each implementation of each FTEP, thus there will be a record of each implementation of each FTEP.  Each information object shall consist of the following data objects:
      (1) FTEP identity (number),
      (2) date FTEP implemented (number).
      (3) time FTEP implemented (number),
      (4) number of Freight Transport Load Item(s) (FTLI(s)) moved (number, must be 1 or more),
      (5) date of FTLI pick-up (number),
      (6) time of FTLI pick-up (number),
      (7) was pick-up on time (yes/no)?
      (8) if no, what was the reason for the delay (characters)?
      (9) date of FTLI delivery to requested destination (number),
      (10) time of FTLI delivery to requested destination (number),
      (11) was delivery on time (yes/no)?
      (12) if no, what was the reason for the delay (characters)?
      (13) where other modes of transport used (yes/no)?
      (14) if yes, were these the expected modes (yes/no)?
      (15) if no, what was the reason for the use of different other mode(s) of transport (characters)?
      (16) did the FTEP have to be modified (yes/no)?
      (17) if no, what was the reason for the modification (characters)?
      (18) were the traffic conditions on the road network as expected (yes/no)?
      (19) if no, what was different about the traffic conditions (characters)?
      (20) post implementation comments from the Freight Vehicle Driver (characters).
    links:
      - "Association «IN» → mffo_read_FTEP_implementation_record"  # {AF31A374-08A0-45c0-8A48-6858AE71E581} → {2B1A819E-E6DD-48fe-9481-6E520C3D1E54}
  - name: "D8.10 Freight Vehicle Capabilities Data Store"
