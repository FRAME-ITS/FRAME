    note: |
      This Data Store shall be used in the Manage Traffic Functional Area.  It shall contain information objects that provide various data that is to be used in modelling and simulating the traffic conditions in the road network managed by the System.
      
      Each information object in the Store shall contain the following data objects:
      (1) Road network data (data for a digital roadmap using a standard format, e.g. GDF)
      (2) Historic traffic data collected by other functionality in the System (numbers with dates)
      (3) Recent traffic data collected by other functionality in the System (numbers with dates)
      (4) Traffic management strategies in use when the traffic data was collected (characters and numbers)
      (5) Processed traffic data that shows the origin and destination of traffic flows (number and digital roadmap data)
      (6) Results from the simulation of traffic conditions in the road network managed by the System (numbers and digital roadmap data)
      
      The input data shall be provided by other functionality to the Manage Road Traffic Data Store Function.  It shall be possible for this data to be produced from collected data or from input provided by the Transport Planner through the Provide Traffic Simulation Operator Interface Function.
      
      It shall be possible for the results data identified above to show the forecast traffic conditions produced by traffic management strategies that were provided by the Transport Planner, or to be based on those used previously.  These strategies shall be stored in such a way that they can be associated with the results to which they are relevant.  It shall also be possible for car park space requirements to be included in the results.
    links:
