    note: |
      This Data Store shall be used within the Provide Support for Host Vehicle Services Functional Area.  It shall contain three information objects covering the Vehicle, the Driver and the traffic conditions.
      
      The information objects in the Store about the Vehicle shall contain the following data objects:
      (1) Vehicle ID (number - could be the VIN),
      (2) Type (characters),
      (3) Date (date string),
      (4) Time (numbers defining hours, minutes and seconds),
      (5) Location (characters and/or numbers, e.g. GPS/Galileo data),
      (6) Speed (number in kph or mph),
      (7) Acceleration (number),
      (8) Brakes applied (number or character indicating YES or NO),
      (9) Windscreen wipers on (number or character indicating YES or NO),
      (10) Lights on (number or character indicating YES or NO),
      (11) Outside temperature (number or character indicating YES or NO),
      (12) ABS operating (number or character indicating YES or NO),
      (13) ESP operating (number or character indicating YES or NO),
      (14) Driver command (character),
      (15) Date driver command input (date string),
      (16) Time driver command input (numbers defining hours, minutes and seconds as a minimum).
      
      The information objects in the Store about the Vehicle shall contain the following data objects:
      (17) Current status (characters),
      (18) Alcohol detected (number or character indicating YES or NO).
      
      The information objects in the Store about the Vehicle shall contain the following data objects:
      (19) Area in which Vehicle is operating (characters, e.g. nation, region, city, state, area names(s)),
      (20) Road network data (data for a digital roadmap using a standard format, e.g. GDF),
      (21) Traffic conditions:
          (21a) Flow (number in vehicles per hour),
          (21b) Speed (number in kph or mph),
          (21c) Headway (number in seconds).
      
      It shall be possible for the above data objects to be updated in real-time as the Vehicle moves through the road network.
