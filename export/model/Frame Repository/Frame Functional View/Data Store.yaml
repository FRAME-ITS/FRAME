      (8) If access control:
          (8a) ID of these systems (number),
          (8b) Result (user blocked / user passing through).
      (9) If other:
          (9a) Mage of violation (video image),
          (9b) Involved user ID (number),
          (9c) Involved vehicle ID (number),
          (9d) Data according to the type of violation (number and/or characters).
      (10) Prosecution:
          (10a) Date prosecution file sent (date string),
          (10b) Violation (characters),
          (10c) Prosecution recommendation (characters).
      
      The data objects must be stored in such a way that the privacy if the user (offender) is maintained according to the rules set out by the European Directives and national laws concerning data privacy.
