      This Data Store shall be used within the Provide Support for Law Enforcement Functional Area. It shall contain information objects that provide a record of all of the instructions sent to Vehicles that were acknowledged as having been displayed to Drivers.  The record of instructions will be used to determine whether or not a detected violation is genuine, or should be ignored because the Driver was only obeying instructions sent to the Vehicle.
      
      The information objects in the Store shall contain the following data objects:
      (1) Date when record created (date string),
      (2) Time when record created (numbers defining hours, minutes and seconds),
      (3) Vehicle ID in which the instruction was displayed (number),
      (4) Type of instruction (characters),
      (5) Instruction details (characters and/or numbers),
      (6) Date at which instruction acknowledgement received (date string),
      (7) Time at which instruction acknowledgement received (numbers defining hours, minutes and seconds),
      (8) ID(s) road segment(s) to which the instruction applies (numbers).
      
      It shall be possible for these data objects to be updated every time a new command is displayed to Drivers and for it to be removed after a suitable time period has elapsed since it was cancelled or replaced.
