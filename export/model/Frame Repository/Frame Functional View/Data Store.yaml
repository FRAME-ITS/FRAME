    note: |
      This Data Store shall be used within the Provide In-vehicle Trip Planning High-level Function.  It shall contain information objects that are the result of the process to create a Vehicle Trip Plan.
      
      The information objects in the Store shall contain the following objects:
      (1) Route ID (number),
      (2) Route name (characters),
      (3) Origin (characters and/or numbers, e.g. GPS/Galileo data),
      (4) Destination (characters and/or numbers, e.g. GPS/Galileo data),
      (5) Expected arrival time (numbers defining hours, minutes and seconds),
      (6) Vehicle type for route (characters),
      (7) Type of goods carried, if any (characters),
      (8) Route (data for a digital roadmap using a standard format, e.g. GDF, plus characters and/or numbers, e.g. GPS/Galileo data),
      (9) Rest zone:
          (9a) Rest zone ID (number),
          (9b) Name (characters),
          (9c) Location (characters and/or numbers, e.g. GPS/Galileo data),
          (9d) Booked start date (date string),
          (9e) Booked start time (numbers defining hours, minutes and seconds),
          (9f) Booked stay duration numbers defining hours, minutes and seconds),
      (10) Un/loading zone:
          (10a) Un/loading zone ID (number),
          (10b) Name (characters),
          (10c) Location (characters and/or numbers, e.g. GPS/Galileo data),
          (10d) Booked start date (date string),
          (10e) Booked start time (numbers defining hours, minutes and seconds),
          (10f) Booked stay duration (numbers defining hours, minutes and seconds),
      (11) Payments made:
          (11a) What for (characters)?
          (11b) Complete (number or character indicating YES or NO),
      (12) Oher relevant data (characters and/or numbers).
      
      It shall be possible for each information object to include data objects about more than one rest area and/or un/loading zone and for payments for use to be recorded against some or all of these, plus any pre-payment of road use charges.  The data objects in this Store shall be retained for the prime purpose of supporting the Diver during the implementation of the Trip Plan.  All the factors that were considered in production of the Trip Plan are included in the data objects described above.
