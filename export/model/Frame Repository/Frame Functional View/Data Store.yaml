    note: |
      This Data Store shall be used within the Manage Public Transport Operations Functional Area.  It shall contain information objects that are used in the preparation of travel plans involving vehicle sharing.  As a minimum the information objects shall be divided into the following two parts: Vehicle Sharer registration data and travel plan data.
      
      The Vehicle Sharer registration information objects in the Store shall contain the following data objects:
      (1) Vehicle Sharer ID (number),
      (2) Registration date (date string),
      (3) Contact details (text string),
      (4) Origin of journey (characters and/or numbers, e.g. GPS/Galileo data),
      (5) Destination of journey (characters and/or numbers, e.g. GPS/Galileo data),
      (6) Own Vehicle available for sharing (number or character indicating YES or NO),
      (7) Number of passengers to be carried in own Vehicle (number).
      
      The travel plan information objects in the Store shall contain the following data objects:
      (8) Travel Plan ID (number),
      (9) Date of creation (date string),
      (10) Origin (characters and/or numbers, e.g. GPS/Galileo data),
      (11) Final destination (characters and/or numbers, e.g. GPS/Galileo data),
      (12) Identities of Vehicle Sharers involved (numbers),
      (13) Locations at which Vehicle Sharers join/leave (characters and/or numbers, e.g. GPS/Galileo data),
      (14) Use of PT and other non-road based travel modes (characters),
      (14) Identities of participant Car Sharers (numbers).
      
      Access to the information objects in this Store shall be controlled so that it complies with the requirements of the relevant European Data Protection laws, directives and standards.
