      This Data Store shall be used within the Manage Public Transport Operations Functional Area.  It shall contain information objects that provide details of the fare credit that is currently available for use by the PT Passenger.
      
      The information objects in the Store for each PT Passenger's fare credit shall contain the following data objects:
      (1) Amount of credit (number)
      (2) Date of last top up (date string)
