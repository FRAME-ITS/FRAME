      Each information object in this Data Store shall represent a PT "fare card" in its simplest form and is intended to be implemented that it forms part of the physical objects that go with each PT Passenger.  It is expected that either there will not be any personal identification data relating to the "owning" PT Passenger, or such data will be provided by mechanisms that are outside the scope of the functionality provided by the FRAME Architecture.
