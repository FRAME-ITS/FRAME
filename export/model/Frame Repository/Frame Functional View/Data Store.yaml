    note: |
      This Data Store shall be used within the Manage Public Transport Operations Functional Area.  It shall contain information objects that are used to provide On-Demand Services and well as details of those Services that have actually been created and delivered.
      
      Each information object in the Store shall contain the following data objects:
      (1) Road network data (data for a digital roadmap using a standard format, e.g. GDF)
      (2) ID(s) of current PT services used (numbers)
      (3) ID(s) of current PT fare schemes used (numbers)
      (4) Information about services provided by other transport modes (characters)
      (5) Latest and predicted traffic conditions (characters)
      (6) Service details, comprising:
          (6a) Service ID (number)
          (6b) Origin (characters and/or numbers, e.g. GPS/Galileo data)
          (6c) Destination (characters and/or numbers, e.g. GPS/Galileo data)
          (6d) Departure date (date string)
          (6e) Departure time (numbers defining hours and minutes)
          (6f) Planned arrival date (date string)
          (6g) Planned arrival time (numbers defining hours and minutes)
          (6h) Stop ID's for pick-up (numbers)
          (6i) Stop ID's for set down (numbers)
          (6j) Planned time at stops (numbers defining hours and minutes)
          (6k) Type of vehicle required (characters)
      
      It shall be possible for each service to be deleted once it has been delivered.
