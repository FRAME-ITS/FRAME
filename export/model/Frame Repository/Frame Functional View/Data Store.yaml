      This Data Store shall be used within the Manage Traffic Functional Area.  It shall contain information objects that provide details about the environmental conditions within the geographic area managed by the System.  This data shall have been produced by Functions within the Area from inputs that they have received.
      
      Each information object in the Store shall contain the following data objects:
      (1) Date (date string),
      (2) Time (numbers defining hours, minutes and seconds),
      (3) Location (characters and/or numbers, e.g. GPS/Galileo data),
      (4) Temperature (number - in degrees Centigrade),
      (5) Humidity (number as a percentage),
      (6) Wind direction (up to five characters indicating compass points),
      (7) Wind speed (number in kph or mph),
      (8) Pollution levels (a set of numbers as percentages for different pollutants).
      
      The number of information objects shall be fixed by the number of times that samples are taken.  It shall be possible for the number and type of pollutants recorded to vary from one location to another and from one implementation to another.
