    note: |
      This Data Store shall be used within the Provide Security and Emergency Facilities Functional Area.  It shall contain information objects that provide details of all incident/alarm notifications (including mayday calls) that have been received by the functionality in this Area.  It is in two parts; un-processed and processed emergencies.
      
      Each information object in the Store for un-processed emergencies shall contain the following data objects:
      (1) Time (numbers defining hours, minutes and seconds),
      (2) Date (date string),
      (3) Incident location (characters and/or numbers, e.g. GPS/Galileo data),
      (4) Type of vehicle involved in the incident (characters),
      (5) Known status of each vehicle (characters),
      (6) Description of cargo (if any) carried by each vehicle (characters),
      (7) The number of people involved in the incident (number),
      (8) Health status of each person involved in the incident (characters),
      (() Any additional information relevant for emergency process (characters),
      (10) Definition of originator of the incident notification (characters),
      (11) System that was the source of the incident notification (characters.
      
      The data for processed emergencies held in the Store shall be structured in the following way:
      (12) A consolidated problem description comprising:
         (12a) Time (numbers defining hours, minutes and seconds),
         (12b) Location (characters and/or numbers, e.g. GPS/Galileo data),
         (12c) Type of vehicle involved in the incident (characters),
         (12d) Known status of each vehicle (characters),
         (12e) Description of cargo (if any) carried by each vehicle (characters),
         (12f) The number of people involved in the incident (number),
         (12g) Health status of each person involved in the incident (characters),
         (12h) Any additional information relevant for emergency process (characters),
         (12i) A list of all associated incidents (characters),
      (13) Description of planned actions comprising:
           (13a) The emergency services that will be involved in the action, (characters),
           (13b) Time when action will start (numbers defining hours, minutes and seconds),
           (13c) The number of vehicles involved (number),
           (13d) A description of the result of each action (characters),
           (13e) A list of progress reports for each action (characters).
      
      It shall be possible for there to be several vehicles involved in each incident (un-processed or processed), each with their own cargos and/or numbers of occupants.  Similarly it shall be possible for the number of people involved in the incident to be greater than the number of vehicle occupants if people outside the vehicles are involved in the incident.  It shall be possible for a vehicle to include a bicycle or a powered two wheeled (PTW) vehicle.
    links:
      - "Association «IN» → psef_read_emergency_data"  # {7166A4CA-C860-4c83-B2CB-80FD644B0DE3} → {B671FF18-2EDF-43d3-AE9C-8B867C0D6CA5}
  - name: "D2.3 PSAP Operational Data"
    guid: "{2B17BDE9-0C9F-4d89-AB56-0FFC17CA0791}"
    type: "Object"
    stereotype: "FRAME_Datastore"
    status: "Proposed"
    version: "1.0"
    order: 10
    note: |
      This Data Store shall be used within the Provide Security and Emergency Facilities Functional Area.  It shall contain information objects that provide details of each Public Service Access Point (PSAP) that is able to respond to eCall messages from Vehicles.
      
      Each information object in the store shall contain the following data objects:
      (1) PSAP name (character string),
      (2) PSAP identity (number - optional),
      (3) geographic location of the PSAP (co-ordinates),
      (4) geographic area from which the PSAP can respond to eCall messages (co-ordinates),
      (5) type(s) of service available from the PSAP,
      (6) communication information for the PSAP.
