    note: |
      This Data Store shall contain information objects that define each Freight Transport Execution Plan (FTEP) that is capable of being implemented by functionality in the system.  Each Freight Transport Execution Plan shall consist of one information object which shall comprise, but not be limited to, the following data objects:
      (1) FTEP identity (number),
      (2) date FTEP was originally created (number),
      (3) time FTEP was originally created (number),
      (4) number of modifications since first creation (number),
      (5) for each modification:
             (a) date FTEP was modified (number),
             (b) time FTEP was modified (number),
             (c) description of modification (characters),
      (6) number of Freight Transport Load Items (FTLI's) to be moved by this FTEP (number),
      (7) for each FTLI:
             (a) location of origin (number),
             (b) date to be collected (number),
             (c) time to be collected (number),
             (d) description of FTLI, e.g. liquid in its own container, liquid requiring a container, powder and hazardous designation (characters),
             (e) size of FTLI, l, w, h (numbers),
             (f) is FTLI to be considered an abnormal load (y/n),
             (g) location of destination (number),
             (h) expected date to be delivered to destination (number),
             (i) expected time to be delivered to destination (number),
             (j) location(s) of way point(s) on road based route to be followed (numbers),
             (k) other modes of transport to be used - blank if not required (characters),
             (l) location of Freight Terminal Area (FTA)  at which FTLI must be delivered from which it will be taken forward by other mode of transport (number),
             (m) expected date of delivery to FTA (number),
             (n) expected time of  delivery FTA (number),
             (o) location of FTA from which FTLI must be collected having been delivered by other mode of transport (number),
             (p) expected date of collection from FTA (number),
             (q) expected time of collection from FTA (number),
             (r) location(s) of way point(s) on road based route to be followed from FTA to destination (numbers)
             (s) any other special requirements (characters).
      (8) number of Freight Vehicles required to carry the FTLI(s) (number),
      (9) type(s) of Freight Vehicle required to carry the FTLI(s) (characters),
      (10) details of any relevant traffic management policies that apply to this FTEP (characters).
    links:
