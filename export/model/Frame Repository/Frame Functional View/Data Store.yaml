    note: |
      This Data Store shall be used within the Manage Traffic Functional Area. It shall contain information objects that provide the static data for the car parks that are accessed from the urban traffic road network managed by the System.
      
      Each information object in the Store shall contain the following data objects:
      (1) Car park location and/or name (characters),
      (2) Number of entrances (number),
      (3) Number of exits (number),
      (4) Total number of spaces (number),
      (5) Float to take account of vehicles searching for spaces (number),
      (6) Owner/operator ID (number),
      (7) Owner/operator contact information (characters and/or numbers (characters),
      (8) Charges (numbers - in currency),
      (9) Periods when they operate (time and date string),
      (10) Method of car park fee collection (characters),
      (11) Hours when operator present (time and date string),
      (12) Separate cycle spaces (number),
      (13) Separate motorcycle spaces (number),
      (14) Number of disabled spaces (number),
      (15) Display information in inter-urban area (character indicating YES or NO),
      (16) List of devices on which car park information is displayed with details about whether "state" or "spaces" is to be displayed (characters and/or numbers),
      (17) Thresholds for car park status change, e.g. number of occupied spaces for "almost full" status to be achieved (characters + numbers).
      
      It shall be possible for the Car Park State Calculation function to calculate the current state of the service area using the following "live" data objects:
      
      (18) Number of vehicles entered car park (number),
      (19) Number of vehicles that have left the car park (number),
      (20) Car park status, e.g. "almost full", "full", "spaces" and "closed" (characters).
      
      It shall be possible for these data objects to be replicated depending on the number of entrances and exits that a car park has and how the data that they collect is to be used.  For example it shall be possible for the car park area to have separate parking areas for different types of vehicle such as car, coaches and HGV's.
