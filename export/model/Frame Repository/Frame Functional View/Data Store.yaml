    note: |
      This Data Store shall be used within the Provide Traveller Journey Assistance Functional Area (F6).  It shall contain information objects that provided the personalised data needed to support the Traveller during all of their trips.  The support is provided both during the trip planning, as well as during the trip execution.  The Store is also used to prevent cumbersome and error prone repeated input of the same information by the Traveller.  It serves as a "memory" to assist the Traveller during the entire trip, for all travel modes, during every phase of the trip.
      
      The information objects in the Store shall contain the following data objects:
      (1) Traveller s ID (number),
      (2) Traveller driver licence ID (number or characters),
      (3) Traveller passport ID (number),
      (4) Traveller's preferred language (characters),
      (5) Traveller's disabilities (characters),
      (6) Other Traveller information relevant to trip planning (characters),
      (7) Traveller's payment information (characters and/or numbers),
      (8) Description of cargo to be carried on trip (characters),
      (9) Number of passengers expected in Vehicle (number),
      (10) Prime trip planning criterion (characters),
      (11) Default departure location (characters and/or numbers, e.g. GPS/Galileo data),
      (12) Default destination location (characters and/or numbers, e.g. GPS/Galileo data),
      (13) Level of detail desired of trip itinerary (characters),
      (14) Road toll payment method (characters),
      (15) Vehicle breakdown assistance information (characters),
      (16) Way of communication with Traveller while on-trip (characters + numbers),
      (17) Route guidance facilitation parameters (characters),
      (18) Preferred travel modes and classes (characters),
      (19) Preferred hotel(s)/chain(s) (characters),
      (20) Preferred car rental organisation(s) (characters).
      
      The information object for each Traveller must be kept separate with no possibility of inadvertent access to the information object by either another Traveller, or some form of un-authorised access.
    links:
      - "Association «IN» → ptja_read_GTP_data"  # {9ACA09DD-C059-49cd-9D34-9C2A5FF16575} → {4072B3F5-4D6B-4f01-AE87-1ECA97EFFF83}
