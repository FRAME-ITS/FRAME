    note: |
      This Data Store shall be used within the Provide Electronic Payments Facilities Functional Area.  It shall contain information objects that provide all the characteristics of the services that are available to the users (Travellers), including the nature of those services and the identities of the organisations that are providing them.
      
      The information objects for each service shall contain the following data objects:
      (1) Service ID (number),
      (2) Nature of service (characters),
      (3) ID of organisation providing the service (number),
      (4) Associated account, i.e. where the payment will go (characters and/or numbers),
      (5) Location of service, i.e. where the user can use it (characters, e.g. nation, region, city, state, area),
      (6) Types of contracts possible (characters),
      (7) Categories of people allowed to use this service (that is to pass a contract for it, regardless of access rights which are defined by regulating bodies) (characters),
      (8) Enforcement procedures (characters),
      (9) Modes of booking (characters),
      (10) Identification of tariffs (pointer to tariff data store) (numbers),
      (11) Rules of fee apportionment if several operators provide the same service (characters),
      (12) List of the ID's of services grouped for the apportionment (numbers).
      
      The information objects in the Store shall be organised so that data for each service is kept together.
