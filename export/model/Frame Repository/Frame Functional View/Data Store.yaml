    note: |
      This Data Store shall be used within the Manage Traffic Functional Area.  It shall contain information objects that provide traffic flow and other traffic related data for the urban road network.  The data in the Store shall be divided into two parts comprising, historic and current data.
      
      Each information object in the Store for historic and current data shall contain the following data objects:
      (1) Date (date string),
      (2) Time (numbers defining hours, minutes and seconds),
      (3) Location (characters and/or numbers, e.g. GPS/Galileo data),
      (4) Vehicle flow (number in vehicles per hour),
      (5) Vehicle speed (number in kph or mph),
      (6) Vehicle headway (number in seconds),
      (7) Road occupancy (number as a percentage),
      (8) Queue presence (number or character indicating YES or NO),
      (9) Vehicle count (number).
      
      There shall be one set of the above data for each location in the urban road network where some or all of the data shall have been obtained.  Within each set there shall be both current and historic data.
      
      The data in the Store for predicted data shall be structured in the following way:
      (10) Predicted date (date string),
      11) Predicted time (numbers defining hours, minutes and second),
      (12) Location (characters and/or numbers, e.g. GPS/Galileo data),
      (13) Vehicle flow (number in vehicles per hour),
      (14) Vehicle speed (number in kph or mph),
      (15) Vehicle headway (number in seconds),
      (16) Road occupancy (number as a percentage).
      
      There shall be three sets of predicted data, comprising short, medium and long term predictions.
      
      It shall be possible for the following items of data to also be included in the Data Store with the data for each segment of the urban road network, if extended floating car data is available for collection:
      
      (17) Rain present (number or character indicating YES or NO),
      (18) Temperature (number - in degrees Centigrade),
      (19) Log present (number or character indicating YES or NO),
      (20) Vehicle skidding (number or character indicating YES or NO),
      (21) Reduced visibility (number or character indicating YES or NO).
      
      In addition data shall be stored about each car park, comprising the following:
      (22) D ate (date string),
      (23) Time (numbers defining hours, minutes and seconds),
      (24) Car park identity (number),
      (25) Location (characters and/or numbers, e.g. GPS/Galileo data),
      (26)Car park status (number),
      (27) Car park occupancy (number as a percentage of the total number of spaces),
      (28) Number of available spaces (number).
