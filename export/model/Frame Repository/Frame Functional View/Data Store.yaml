    note: |
      This Data Store shall be used within the Provide Traveller Journey Assistance Functional Area (F6).  It shall contain data that is the result of the trip planning process.  This data is retained for the prime purpose of supporting the Traveller during the trip. The most notable requirement is to react to the consequences of perturbations in the situation(s) existing during trip planning.  All the considerations that resulted in production of the trip itinerary are included in this Data Store.
      
      The data in the Store shall be structured in the following way:
      (1) Traveller s ID (number),
      (2) Traveller's preferred language (characters),
      (3) Traveller's disabilities (characters),
      (4) Route (data for a digital roadmap using a standard format, e.g. GDF, plus characters and/or numbers, e.g. GPS/Galileo data),
      (5) Trip origin (characters and/or numbers, e.g. GPS/Galileo data),
      (6) Departure date (date string),
      (7) Departure time (numbers defining hours, minutes and seconds),
      (8) Way point:
          (8a) Location (characters and/or numbers, e.g. GPS/Galileo data),
          (8b) Expected arrival date (date string),
          (8c) Expected arrival time (numbers defining hours, minutes and seconds),
          (8d) Car park information (characters),
      (9) Trip destination (characters and/or numbers, e.g. GPS/Galileo data),
      (10 Expected arrival date (date string),
      (11) Expected arrival time (numbers defining hours, minutes and seconds),
      (12) Car park information (characters),
      (13) Description of cargo to be carried on trip (characters),
      (14) Number of passengers expected in Vehicle (number),
      (15) Hotel bookings completed (characters),
      (16) Hotel bookings still to be made (characters),
      (17) Car rental bookings completed (characters),
      (18) Car rental bookings still to be made (characters),
      (19) Other travel mode bookings completed (characters),
      (20) Other travel mode bookings still to be made (characters),
      (21) Vehicle breakdown assistance information (characters),
      (22) Way of communication with Traveller while on-trip (characters + numbers),
      (23) Route guidance facilitation parameters (characters),
      (24) Trip skeletons (see below).
      
      It shall be possible for there to be none, or more than one way point, plus hotel, car rental and other travel mode bookings.
      
      A special feature of the data in the Store to support the Traveller shall be the "trip skeleton", which shall be available for use in two ways:
      (a) as the start of the search for alternatives during trip planning,
      (b) as the fixed part of the trip if the trip has to be retained for future reuse.
      The core part of the "skeleton" shall be the origin-destination combination and a date and/or time for the start or the arrival and possibly a number of intermediate locations - see data to be stored above.  In both cases, trip preferences are part of the trip skeleton for trip planning purposes and it shall be possible to obtain these from the store of GTP data.
      
      The data for each Traveller must be kept separate with no possibility of inadvertent access to the data for one Traveller by either another Traveller, or some form of un-authorised access.
    links:
      - "Association «IN» → ptja_read_trip_plan_data"  # {0FC0FF2F-23EB-4822-9D66-5F2428211601} → {B4A6029E-BF65-4fa8-B23A-72772FFDCF91}
