    note: |
      This Data Store shall be used within the Provide Support for Cooperative Systems Functional Area.  It shall contain information objects that provide details about the use and characteristics of loading and unloading zones plus holding zones that are used by Freight Vehicles to pick-up and deliver goods.  The information objects for each zone shall be in two forms: static data and dynamic data
      
      The information object in the Store containing static data about each zone shall contain the following data objects:
      (1) Zone location (characters and/or numbers, e.g. GPS/Galileo data),
      (2) Zone size (number),
      (3) Type of goods that the zone can accommodate (characters),
      (4) Restrictions on use of the zone (characters),
      (5) Type(s) of Vehicle that the zone will accommodate (characters),
      (6) Number(s) of Vehicles of different types that can be accommodated (number),
      (7) Road network in and around zone (data for a digital roadmap using a standard format, e.g. GDF),
      (8) Zone entry point (characters and/or numbers, e.g. GPS/Galileo data),
      (9) Zone exit point (characters and/or numbers, e.g. GPS/Galileo data).
      
      This information object shall be repeated for each zone of each type.
      
      The information object in the Store containing dynamic data about each zone shall contain the following data objects:
      (10) Date when zone is booked (date string),
      (11) Time when zone is booked (numbers defining hours, minutes and seconds),
      (12) Number of Vehicles that have booked a place for date/time (number),
      (13) The ID of each Vehicle for each booking (number),
      (14) Expected duration of stay for each booked Vehicle (numbers defining hours, minutes and seconds),
      (15) The ID of the Vehicle currently occupying the zone (number).
      
      It shall be possible for the information objects containing dynamic data to be repeated for each booking of each type of zone and to be updated as soon as the data changes.
