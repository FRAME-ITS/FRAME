    note: |
      This Data Store shall be used within the Provide Support for Cooperative Systems Functional Area.  It shall contain information objects that are used to manage the use of the road network by Vehicles that are carrying Hazardous Goods.  There shall be two types of information objects: those for Hazardous Goods Vehicle criteria and those for Hazardous Goods Vehicle routes.
      
      The information objects in the Store for Hazardous Goods Vehicle Criteria shall contain the following data objects:
      (1) Type of hazardous goods (characters),
      (2) Areas to be avoided (characters, e.g. nation, region, city, state, historic sites, business districts, areas of outstanding natural beauty, areas protected for environmental reasons (names(s)),
      (3) Particular roads or road types that either must, or must not be used:
          (3a) Link ID (number),
          (3b) Road name (characters),
          (3c) To be used (number or character indicating YES or NO),
          (3d) To be avoided (number or character indicating YES or NO),
      (4) Bridges and tunnels that must be either avoided or used:
          (4a) Bridge/tunnel ID (number),
          (4b) Bridge/tunnel name (characters),
          (4c) To be used (number or character indicating YES or NO),
          (4d) To be avoided (number or character indicating YES or NO),
      (5) The use or avoidance of particular service areas or rest zones within service areas:
          (5a) Service/rest area ID (number),
          (5b) Service/rest area name (characters),
          (5c) To be used (number or character indicating YES or NO),
          (5d) To be avoided (number or character indicating YES or NO),
      (6) The use or avoidance of car parks:
          (6a) Car park ID (number),
          (6b) Car park name (characters),
          (6c) To be used (number or character indicating YES or NO),
          (6d) To be avoided (number or character indicating YES or NO),
      (7) When Vehicles carrying Hazardous Goods are allowed to travel:
          (7a) Cate (date string),
          (7b) Start time (numbers defining hours, minutes and seconds),
          (7c) End time (numbers defining hours, minutes and seconds).
      
      The information objects in the Store for Hazardous Goods Vehicle routes shall contain the following data objects:
      (8) Identifier (characters),
      (9) Type of hazardous goods (characters),
      (10) Vehicle type (characters),
      (11) Route (data for a digital roadmap using a standard format, e.g. GDF, plus characters and/or numbers, e.g. GPS/Galileo data),
      (12) Date last used (date string),
      (13) Time last used (numbers defining hours, minutes and seconds),
      (14) Currently in use (number or character indicating YES or NO).
