    note: |
      This Data Store shall be used within the Manage Public Transport Operations Functional Area.  It shall contain information objects that provide a record of the delivery of On-Demand Services.  As a minimum the information objects can be divided into two parts: about the Vehicles used to provide the On-Demand Services and a record of previous services.
      
      Each information object about the Vehicles used to provide the On-Demand Services in the Store shall contain the following data objects:
      (1) Time (numbers defining hours, minutes and seconds),
      (2) Date (date string),
      (3) Vehicle ID (number),
      (4) Vehicle type (characters),
      (5) Current status (characters),
      (6) Current location (characters and/or numbers, e.g. GPS/Galileo data),
      (7) ID of Service currently being delivered (number).
      
      The information objects in the Store that provide a record of previous services shall contain the following data objects:
      (8) Service ID (number),
      (9) Origin (characters and/or numbers, e.g. GPS/Galileo data),
      (10) Destination (characters and/or numbers, e.g. GPS/Galileo data),
      (11) Route (data for a digital roadmap using a standard format, e.g. GDF, plus characters and/or numbers, e.g. GPS/Galileo data),
      (12) Date of delivery (date string),
      (13) Time of delivery (numbers defining hours and minutes),
      (14) Performance, e.g. stops at which on-time, early or late (text/numbers).
      
      It shall be possible for the Vehicle data to be accumulated for each Vehicle to provide a historic record of its use.  Also it shall be possible for the record of previous Services data to be maintained in perpetuity to provide a source of information for the On-demand Service Operator.
