          (6b) Frequency (numbers defining hours and minutes),
      (7) Variations to the service (characters).
      
      A separate information object shall be provided in the Store for each type of day on which the service operates, e.g. weekday (Monday to Friday), weekend (Saturday and/or Sunday), religious holidays (including Sundays) and other public holidays.  The "variations to the service" shall be used to indicate different service operations that can be applied due to schools being on holiday, factories shut down due to holidays and other regular events that occur during specific time periods on certain types of day.
