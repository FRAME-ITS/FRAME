      (7) Variations to the service (characters).
      
      The information objects in the Store for PT service fares shall contain the following data objects:
      (8) Fare scheme ID (number),
      (9) Fare scheme name (characters),
      (10) Date when fare scheme expires (date string),
      (11) Time(s) of day when fare scheme operates (numbers defining hours and minutes),
      (12) Route ID(s) to which fare scheme applies (numbers),
      (13) Type(s) of PT Passenger to which fare scheme applies (characters).
      
      For each type of PT Passenger, the following data objects containing fare information shall be provided:
      (14) Range ID's of stop to which fare applies (numbers),
      (15) Numbers ID's of stops to which fare applies (numbers).
      
      The above data objects shall be provided by functionality in the Manage Public Transport Operations Functional Area and shall be updated every time a change is made.
