    note: |
      This Data Store shall be used within the Manage Traffic Functional Area.  It shall contain information objects that provide the static data for the urban traffic road network managed by the System.  The static data covers the actual layout and configuration of the urban road network.
      
      Each information object in the Store shall contain the following data objects:
      (1) Road type (numbers and characters),
      (2) Type of data (numbers and characters),
      (3) Link:
            (3a) ID (number),
            (3b) Type (characters),
            (3c) Start location (characters and/or numbers, e.g. GPS/Galileo data),
            (3d) End location (characters and/or numbers, e.g. GPS/Galileo data),
            (3e) Length (number),
            (3f) Number of lanes/carriageways (number),
            (3g) Lane/carriageway width(s) (number(s)),
            (3h) Bus lane present indicator (number or character indicating YES or NO),
            (3i) Vehicle type usage restrictions (numbers and characters),
            (3j) Vehicle parking restrictions (numbers and characters),
            (3k) Speed limit(s) (numbers in kph or mph),
            (3l) Presence of other objects, e.g. tunnels/bridges (numbers and characters),
            (3m) Obstructions, e.g. narrow road/lanes, bridges/tunnels giving low clearance, bridges with weight restrictions (characters),
      (4) Junction:
             (4a) ID (number),
             (4b) Type (characters) - location (characters and/or numbers, e.g. GPS/Galileo data),
             (4c) Equipment installed (numbers and characters):
                    (4ca) ID (number),
                    (4cb) Type (characters),
                    (4cc) Configuration (phases/durations/turning movements) (numbers and characters),
                    (4cd) Available methods of management (numbers and characters),
                   (4ce) PT Vehicle priority available (number or character indicating YES or NO),
                   (4cf) Non-available vehicle movements (numbers and characters),
                   (4cg) Next up-stream junction (numbers and characters),
                   (4ch) Next down-stream junction (numbers and characters),
      (5) Date of last update (date string).
      
      These data objects shall be used by a variety of Functions to enable traffic in the urban network to be managed.  It shall also be provided to functionality in the Manage Public Transport Operations Functional Area so that its service routes and schedules can be planned.  It shall be possible for some of the data objects to also be provided to Vehicles to enable driver guidance and information to be provided.
    links:
