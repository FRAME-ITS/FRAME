elements:
  - name: "From Ambient Environment"
    guid: "{B96F4097-D81A-4e3e-96D1-4DC740D9554A}"
    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Ambient Environment from which data objects are created to provide data about the environment.  This data may be general and apply to the geographic area served by the System, or be from individual points at or near locations in the road network.
    links:
      - "Association «OUT» → System"  # {49CF3AC7-1CD0-4ae8-8E36-7D6B87795CE8} → {A7365472-4893-4994-9241-EEED83ABEF7D}
  - name: "From Bridge/Tunnel Infrastructure"
    guid: "{354AB6DD-08A8-447e-85E0-07BAA6810B94}"
    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Bridge/Tunnel Infrastructure from which data objects are created to provide data about the operation of services in bridges and tunnels.  This data is used to determine whether or not the use of bridge(s) needs to be restricted to some or all vehicles and the state of tunnels according to the specialist systems that manage them.
    links:
      - "Association «OUT» → F3. Manage Traffic"  # {A1957282-2D89-46a5-AB4C-1E7BEAFF5163} → {E9EDA059-38C0-41ba-9127-FF30B58B7C0D}
