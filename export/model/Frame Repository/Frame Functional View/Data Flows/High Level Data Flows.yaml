    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Vehicle from which data objects are created to provide data from the vehicle such as its identity or an indication of its presence at a particular point in the road network.
    links:
      - "Association «OUT» → System"  # {0075F47C-7FA5-406a-AD48-B908F3373967} → {A7365472-4893-4994-9241-EEED83ABEF7D}
