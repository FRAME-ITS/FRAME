    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Driver from which data objects are created to provide the response to requests and/or instructions from the System or as unsolicited input.  It includes inputs from Drivers of all types of vehicles that are recognised by the System.
    links:
      - "Association «OUT» → System"  # {56CCD2EA-327C-48f9-A162-94E6D271310B} → {A7365472-4893-4994-9241-EEED83ABEF7D}
