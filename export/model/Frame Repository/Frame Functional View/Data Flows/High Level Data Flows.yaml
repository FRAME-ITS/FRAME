    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains data objects created by functionality in the system for output to the Driver.  The data objects may consist of either instructions to take actions, or guidance as part of the implementation of a trip plan, or responses to requests for information and other inputs.
    links:
      - "Association «OUT» → Driver"  # {3ED577ED-ED62-4bfc-A6BD-83A400EACACE} → {0C560BF0-702E-48c1-B7F0-69F55BF03556}
