    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Transport Planner from which data objects are created to provide either requests for information about the management and/or state of traffic flow in the road network, or updates to data that defines how the road network is structured, or parameters for use in the simulation of the effects of various levels of traffic flowing in the road network.
    links:
