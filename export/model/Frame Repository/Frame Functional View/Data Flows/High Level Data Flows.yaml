    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Road Pavement from which data objects are created to provide data that represents the condition of the pavement, plus guidance or location information that can be derived from the pavement itself.
