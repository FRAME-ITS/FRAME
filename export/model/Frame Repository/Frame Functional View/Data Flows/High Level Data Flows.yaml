    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains data objects created by functionality in the system for output to the Bridge and Tunnel Infrastructure, which consists of entities that are responsible for the operation and management of bridges and tunnels in the road network.
    links:
      - "Association «OUT» → Bridge/Tunnel Infrastructure"  # {359B0DD3-EBAC-426d-98C0-6E40DAAB26F0} → {238D1096-B655-4900-BF9D-2B03E46D0D25}
