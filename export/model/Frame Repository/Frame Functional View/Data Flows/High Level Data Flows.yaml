    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Traveller from which data objects are created to provide requests access to the services provided by the System or as part of a dialogue with functionality in the System about the provision of services such as trip planning.
    links:
