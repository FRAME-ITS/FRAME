    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Vehicle Environment from which data objects are created to provide data about the presence and trajectory of objects in the geographic area immediately surrounding the Vehicle.
