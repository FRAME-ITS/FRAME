    guid: "{B013B1F3-2D52-4109-BA31-E746309E687D}"
    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    note: |
      This data flow only appears in the Context Diagram and contains input from the Weather Systems from which data objects are created to provide current and forecast weather conditions for the geographic area served by the System.
    links:
      - "Association «OUT» → System"  # {9E923981-08A7-47b7-AA8C-4B34F93B8F37} → {A7365472-4893-4994-9241-EEED83ABEF7D}
