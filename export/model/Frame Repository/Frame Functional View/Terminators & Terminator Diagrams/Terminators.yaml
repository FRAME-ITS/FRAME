  - name: "Bridge Structures"
    guid: "{6CA6C058-CE68-4263-8055-3A8779F0C1F9}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the Bridge / Tunnel Infrastructure Terminator and shall represent the output provided by sensors that can detect changes in the structure of a bridge or external systems able to provide the same or similar outputs.  These outputs shall be analysed by functionality in the system to create data objects that enable changes in the status of the bridge to be monitored.  In particular if that status reaches a point where it becomes dangerous for vehicles, pedestrians and cyclists to continue to use the bridge the appropriate action can be taken by functionality in the system.  The functionality in the system must also be able to communicate with more than one sensor and/or external system.
      
      Mnemonic: bti.bs
    links:
      - "Aggregation «component of» → Bridge/Tunnel Infrastructure"  # {D63FF626-0273-408a-BFBA-3DE5BF17F91A} → {238D1096-B655-4900-BF9D-2B03E46D0D25}
