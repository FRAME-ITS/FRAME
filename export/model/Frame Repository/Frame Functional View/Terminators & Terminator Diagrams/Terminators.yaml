  - name: "Bridge/Tunnel Infrastructure"
    guid: "{238D1096-B655-4900-BF9D-2B03E46D0D25}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "bti"
    status: "Proposed"
    version: "5.0"
    order: 3
    note: |
      This Terminator shall represent the output from sensors and/or external systems that can detect the physical conditions of Bridges and Tunnels. It shall consist of the following Terminators that represent the different versions of it:
      
      Bridge Structures
      Tunnel Management System
      
      The conditions that these Terminators can detect shall comprise such things as the status of the bridge or tunnel infrastructure and atmospheric conditions on the bridge or in the tunnel.  The output from the sensors that detect these conditions shall be monitored by functionality in the system that creates data objects to represent these conditions.  The functionality in the system must also be able to communicate with more than one sensor and/or external systems that may be monitoring any combination of Bridges and Tunnels.
      
      Mnemonic: bti
    links:
      - "Association «IN» → From Bridge/Tunnel Infrastructure"  # {EF6061D1-89CA-4252-8F15-B454F8C2D144} → {354AB6DD-08A8-447e-85E0-07BAA6810B94}
