  - name: "Cyclist"
    guid: "{24E1AB68-5084-447c-9BF3-1957840F0FA8}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the Traveller Terminator and shall represent a human entity that is using the functionality in the system to help them travel through the road network using a bicycle, tricycle, scooter or similar mode of transport.  It is expected that the Terminator shall provide inputs from which data objects shall be generated by functionality in the system to represent requests and data for use by in the system.  The Terminator shall also be expected to be capable of translating into human readable form data objects output from the functionality in the system and responding to that output if required.
      
      Mnemonic: t.c
    links:
      - "Aggregation «component of» → Traveller"  # {6DCC6D3C-5960-480c-AC31-4C56E27818FD} → {5F83A087-8531-4855-A274-F88A8ACBBAF0}
  - name: "Driver and Vehicle Information Provider"
    guid: "{AA6E7062-3E5F-4b53-BD48-A6831CEEF612}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the External Service Provider Terminator and shall represent an organisation that manages information about Drivers and Vehicles.  It shall provide data objects containing Vehicle identification to assist the functionality that checks raw Floating Card Data (FCD).  The Terminator shall also provide data objects containing Driver and Vehicle identification to assist the functionality that provides incident responses in response to a request from that functionality.  All data objects provided by this Terminator must comply with the requirements of the General Data Protection Regulation (GDPR - EU2016/679 and any subsequent amendments).
      
      Mnemonic: esp.dvip
    links:
      - "Aggregation «component of» → External Service Provider"  # {818FB35C-CA8D-429a-BCE5-316A42487CBE} → {73960376-E008-4811-B5BB-B58A1E143730}
