      This Terminator is part of the Traveller Terminator and shall represent a human entity that is using the functionality in the system to help them complete some or their entire trip using an On-Demand Service Vehicle, e.g. a “van based” vehicle that does not use a fixed route and can only carry a small number of passengers.  It is expected that the Terminator shall provide inputs from which data objects can be generated by functionality in the system to represent requests and data for use by in the system.  The Terminator is also expected to be capable of translating into human readable form data objects output from the functionality in the system and responding to that output if required.
      .
