    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    order: 0
    note: |
      The generic terminator role of the NAP Content Provider represents any provider of traffic and transport data.
      The NAP Content Provider describes traffic and transport data with meta-data on the NAP (to be stored in D3.15 NAP Meta-Data). Information about the Content Provider, such as contact details, shall be kept in D3.17 NAP Content Providers.
      Content Providers are public and private road operators, road authorities, service providers, transport authorities, transport operators, infrastructure managers, and transport on-demand service providers. The obligations to make traffic and transport data accessible via the NAP mainly depend on the type of data according to the ITS Directive and its respective delegated regulations (see Content Provider Actor)
      
      Key issue: Provide and publish content (which the content provider has the legal rights to publish); collect content
      Area of responsibility: Provide timely and accurate traffic and transport data
      Tasks: Provide content relevant to the ITS domain and according to contracts with the NAP and content consumers
      Mnemonic: nap.cp
