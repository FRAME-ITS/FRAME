  - name: "Multi-Modal System"
    guid: "{05CAA29F-450A-4dcf-8141-059421D3CB54}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "mms"
    status: "Proposed"
    version: "5.0"
    order: 11
    note: |
      This Terminator shall represent systems and equipment that manage the transportation of Travellers and Freight by modes other than those that are road based.  It shall consist of the following Terminators:
      
      Multi-Modal Crossing
      Multi-Modal Management System
      Other Mode Freight System
      
      These Terminators shall be able to exchange data objects with functionality in the system to enable multi-modal trips to be planned and implemented for both Travellers and Freight.  In some instances the other modes shall be able to exchange "control" information so that for example, a bridge can be left open to road traffic for the passage of an Emergency Vehicle.
      
      Mnemonic: mms
    links:
      - "Association «IN» → From Multi-Modal System"  # {0BD55055-8BD6-47de-8340-1B1D8D21A63B} → {4E4D632B-D78C-4196-BEAF-D829B099E7AF}
