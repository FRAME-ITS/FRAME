    stereotype: "FRAME_Terminator"
    alias: "ors"
    status: "Proposed"
    version: "5.0"
    order: 14
    note: |
      This Terminator shall represent other instances of different functionality that is included in parts of the system. Each different instance shall be represented by the following Terminators:
      
      Emergency Management System
      Environmental Traffic Management System
      Hazardous Goods Vehicle Route Monitoring
      Incident Traffic Management System
      Inter-urban Traffic Management System
      Other Navigation Device
      Public Transport Management System
      Public Transport Stop
      Traffic Signal Controller
      Traffic Simulation System
      Urban Traffic Management System
      
      These Terminators shall enable the same data objects to be sent to and received from other instances of the functionality that they each represent.  These other instances may serve other geographic areas, or be managed and operated by different organisations serving the same geographic area.  It shall be possible for the data objects to be sent and received on request, at regular intervals, or because the sending functionality has made changes.
      
      Mnemonic: ors
