  - name: "Environmental Traffic Management System"
    guid: "{4161C8A8-655A-407a-B22F-A02DCF9CB7AB}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the Other Related System Terminator and shall represent another instance of the functionality in the system that manages the interaction between the environment and the traffic using the road network.  It shall enable the same data objects to be sent to and received from other instances of the environmental management functionality.  These other instances may belong to another organisation operating in the same geographic area, or to an organisation that manages the interaction between the environment and the traffic using the road network in a different geographic area.  It shall be possible for the data objects to be sent and received on request, at regular intervals, or because the sending functionality has made changes.
      
      Mnemonic: ors.etms
    links:
      - "Aggregation «component of» → Other Related System"  # {ABEF60C2-DCA2-4341-AD76-9946EE8E1787} → {AB919AF2-B1C5-45bf-8731-FB6EC44C2A2E}
      - "Association «IN» → fors.etms-environmental_data_updates"  # {C779178D-546C-4d16-ACB1-F28D495C0CAA} → {03327867-84D1-4aa1-B6E7-766445F5AF1C}
  - name: "Freight Terminal Area"
    guid: "{4635FD01-0425-4d5c-953B-2C06153158FB}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Terminator is part of the Freight Transport Terminator and shall represent the systems that provide the facilities which are available at a Freight Terminal Area.  It shall be possible to book the use of these facilities for use by one or more of the Freight Transport Load Items being moved through the implementation of a Freight Transport Execution Plan.  These facilities shall comprise, but not be limited to, the ability to store Freight Transport Load Items either to await collection by another mode of transport, or for collection by a Freight Vehicle for a road based movement.
      
      Mnemonic: ft.fta
    links:
      - "Aggregation «component of» → Freight Transport"  # {14B685B5-5950-49c7-8935-55C3745C65C5} → {662CD0E2-2FF1-4cc1-9FAC-D2280761477E}
  - name: "Freight Transport Operations Manager"
    guid: "{C7318974-F99A-4b00-B67C-EAD17D30AE73}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Terminator is part of the Freight Transport Terminator and shall represent a human entity that manages and represents the Freight Transport Service Provider.  It shall be possible for this Terminator to negotiate contracts to provide freight transport in response to requests from the Freight Transport User, who is the customer.  The provision of the freight transport shall be manifest through a Freight Transport Execution Plan, which is prepared by the system in response to a request from the Freight Transport Operations Manager to fulfil the demands of the Freight Transport User.  The preparation process shall be managed by the Freight Transport Operations Manager and once created the Freight Transport Execution Plan must be approved by the Freight Transport User before being implemented.  The implementation of the Freight Transport Execution Plan shall be managed and monitored by the Freight Transport Operations Manager, who if necessary shall be able to modify a Plan during its implementation.
      
      Mnemonic: ft.ftom
    links:
      - "Aggregation «component of» → Freight Transport"  # {419A6E3C-2C01-4577-96AB-87F5190440A4} → {662CD0E2-2FF1-4cc1-9FAC-D2280761477E}
  - name: "Freight Transport User"
    guid: "{5F15D024-DF71-46ba-B5E3-D62C2AFD543C}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      This Terminator is part of the Freight Transport Terminator and shall represent a human entity that wishes to transport one or more items of freight (called Freight Transport Load Items) using the available Freight Transport Services.  It shall be possible for the Freight Transport User to request the Freight Transport Operations Manager to prepare a Freight Transport Execution Plan the implementation of which shall enable the Freight Transport Load Items to be moved from one location to another as specified by the Freight Transport User.  When a Freight Transport Execution Plan has been prepared, the Freight Transport User shall have to approve the content of the Plan before it can be implemented by the system.  The Freight Transport User is able to request updates about the progress with the implementation of the Freight Transport Execution Plan.
      
      Mnemonic: ft.ftu
    links:
      - "Aggregation «component of» → Freight Transport"  # {B0E4098E-B109-4a05-AE18-37089E3B70C1} → {662CD0E2-2FF1-4cc1-9FAC-D2280761477E}
      - "Association «IN» → fft.ftu-new_FTEP_request"  # {F27FE243-F857-4bc4-A22A-964761F68DDF} → {997ED10C-2392-4730-BBB0-B278557831D1}
      - "Association «IN» → fft.ftu-request_FTEP_data"  # {7DA18E26-1CD3-4e89-9B26-63B51D4011FE} → {80CC94D5-A9D6-4fc4-BE29-FE10373587F9}
  - name: "Freight Vehicle"
    guid: "{F67CE7E2-605C-40db-92D7-7BDD6C6D69D3}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the Vehicle Terminator and shall represent a Vehicle that is designed and licensed for the purpose of carrying freight of any kind.  This type of Vehicle shall include those with and without trailers or "swap bodies", but not include light vans as these are classed as ordinary vehicles.  It is expected that this Terminator shall provide data objects to the functionality in the system either directly through an interface or through sensors, and these data objects shall be used to assist in providing the ITS Services.
      
      Mnemonic: v.fv
    links:
      - "Aggregation «component of» → Vehicle"  # {BF85EA44-00F7-4a0a-86DD-55C0AD0B863C} → {9021465A-4479-4fa8-B8DB-3481C001B9C3}
