  - name: "Vehicle"
    guid: "{9021465A-4479-4fa8-B8DB-3481C001B9C3}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "v"
    status: "Proposed"
    version: "5.0"
    order: 20
    note: |
      This Terminator shall represent the part(s) of the Vehicle that shall need to be involved in the delivery of the ITS Services provided by functionality in the system.  In addition to the systems in the Vehicles themselves there are several different types of Vehicle that shall contribute in different ways to the provision of ITS Services. The systems in the Vehicle and each type of Vehicle shall be represented by the following Terminators:
      
      Freight Vehicle
      Hazardous Goods Vehicle
      On-Demand Service Vehicle
      Other Vehicle
      Public Transport Vehicle
      Vehicle Systems
      
      It is expected that each of these Terminators shall provide data objects to the functionality in the system either directly through an interface or through sensors, and these data objects shall be used to provide the ITS Services.  In addition, the Terminators shall be sent data objects through an interface by functionality in the system that requests the Vehicle systems to take some action.  Note that this shall be a "request" and not a command, as it shall not be possible for the Vehicle to be controlled by the functionality in the system.
      
      Mnemonic: v
    links:
      - "Association «IN» → From Vehicle"  # {246D20A8-AA39-48cc-8933-E5EA0717B93C} → {8091A438-AC1B-4ead-9BF4-76F8FF5E4D94}
