  - name: "Emergency Systems"
    guid: "{751D27AE-0A31-4d65-824C-F9AA0608D1BF}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "es"
    status: "Proposed"
    version: "5.0"
    order: 5
    note: |
      This Terminator shall represent systems that are used by the Emergency Services as part of their operations.  The term Emergency Services is assumed to include organisations that are responsible for services such as fire, police, ambulance and vehicle recovery.  They are expected be able to co-ordinate their activities amongst themselves and dispatch and control the activities of their vehicles and personnel when they respond to incidents.  The Emergency Systems shall be sent data objects by functionality in the system containing information about emergencies that it has detected.  In return the Emergency Systems are expected to provide data objects containing reports on progress in dealing with these incidents so that any traffic and travel management strategies imposed by functionality in the system to mitigate the impact of the incidents can be updated.  The Emergency Systems are also expected to provide details of incidents affecting road transportation that are reported directly to them.
      
      Mnemonic: es
    links:
