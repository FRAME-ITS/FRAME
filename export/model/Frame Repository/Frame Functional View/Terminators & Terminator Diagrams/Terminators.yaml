  - name: "Traveller"
    guid: "{5F83A087-8531-4855-A274-F88A8ACBBAF0}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "t"
    status: "Proposed"
    version: "5.0"
    order: 19
    note: |
      This Terminator shall represent the roles of a human entity that uses (or is about to use) ITS Services provided by functionality in the system.  It shall be possible for the human entity this Terminator represents to switch between several roles during their use the ITS Services provided by the functionality in the system.  Each role shall be represented by one of the following Terminators:
      
      Cyclist
      On-Demand Service Passenger
      Pedestrian
      Pre-Trip Traveller
      Public Transport Passenger
      Static Traveller
      Vehicle Sharer
      
      It is expected that each Terminator shall provide inputs from which data objects can be generated by functionality in the system to represent requests and data for use by in the system.  Each Terminator is also expected to be capable of translating into human readable form the data objects output from the functionality in the system and responding to that output if required.
      
      Mnemonic: t
