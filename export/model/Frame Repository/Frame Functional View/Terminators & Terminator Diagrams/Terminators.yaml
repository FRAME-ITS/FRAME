elements:
  - name: "Bookable Service Provider"
    guid: "{B20814C3-91DB-43f3-9F58-BCBE50FB1ABD}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the External Service Provider Terminator and shall represent a form of External Service Provider that provides information about services such as accommodation, leisure and sports events for which a booking is needed for attendance.  Functionality in the system shall be able to send this Terminator data objects that request particular information be provided.  The data objects received in response by the functionality shall be used in the provision of ITS Services.  Any booking and/or payment for services about which information has been provided are expected to be carried out by functionality not included within the system.
      
      Mnemonic: esp.bsp
    links:
      - "Aggregation «component of» → External Service Provider"  # {3796D12A-BCA9-4158-9478-9E85EBFC67DE} → {73960376-E008-4811-B5BB-B58A1E143730}
