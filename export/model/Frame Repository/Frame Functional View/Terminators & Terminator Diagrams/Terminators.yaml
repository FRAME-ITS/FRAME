  - name: "NAP Actors"
    guid: "{FAF5089D-CEC9-4fac-A49D-D18F6E0ADC95}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "nap"
    status: "Proposed"
    version: "5.0"
    order: 12
    note: |
      This Terminator shall represent the actors that are involved in the National Access Point (NAP) ITS Service.  This ITS Service provides a mechanism that enables organisations to be provided with the means to access data available from other ITS Services.  It shall consist of the following Terminators;
      
      NAP Content Provider
      NAP Content Consumer
      
      The first of these Terminators provides the "means" in the form of Internet addresses from which the second of these Terminators can extract data objects about ITS Services that are available in their geographic areas.  These data objects shall initial comprise such things as traffic flow data and speeds, but may be expanded at a later date to include data objects relating to other ITS Services.
      
      Mnemonic: nap
    links:
      - "Association «IN» → From NAP Actors"  # {9C98D9A3-97BF-4db3-97A9-830FB08DAF17} → {59087751-DC42-4fcc-AA52-7330F931BC0E}
