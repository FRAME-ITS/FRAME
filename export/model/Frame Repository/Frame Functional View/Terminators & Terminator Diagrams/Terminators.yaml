  - name: "Emergency Management System"
    guid: "{D587C88C-5E83-4466-8537-3E05E9260E50}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    status: "Proposed"
    version: "5.1"
    order: 0
    note: |
      This Terminator is part of the Other Related System Terminator and shall represent another instance of the functionality in the system that manages the responses to incidents.  It shall enable the same data objects to be sent to and received from other instances of the incident management functionality.  These other instances may belong to another organisation operating in the same geographic area, or to an organisation that manages accident responses in a different geographic area.  It shall be possible for the data objects to be sent and received on request, at regular intervals, or because the sending functionality has made changes.
      
      Mnemonic: ors.ems
