  - name: "Operator"
    guid: "{102BBDF5-FF2D-4077-AD52-BEE0EA237E1C}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "o"
    status: "Proposed"
    version: "5.0"
    order: 13
    note: |
      This Terminator shall represent a diverse set of human entities that can perform privileged interactions with functionality in the system to manage the way it operates.  Each of the human entities shall be represented by one of the following Terminators:
      
      Bridge Operator
      Emergency Operator
      Fleet Operator
      Freight Management Operator
      On-Demand Service Operator
      Parking Operator
      Public Transport Operator
      Road Maintenance Operator
      Road Network Operator
      Traveller Information Operator
      Tunnel Operator
      Un/Loading Zone Operator
      
      It is expected that each Terminator shall provide inputs from which data objects can be generated by functionality in the system to represent requests and data for use by in the system.  Each Terminator is also expected to be capable of translating into human readable form data objects output from the functionality in the system and responding to that output if required.
      
      Mnemonic: o
    links:
