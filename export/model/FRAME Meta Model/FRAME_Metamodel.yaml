    stereotype: "FRAME_Low_Level_Data_Flow"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Data Flows are the movements of data between different components of the system. There are three types of data flows. The first type is data flows between Low-Level Functions. The second type is data flows between Low-Level Functions and Data Stores The third type is data flows between Low-Level Functions and Terminators/Actors.
