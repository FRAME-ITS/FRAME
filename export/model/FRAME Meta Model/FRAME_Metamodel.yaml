    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Physical Data Flows are the means of communication between Sub-systems, Modules, and Terminators/Actors in the Physical View of ITS. There are two types of Physical Data Flows: Internal, which link Sub-systems and Modules together; and External, which link Sub-systems and Modules to Terminators/Actors. The creation of a Physical View is always based on a particular Functional View, which must have passed the logical consistency checks before it can be used.
    links:
      - "Aggregation «component of» → FRAME_High_Level_Data_Flow"  # {5844534E-D51B-4666-97DD-10CB991BB962} → {35F631D7-65CE-4df9-A861-1B12E39AC463}
