  - name: "ITS_Domain"
    guid: "{1A23C9AA-C9E1-4572-9F33-D101F6A2937D}"
    type: "Artifact"
    stereotype: "FRAME_ITS_Domain"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The ITS domain specifies where the architecture of the ITS service will be applied. (Scope: What is in and what is out?)
      In the context of Intelligent Transport Systems (ITS), the ITS Domain is a concept that categorizes the diverse applications of ITS into specific fields of application. It applies sector-specific knowledge and additional architectural knowledge on ITS. The domain also defines the boundaries of the ITS system or service at the start of an ITS architecture project, distinguishing it from similar or adjacent systems or services.
  - name: "ITS_Service"
    guid: "{7153E4F6-663F-4457-B65B-207E5B95ED99}"
    type: "Class"
    stereotype: "FRAME_ITS_Service"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Field of Application": ""
    note: |
      The ITS service describes the idea and functional elements of the ITS service as well as framework conditions.
      The ITS Service is an architectural artifact that describes a value-added service provided by ITS actors in the field of transport, traffic, and mobility for end-users. The added value is created by combining technologies, organizations, processes, and people. The service can be delivered by a single actor or in cooperation with others, and it creates added value that may consist of individual benefits for mobile travelers, collective benefits for end-user groups or society, or a mixture of both.
