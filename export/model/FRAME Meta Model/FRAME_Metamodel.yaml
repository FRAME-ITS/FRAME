  - name: "FRAME_Datastore"
    guid: "{C16508B8-537D-40cd-B45A-513529E5781C}"
    type: "Object"
    stereotype: "FRAME_Datastore"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Data Stores are repositories of data. Many of them are managed by their own dedicated Low-Level Functions. They store data from, and provide data to, (usually) more than one other Low-Level Function. Thus, Data Stores will always be part of Functional Areas or High-Level Functions.
    links:
      - "Abstraction «is Type of» → Component"  # {ED1390F9-EACA-4b0c-9B8B-C0428E02C236} → {A3ECE56A-3A44-4971-9CEC-0D092A4DB634}
