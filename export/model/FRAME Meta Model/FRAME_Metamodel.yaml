  - name: "Role"
    guid: "{6919B163-FD91-4478-B0D6-0A11A723D27B}"
    type: "Object"
    stereotype: "FRAME_Role"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Key Issue": ""
      "Role Part Of Value Chain": ""
      "Role Value": ""
      "Role View": ""
    note: |
      Part of the ITS service chain, (partners contributing to the service delivery)
      The ITS Role is an architectural artifact that defines and semantically describes the stereotypes of ITS responsibilities, tasks, and capabilities that are typical and necessary for the value creation of ITS services. It is a significant component of ITS value-added chains for ITS information logistics and is taken by ITS actors and stakeholders depending on the requirements of the ITS service to be implemented. A single ITS actor or stakeholder can occupy one or more ITS roles. The role operates its capabilities, responsibilities, and tasks in the form of activities which, together with the activities of other ITS roles, constitute the ITS business process of an ITS service.
