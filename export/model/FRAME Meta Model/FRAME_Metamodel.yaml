    note: |
      The ITS Actor is part of an ITS value-added chain/network and directly involved in value creation. It contributes to the added value of ITS benefits by using its ITS capabilities as part of its activities. It usually also represents the interests of ITS stakeholders who are not directly involved in the ITS value chain but have strong associated interests. The ITS end-user is also considered a special ITS actor.
