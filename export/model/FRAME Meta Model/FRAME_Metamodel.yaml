  - name: "Fuctional Area"
    guid: "{21EEE2BA-B8F1-4519-AC3F-C983FE93983E}"
    type: "Activity"
    stereotype: "FRAME_Functional_Area"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      A Function, also known as a “process”, is an action that involves receiving or processing input data. This data is then either passed on to another function or sent out as information or control instructions to an external entity. Functions are categorized into different levels: High-Level Functions (HLF) and Low-Level Functions (LLF). HLFs contain a group of functions concerned with a specific part of data processing and always have component LLFs. LLFs, on the other hand, perform a specific part of the data input, process, or information output process and have no component functions. User needs are allocated to LLFs, which are the only functions used in the FRAME Methodology.
    links:
      - "Association «IN» → FRAME_High_Level_Data_Flow"  # {1C951316-4B3B-4080-9683-9892CB98BFF7} → {35F631D7-65CE-4df9-A861-1B12E39AC463}
