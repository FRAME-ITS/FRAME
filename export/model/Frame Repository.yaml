    note: |
      FRAME User Needs: the comprehensive set of User Needs that  provide a systematic starting point to any ITS implementation. It is split up into User Need Groups, which contains several Services, e.g. Traffic Management (User Need Group 7), or Travel Information (User Need Group 6). Within each Group there are Topics that are aspects of each Group and within each Group are Services, which may be described by one of more User Needs.  The User Needs are mapped to Low Level Functions in the FRAME Functional View. By selecting the set of User Needs that describes desired services the end user will be selecting the set of Low Level Functions that would be the starting point to build the Functional View of their desired system(s).
