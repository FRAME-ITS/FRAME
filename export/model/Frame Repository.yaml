  - name: "Text"
    guid: "{7AD8EC19-7772-4f0b-B7F4-FFC7FC107303}"
    type: "Text"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      FRAME Functional View: provides a comprehensive set of functionality that fulfils the requirements specified in the User Needs.  It is split up into Functional Areas, each of which contains functionality that supports particular types of ITS Services, e.g. Traffic Management (Functional Area F3), or Traveller Information (Functional Area F6).  The functionality is structured hierarchically within each Functional Area to make it easier to understand and to enable one part of the functionality to be modified without necessarily affecting all the other functionality in a Functional Area.  In some instances the functionality has been structure in a way that makes it easier to select particular parts for particular ITS Service implementation.
